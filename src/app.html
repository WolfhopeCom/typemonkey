<title>TypeMonkey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: phone-first single column app shell; sticky stat bar, screens swap in the middle, TypeMonkey talks from a speech bubble */
:root{
  --bg:#F2F5F1; --surface:#FFFEFB; --surface2:#E7EEE9; --fg:#1B2621; --muted:#5D6E66;
  --line:#D7E2DB; --accent:#FA7A20; --accent-ink:#2A1300; --banana:#FFC845; --leaf:#22986A;
  --bad:#D24A40; --code-bg:#17231E; --code-fg:#E3EEE8; --code-dim:#80A295; --console:#0F1814;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111B17; --surface:#182520; --surface2:#20302A; --fg:#E3EDE8; --muted:#9BB1A7;
  --line:#2B3C35; --accent:#FA8836; --accent-ink:#2A1300; --banana:#FCD064; --leaf:#41BE87;
  --bad:#F26D62; --code-bg:#0D1511; --code-fg:#E0ECE6; --code-dim:#6F9283; --console:#0A110E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111B17; --surface:#182520; --surface2:#20302A; --fg:#E3EDE8; --muted:#9BB1A7;
  --line:#2B3C35; --accent:#FA8836; --accent-ink:#2A1300; --banana:#FCD064; --leaf:#41BE87;
  --bad:#F26D62; --code-bg:#0D1511; --code-fg:#E0ECE6; --code-dim:#6F9283; --console:#0A110E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}
.app{max-width:720px;margin:0 auto;padding:12px 16px 40px;display:flex;flex-direction:column;gap:18px}
.stack{display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:8px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:1.35rem;background:none;border:0;color:var(--fg);padding:0}
.brand svg{width:38px;height:38px}
.brand b{color:var(--accent)}
.stats{margin-left:auto;display:flex;gap:6px}
.stat{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:800;font-size:.9rem;font-variant-numeric:tabular-nums}
.stat i{font-style:normal;font-size:.75rem;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
@media (max-width:400px){.brand .word{display:none}}

.buddy{display:flex;gap:12px;align-items:flex-end}
.buddy .tm{width:88px;height:88px;flex:none}
.buddy.bounce .tm{animation:bob .6s ease}
.mwrap{position:relative;display:inline-block;flex:none;line-height:0}
.mwrap .pet{position:absolute;right:-14px;bottom:-4px;width:46%;height:46%;filter:drop-shadow(0 2px 2px #0003)}
.buddy.bounce .pet{animation:bob .6s ease .15s}
@keyframes bob{40%{transform:translateY(-10px) rotate(-4deg)}}
.bubble{background:var(--surface);border:2px solid color-mix(in srgb,var(--fg) 72%,var(--surface));border-radius:18px 18px 18px 4px;padding:12px 14px;font-weight:700;min-width:0;flex:1}

.hero h1{font-size:clamp(2rem,7vw,2.8rem)}
.hero p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.label{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.courses{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.course{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--fg)}
.course .tag{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.course h3{font-size:1.3rem}
.course .meta{font-size:.85rem;color:var(--muted)}
.course.live{border:2px solid var(--accent)}
.course.locked{opacity:.7}
.mini{height:6px;background:var(--surface2);border-radius:999px;overflow:hidden;margin-top:4px}
.mini span{display:block;height:100%;background:var(--leaf)}
.pill{align-self:flex-start;font-size:.72rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:2px 9px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.go{background:var(--accent);color:var(--accent-ink)}
.pill.kid{background:var(--banana);color:var(--accent-ink)}
.pill.ok{background:var(--leaf);color:#fff}

.tools{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tools .tool:last-child:nth-child(odd){grid-column:1/-1}
@media (max-width:420px){.tool{padding:12px}.tool b{font-size:1.05rem}.tool span{font-size:.8rem}}
.tool{background:var(--code-bg);color:var(--code-fg);border:0;border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.tool b{font-family:var(--display);font-size:1.2rem}
.tool span{color:var(--code-dim);font-size:.88rem}

.unit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.unit-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.unit-head h3{font-size:1.15rem}
.unit-head .label{margin-left:auto}
.lessons{display:flex;flex-direction:column;gap:8px}
.lesson{display:flex;align-items:center;gap:12px;background:var(--surface2);border:0;border-radius:12px;padding:10px 12px;color:var(--fg);text-align:left;width:100%}
.lesson .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none;background:var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.lesson.open .dot{background:var(--accent);color:var(--accent-ink)}
.lesson.done .dot{background:var(--leaf);color:#fff}
.lesson.proj .dot{border-radius:10px}
.lesson .t{flex:1;min-width:0}
.lesson .t b{display:block}
.lesson .t span{font-size:.85rem;color:var(--muted)}
.lesson[disabled]{cursor:not-allowed;opacity:.62}
.lesson.next{background:color-mix(in srgb,var(--accent) 14%,var(--surface));box-shadow:inset 0 0 0 2px var(--accent)}
.lesson .t .nexttag{display:block;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.pickhint{margin:0;font-weight:700;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.85rem;padding:0;align-self:flex-start}

.paywall{background:var(--code-bg);color:var(--code-fg);border-radius:var(--r);padding:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.paywall div{flex:1;min-width:200px}
.paywall h3{font-size:1.25rem;color:var(--code-fg)}
.paywall p{margin:4px 0 0;color:var(--code-dim);font-size:.9rem}

.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:800;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.ghost{background:var(--surface2);color:var(--fg);box-shadow:0 4px 0 var(--line)}
.btn.banana{background:var(--banana);box-shadow:0 4px 0 color-mix(in srgb,var(--banana) 55%,#000)}
.btn.sm{padding:7px 12px;font-size:.88rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.progress{height:12px;background:var(--surface2);border-radius:999px;overflow:hidden;flex:1}
.progress span{display:block;height:100%;background:var(--leaf);border-radius:999px;transition:width .4s}
.lessonbar{display:flex;align-items:center;gap:12px}
.x{background:none;border:0;color:var(--muted);font-size:1.6rem;line-height:1;min-width:44px;min-height:44px;padding:0 4px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:1.55rem}
.card p{margin:0;max-width:62ch}
code.i{font-family:var(--mono);font-size:.88em;background:var(--surface2);padding:1px 6px;border-radius:6px;white-space:nowrap}

.editor{background:var(--code-bg);border-radius:12px;overflow:hidden;min-width:0}
.editor .head{display:flex;align-items:center;gap:8px;padding:8px 12px;color:var(--code-dim);font-family:var(--mono);font-size:.8rem;border-bottom:1px solid #ffffff14}
.editor .head span{margin-right:auto}
.editor textarea{display:block;width:100%;min-height:150px;resize:vertical;background:transparent;color:var(--code-fg);border:0;outline:0;padding:12px 14px;font-family:var(--mono);font-size:.92rem;line-height:1.6;tab-size:2;white-space:pre;overflow-x:auto}
.editor pre{margin:0;padding:12px 14px;color:var(--code-fg);font-family:var(--mono);font-size:.92rem;line-height:1.6;overflow-x:auto}
.run{background:var(--leaf);color:#fff;border:0;border-radius:8px;padding:5px 12px;font-weight:800;font-family:var(--body)}
.run[disabled]{opacity:.4;cursor:not-allowed}
.console{background:var(--console);color:#B8F5D3;font-family:var(--mono);font-size:.88rem;padding:10px 14px;min-height:44px;white-space:pre-wrap;word-break:break-word;border-top:1px solid #ffffff14}
.console .err{color:#FF9C92}
#fcode{white-space:pre-wrap;word-break:break-word}
.stdin{background:#0B1310;border-top:1px solid #ffffff14;color:var(--code-dim);font-size:.82rem}
.stdin summary{cursor:pointer;padding:6px 14px;list-style:none;font-weight:700;color:#BFE3D2}
.stdin summary::-webkit-details-marker{display:none}
.stdin summary span{font-weight:400;color:var(--code-dim)}
.editor .stdin textarea{min-height:0;height:auto;line-height:1.5;white-space:pre-wrap;color:#FFE9A8;background:#0F1A16}
.stdin textarea{display:block;width:100%;border:0;background:#0F1A16;color:#FFE9A8;font-family:var(--mono);font-size:.85rem;padding:8px 14px;resize:vertical;outline-offset:-3px}
.burst{position:fixed;left:50%;top:55%;pointer-events:none;z-index:60}
.burst span{position:absolute;font-size:1.6rem;animation:burst 1.3s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes burst{0%{transform:translate(0,0) rotate(0) scale(.4);opacity:1}70%{opacity:1}100%{transform:translate(var(--x),calc(var(--y) + 260px)) rotate(var(--r)) scale(1);opacity:0}}
.peek p{margin:4px 0}.peek.explain{border-style:solid;border-color:var(--accent)}
.testnote{color:var(--muted);font-size:.88rem;margin:4px 0 0}
.peek{margin-top:12px;background:var(--surface2);border:1px dashed var(--line);border-radius:12px;padding:10px 14px}
.peek ul{margin:6px 0 0;padding-left:20px}.peek li.ok{color:var(--leaf)}
.peek pre{margin:6px 0 0;font-family:var(--mono);font-size:.85rem;white-space:pre-wrap;overflow-x:auto}
.btn.nudge{animation:nudge 1.2s ease 2;border-color:var(--accent);color:var(--accent)}
@keyframes nudge{0%,100%{transform:none}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.btn.nudge{animation:none}}
/* Build a Game: the console becomes a little arcade screen */
.console.arcade{background:#170F2E;background-image:repeating-linear-gradient(0deg,#ffffff06 0 1px,transparent 1px 3px);color:#FFE36E;border-top:2px solid #7C5CFF}
.console.arcade .dim{color:#8D7FC0}
.console.arcade .err{color:#FF8FA3}
.arcade-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.72rem;letter-spacing:.12em;color:#B9A8FF;margin-bottom:6px}
.arcade-top button{background:#2A1F55;color:#E8E0FF;border:1px solid #5B47C7;border-radius:999px;padding:2px 10px;font-size:.72rem;letter-spacing:0}
.tiles{line-height:1.15;letter-spacing:0}
.arcade-win,.arcade-lose{margin-top:8px;padding:6px 10px;border-radius:10px;text-align:center;font-family:var(--display);font-size:1.05rem;letter-spacing:.06em;animation:pop .5s ease}
.arcade-win{background:#FFC83D;color:#2A1300}.arcade-lose{background:#3A2350;color:#FFB4C2}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.arcade-win,.arcade-lose{animation:none}}
/* TypeMonkey Jr. card on the home screen: the same banana yellow as the Unlock button, so the kids' section stands out */
.course.kids{background:var(--banana);border-color:var(--banana);color:#2A1300}
.course.kids .tag,.course.kids .meta{color:#5A3B00}
.course.kids .mini{background:#00000018}
.course.kids .mini span{background:#2A1300}
.course.kids .pill{background:#FFFFFF;color:#7A4E00}
.console .dim{color:#5E7E70}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--surface2);border:2px solid transparent;border-radius:12px;padding:12px 14px;color:var(--fg);font-weight:700}
.opt.mono{font-family:var(--mono);font-weight:600;white-space:pre-wrap}
.opt:hover:not([disabled]){border-color:var(--line)}
.opt.right{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 16%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.feedback{font-weight:700;border-radius:12px;padding:10px 14px}
.feedback pre{font-family:var(--mono);font-weight:600;font-size:.85rem;margin:6px 0 0;white-space:pre-wrap}
.feedback.good{background:color-mix(in srgb,var(--leaf) 16%,var(--surface))}
.feedback.bad{background:color-mix(in srgb,var(--bad) 14%,var(--surface))}

/* fill-in-the-blank + ordering */
.slot{font-family:var(--mono);font-size:.92rem;min-width:3.2em;padding:0 8px;margin:0 2px;border-radius:6px;border:2px dashed var(--code-dim);background:transparent;color:var(--banana);font-weight:600;line-height:1.5}
.slot.filled{border-style:solid;border-color:var(--banana)}
.slot.right{border-color:var(--leaf);color:#B8F5D3}
.slot.wrong{border-color:var(--bad);color:#FF9C92}
.tokens{display:flex;flex-wrap:wrap;gap:8px}
.token{font-family:var(--mono);font-weight:600;background:var(--surface2);border:2px solid var(--line);border-radius:10px;padding:8px 14px;color:var(--fg);box-shadow:0 3px 0 var(--line)}
.token[disabled]{opacity:.25}
.lines{display:flex;flex-direction:column;gap:6px;min-height:52px;background:var(--code-bg);border-radius:12px;padding:10px}
.lines.pick{background:transparent;padding:0}
.ln{font-family:var(--mono);font-size:.88rem;text-align:left;white-space:pre;overflow-x:auto;background:var(--surface2);border:2px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--fg)}
.lines:not(.pick) .ln{background:#ffffff0d;color:var(--code-fg);border-color:#ffffff1f}
.lines .ln.right{border-color:var(--leaf)}
.lines .ln.wrong{border-color:var(--bad)}
.empty{color:var(--code-dim);font-size:.85rem;font-family:var(--body);padding:6px}

.game-hud{display:flex;gap:10px;align-items:center;font-weight:800;font-variant-numeric:tabular-nums}
.timer{height:10px;flex:1;background:var(--surface2);border-radius:999px;overflow:hidden}
.timer span{display:block;height:100%;background:var(--banana);transition:width 1s linear}
.big{font-family:var(--display);font-size:3rem;font-weight:800;color:var(--accent);line-height:1}
.reward{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.reward div{background:var(--surface2);border-radius:12px;padding:12px;text-align:center}
.reward b{display:block;font-family:var(--display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.reward span{font-size:.8rem;color:var(--muted);font-weight:700}
.cert{border:3px solid var(--banana);border-radius:var(--r);padding:16px;text-align:center;background:color-mix(in srgb,var(--banana) 12%,var(--surface))}
.cert h3{font-size:1.5rem}

.langs{display:flex;gap:6px;flex-wrap:wrap}
.lang{border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 12px;font-weight:800;font-size:.88rem}
.lang[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.note{background:color-mix(in srgb,var(--banana) 18%,var(--surface));border-radius:12px;padding:10px 14px;font-weight:600;font-size:.92rem}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;max-width:calc(100% - 32px);z-index:9}
.foot{color:var(--muted);font-size:.8rem;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.foot .row{justify-content:center}
.restbl{overflow-x:auto;margin-bottom:6px}
.restbl table{border-collapse:collapse;font-family:var(--mono);font-size:.82rem;color:#B8F5D3}
.restbl th{color:#7FA394;text-align:left;font-weight:600;border-bottom:1px solid #ffffff22}
.restbl th,.restbl td{padding:4px 12px 4px 0;white-space:nowrap}
.restbl td.null{color:#5E7E70;font-style:italic}
/* web preview */
.webview{border-top:1px solid #ffffff14;background:#fff;min-height:72px;max-height:340px;overflow:auto}
/* SQL tables */
.tbl{display:flex;flex-direction:column;gap:4px;min-width:0}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.tbl table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:.82rem;font-variant-numeric:tabular-nums}
.tbl th{background:var(--surface2);text-align:left;font-weight:600;color:var(--muted)}
.tbl th,.tbl td{padding:5px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right}
.tbl td.null{color:var(--muted);font-style:italic}
.drawer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.drawer summary{cursor:pointer;font-weight:800}
.drawer[open]{display:flex;flex-direction:column;gap:12px}
/* Jr. mazes */
.maze{position:relative;display:grid;grid-template-columns:repeat(var(--w),1fr);width:min(100%,calc(var(--w) * 64px));aspect-ratio:var(--w) / var(--h);max-width:100%;align-self:center;border-radius:14px;overflow:hidden;background:#7FC77A}
.mc{display:grid;place-items:center;font-size:clamp(1.1rem,5vw,1.9rem)}
.mc.path{background:var(--path,#F3DFA8);box-shadow:inset 0 0 0 1px var(--pathline,#E5CC88)}
.mc.tree{background:var(--tree,#5FAE5A)}
.stage{position:relative;height:210px;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#7B4BC8 0%,transparent 65%),linear-gradient(#1E1238,#3B1F63 70%)}
.stage .ball{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:2rem;animation:ball 3s linear infinite;z-index:2}
@keyframes ball{50%{transform:translateX(-50%) rotate(180deg)}to{transform:translateX(-50%) rotate(360deg)}}
.stage .spot{position:absolute;top:0;width:90px;height:230px;background:linear-gradient(#FFE38A55,transparent 85%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);transform-origin:50% 0;opacity:.55;animation:spot 4s ease-in-out infinite alternate}
.stage .spot.l{left:12%;--a:20deg}.stage .spot.r{right:12%;--a:-20deg;animation-delay:-2s;background:linear-gradient(#8AE3FF55,transparent 85%)}
@keyframes spot{from{transform:rotate(var(--a))}to{transform:rotate(calc(var(--a) * -1))}}
.stage .floor{position:absolute;left:-10%;right:-10%;bottom:0;height:62px;display:grid;grid-template-columns:repeat(8,1fr);transform:perspective(220px) rotateX(48deg);transform-origin:bottom}
.stage .floor i{border:1px solid #0003;background:var(--c);opacity:.5;transition:opacity .2s}.stage.live .floor i{animation:tile .62s steps(1) infinite}.stage .floor i:nth-child(odd){animation-delay:-.31s}
@keyframes tile{50%{opacity:1;filter:brightness(1.4)}}
.stage .shadow{position:absolute;left:50%;bottom:30px;width:84px;height:16px;margin-left:-42px;border-radius:50%;background:#0006;transition:transform .2s}
.dancer{position:absolute;left:50%;bottom:34px;width:128px;height:128px;margin-left:-64px;z-index:1}.dancer svg{width:100%;height:100%}
.dlab{position:absolute;top:10px;left:10px;color:#fff;font-weight:900;font-size:1.05rem;background:#0005;border-radius:999px;padding:3px 12px;opacity:0;transition:opacity .15s;z-index:3}.dlab.on{opacity:1}
.beat{position:absolute;top:12px;right:12px;display:flex;gap:4px;z-index:3}.beat i{width:9px;height:9px;border-radius:50%;background:#fff4}.beat i.on{background:#FFD25C;box-shadow:0 0 8px #FFD25C}

/* Warm-ups: before a long challenge, show TypeMonkey's version with a few pieces missing, so you see the shape first */
const WARM_WORDS={js:["for","while","if","else","return","const","let","function","push","length","console","log","Math","class","new","this","of"],
  py:["for","while","if","elif","else","return","def","print","append","range","len","in","class","self","import"],
  java:["for","while","if","else","return","static","new","System","println","add","get","size","length","class","this","int","String","throw","try","catch"],
  cs:["for","foreach","while","if","else","return","static","new","Console","WriteLine","Add","Count","Length","class","int","string","throw","try","catch"],
  cpp:["for","while","if","else","return","int","std","cout","push_back","size","class","struct","void","double"],
  swift:["for","while","if","else","guard","return","func","let","var","print","append","count","in","struct","class","init","self","throw","try","switch","case"],
  sql:["SELECT","FROM","WHERE","ORDER","BY","GROUP","JOIN","ON","COUNT","SUM","AS","INSERT","INTO","VALUES","UPDATE","SET","LEFT","DESC"]};
function makeWarmup(s,kind){
  if(/\[\d\]/.test(s.hint||""))return null;
  const lines=newLines(s);if(lines.length<6)return null;
  const pool=WARM_WORDS[kind]||WARM_WORDS.js;const useSrc=(s.use||[]).map(u=>u[0].source).join(" ");
  const code=s.hint.split("\n");const newSet=new Set(lines);const picked=[];
  for(let li=0;li<code.length&&picked.length<3;li++){
    const line=code[li];if(!newSet.has(line))continue;
    const re=/[A-Za-z_][A-Za-z0-9_]*/g;let m;
    while((m=re.exec(line))){
      const w=m[0];const before=line.slice(0,m.index);
      if((before.split('"').length-1)%2||(before.split("'").length-1)%2||(before.split("`").length-1)%2)continue;
      if(before.includes("//")||before.includes("#")&&kind==="py")break;
      if(picked.some(p=>p.w===w))continue;
      if(!(pool.includes(w)||(w.length>2&&useSrc.includes(w))))continue;
      picked.push({li,at:m.index,w});break;
    }
  }
  if(picked.length<2)return null;
  picked.forEach((p,i)=>{const l=code[p.li];code[p.li]=l.slice(0,p.at)+"["+i+"]"+l.slice(p.at+p.w.length)});
  const blanks=picked.map(p=>p.w);
  const extra=pool.filter(w=>!blanks.includes(w)&&!s.hint.includes(w)).slice(0,2);
  return {type:"fill",auto:true,title:"Warm-up: "+s.title,body:`<p>This one's a bigger challenge, so first TypeMonkey will show you a way to do it. Fill in the missing pieces, then you'll write it yourself.</p>`,
    code:code.join("\n"),blanks,tokens:[...blanks,...extra],why:"Now you've seen how it fits together. Next, try writing it yourself (you can always tap 💡 Help)."};
}
function addWarmups(){

function rush(poolIn,secs,onEnd,onQuit){
  const pool=shuffle(poolIn);let i=0,score=0,left=secs,ended=false;
  const timer=setInterval(()=>{left--;const t=$("#tleft");if(t){t.textContent=left;$("#tbar").style.width=(left/secs*100)+"%"}if(left<=0)end()},1000);
  function end(){if(ended)return;ended=true;clearInterval(timer);sfx("complete");
    bump("rushes");if(score===pool.length&&pool.length>=5)bump("rushPerfect");S.stats.rushBest=Math.max(S.stats.rushBest||0,score);
    $("#screen").innerHTML=`<div class="stack"><div class="card" style="align-items:center;text-align:center"><div class="label">Time!</div><div class="big">${score}/${pool.length}</div><p>+${score*2} bananas · +${score*3} XP</p></div>
      ${buddy(score>=Math.ceil(pool.length*.8)?"Unreal speed. Are you secretly a monkey?":score>=pool.length/2?"Solid run! Practice makes it automatic.":"Good warm-up. These get easy fast.",score>=pool.length/2?"cheer":"happy")}
      <div class="row"><button class="btn" id="fin">Continue</button></div></div>`;
    $("#fin").onclick=()=>onEnd(score);}
  function round(){
    if(i>=pool.length)return end();
    const [code,opts,file="script.js",hint]=pool[i];const ord=shuffle(opts.map((o,k)=>k));
    $("#screen").innerHTML=`<div class="stack"><div class="game-hud"><button class="x" id="quitg" aria-label="Quit game">×</button><span>⏱ <span id="tleft">${left}</span>s</span><div class="timer"><span id="tbar" style="width:${left/secs*100}%"></span></div><span>🍌 ${score*2}</span></div>
      <div class="card"><div class="label">What prints? · ${i+1} of ${pool.length}</div><div class="editor"><div class="head"><span>${file}</span></div><pre>${esc(code)}</pre></div>
      ${hint||((code.match(/console\.log|print\(|println|WriteLine|cout|printf|Console\.Write/g)||[]).length>1||/\b(for|while|foreach|repeat)\b/.test(code))?`<p style="color:var(--muted);font-size:.85rem">${hint||"If it prints more than one line, the lines are shown with spaces between them."}</p>`:""}
      <div class="opts">${ord.map(k=>`<button class="opt mono" data-k="${k}">${esc(opts[k])}</button>`).join("")}</div></div></div>`;
    $("#quitg").onclick=()=>{clearInterval(timer);ended=true;onQuit()};
    $$(".opt").forEach(b=>b.onclick=()=>{
      const ok=+b.dataset.k===0;sfx(ok?"correct":"wrong");b.classList.add(ok?"right":"wrong");if(ok)score++;
      const meta=pool[i][4];if(!ok&&meta)missed(meta.lid+"#p"+meta.j,{kind:"pool",lid:meta.lid,j:meta.j});
      $$(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.k===0)x.classList.add("right")});
      setTimeout(()=>{i++;if(!ended)round()},ok?350:900);
    });
  }
  round();
}

const DAY=864e5,GAPS=[0,DAY,3*DAY,7*DAY];   // after each right answer: back in 1, 3, then 7 days; one more right = learned
function missed(key,item){
  const r=S.review[key];S.review[key]={...item,box:0,due:Date.now(),misses:(r?r.misses:0)+1};save();
  if(cur&&!cur.review)cur.missed=(cur.missed||0)+1;
}
function answered(ok){
  if(!cur)return;const st=cur.l.steps[cur.step];
  if(cur.review){
    const r=S.review[st._rv];cur.earned.reviewed=(cur.earned.reviewed||0)+1;
    if(r){if(ok){cur.earned.remembered=(cur.earned.remembered||0)+1;r.box++;if(r.box>=GAPS.length){delete S.review[st._rv];cur.earned.learned=(cur.earned.learned||0)+1}else r.due=Date.now()+GAPS[r.box]}
      else{r.box=0;r.due=Date.now()+10*60e3;r.misses++}save()}
    return;
  }
  if(!ok&&st._src)missed(st._src.key,st._src.item);
  else if(!ok&&cur.l.id&&!cur.practice)missed(cur.l.id+"#"+cur.step,{kind:"step",lid:cur.l.id,i:cur.step});
}

function seeded(seed){let h=2166136261>>>0;for(const ch of seed){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)>>>0}
  return ()=>{h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;return h/4294967296}}
const dailyDoneToday=()=>(S.daily||{}).last===dayStr(new Date());
function dailySteps(){
  const rnd=seeded("typemonkey-"+dayStr(new Date()));
  const started=(S.stats.started||[]).filter(id=>{const c=courseById(id);return c&&c.units&&!c.kids});
  const cids=started.length?started:((S.stats.started||[]).includes("jr")?["jr"]:["js"]);
  const cands=[];
  for(const cid of cids){const c=courseById(cid);for(const x of flat(c)){
    if(!x.l.steps||!(S.done.includes(x.l.id)||x.idx<2))continue;
    (x.l.pool||[]).forEach((p,j)=>cands.push({kind:"pool",c,l:x.l,j}));
    x.l.steps.forEach((q,i)=>{if(q.type==="quiz")cands.push({kind:"step",c,l:x.l,i})});
  }}
  const picks=[];while(picks.length<3&&cands.length){picks.push(cands.splice(Math.floor(rnd()*cands.length),1)[0])}
  return picks.map(pk=>{
    if(pk.kind==="pool"){const p=pk.l.pool[pk.j];return {type:"quiz",q:"What does this print?",code:p[0],opts:[...p[1]],a:0,mono:true,why:`It prints ${p[1][0].includes("\n")?"those lines":p[1][0]}.`,_course:pk.c,_from:pk.l.title,_src:{key:pk.l.id+"#p"+pk.j,item:{kind:"pool",lid:pk.l.id,j:pk.j}}}}
    return {...pk.l.steps[pk.i],_course:pk.c,_from:pk.l.title,_src:{key:pk.l.id+"#"+pk.i,item:{kind:"step",lid:pk.l.id,i:pk.i}}};
  });
}

/* ---------- Backup / restore: progress as a copyable code (TM1-<z|r><base64url>.<crc32>) ---------- */
const BK={
  crc(str){let c,crc=-1;for(let i=0;i<str.length;i++){c=(crc^str.charCodeAt(i))&255;for(let k=0;k<8;k++)c=c&1?(c>>>1)^0xEDB88320:c>>>1;crc=(crc>>>8)^c}return ((crc^-1)>>>0).toString(36).padStart(7,"0")},
  b64(bytes){let s="";for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")},
  unb64(s){const b=atob(s.replace(/-/g,"+").replace(/_/g,"/")+"===".slice((s.length+3)%4));const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u},
  async pipe(bytes,Stream){const st=new Blob([bytes]).stream().pipeThrough(new Stream("deflate-raw"));return new Uint8Array(await new Response(st).arrayBuffer())},
  async make(state){
    const json=new TextEncoder().encode(JSON.stringify(state));let flag="r",data=json;
    try{if(typeof CompressionStream!=="undefined"){const z=await BK.pipe(json,CompressionStream);if(z.length<json.length){flag="z";data=z}}}catch(e){flag="r";data=json}
    const body=flag+BK.b64(data);return "TM1-"+body+"."+BK.crc(body);
  },
  /* -> {state} or {error:"friendly message"} */
  async read(text){
    const t=String(text||"").replace(/\s+/g,"");
    if(!t)return {error:"Paste your backup code in the box first."};
    const m=t.match(/TM1-([zr])([A-Za-z0-9_-]+)\.([0-9a-z]{7})/i);
    if(!m)return {error:/TM\d-/i.test(t)&&!/TM1-/i.test(t)?"This code is from a different version of TypeMonkey. Try updating the app.":/TM1-/i.test(t)?"This code looks cut short. Make sure you copy the whole thing, from TM1- right to the end.":"That doesn't look like a TypeMonkey backup code. Backup codes start with TM1-."};
    const body=m[1]+m[2];
    if(BK.crc(body)!==m[3].toLowerCase())return {error:"Hmm, this code has a typo or a missing piece. Try copying the whole code again, from TM1- right to the end."};
    let bytes;try{bytes=BK.unb64(m[2])}catch(e){return {error:"This code got scrambled somewhere. Try copying it again."}}
    if(m[1]==="z"){
      if(typeof DecompressionStream==="undefined")return {error:"This browser is too old to open this backup. Try a newer browser."};
      try{bytes=await BK.pipe(bytes,DecompressionStream)}catch(e){return {error:"This code got scrambled somewhere. Try copying it again."}}
    }
    let st;try{st=JSON.parse(new TextDecoder().decode(bytes))}catch(e){return {error:"This code got scrambled somewhere. Try copying it again."}}
    if(!st||typeof st!=="object"||Array.isArray(st)||!Array.isArray(st.done))return {error:"This code doesn't have any TypeMonkey progress in it."};
    return {state:st};
  },
  summary(st){const n=st.done.length,b=Math.max(0,Math.floor(+st.bananas||0)),x=Math.max(0,Math.floor(+st.xp||0)),bd=Object.keys(st.badges||{}).length;
    return `This backup has <b>${n} lesson${n===1?"":"s"} done</b>, <b>${b} banana${b===1?"":"s"}</b> and <b>${x} XP</b>${bd?`, plus ${bd} badge${bd===1?"":"s"}`:""}${st.pro?". The full version is unlocked in it":""}.`},
  fileName(){const d=new Date();return `typemonkey-backup-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}.txt`}
};
async function copyText(text,ta){
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return true}}catch(e){}
  try{if(ta){ta.focus();ta.select();ta.setSelectionRange(0,text.length)}if(document.execCommand&&document.execCommand("copy"))return true}catch(e){}
  return false;
}
function backupPage(){
  const back=rerender===backupPage?home:rerender;rerender=backupPage;setMode(false);
  const ls=n=>`${n} lesson${n===1?"":"s"}`,bs=n=>`${n} banana${n===1?"":"s"}`;
  $("#screen").innerHTML=`<div class="stack">
    <div class="row"><button class="btn ghost sm" id="back">← Back</button></div>
    <section class="hero"><div class="label">Your progress</div><h1>Back up my progress</h1><p>Your lessons, bananas and outfits are saved on this device only. A backup code keeps them safe, and lets you move them to another phone, tablet or computer.</p></section>
    <div class="card bkcard">
      <h3>1. Save your backup code</h3>
      <p class="muted">You have ${ls(S.done.length)} done and ${bs(S.bananas)}. Copy this code and keep it somewhere safe, like a note or a message to yourself.</p>
      <textarea id="bkcode" class="bkcode" readonly rows="4" aria-label="Your backup code" spellcheck="false">Making your code…</textarea>
      <div class="row"><button class="btn" id="bkcopy" disabled>📋 Copy code</button><button class="btn ghost" id="bkdl" disabled>⬇️ Download backup file</button></div>
      <div id="bkcopied" aria-live="polite"></div>
    </div>
    <div class="card bkcard">
      <h3>2. Restore from a code</h3>
      <p class="muted">On your other device, paste the code here. TypeMonkey shows you what's inside before anything changes.</p>
      <textarea id="bkin" class="bkcode" rows="4" aria-label="Paste a backup code" placeholder="Paste a code that starts with TM1-" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
      <div class="row"><button class="btn" id="bkcheck">Check code</button><button class="btn ghost" id="bkload">📂 Load backup file</button><input type="file" id="bkfile" accept=".txt,text/plain" hidden></div>
      <div id="bkresult" aria-live="polite"></div>
    </div>
    ${buddy("Tip: make a fresh backup code every few lessons, so it's always up to date!","happy")}
  </div>`;
  $("#back").onclick=()=>back();
  let code="";
  BK.make(S).then(c=>{code=c;const ta=$("#bkcode");if(!ta)return;ta.value=c;$("#bkcopy").disabled=false;$("#bkdl").disabled=false})
    .catch(()=>{const ta=$("#bkcode");if(ta)ta.value="Sorry, TypeMonkey couldn't make a backup code on this device."});
  $("#bkcode").onfocus=e=>e.target.select();
  $("#bkcopy").onclick=async()=>{const ok=await copyText(code,$("#bkcode"));
    $("#bkcopied").innerHTML=`<div class="feedback ${ok?"good":"bad"}">${ok?"✓ Copied! Now paste it somewhere safe.":"Your device didn't let TypeMonkey copy it. The code is selected, so copy it yourself (long-press, then Copy)."}</div>`;
    if(!ok){const ta=$("#bkcode");ta.focus();ta.select()}};
  $("#bkdl").onclick=()=>{try{const blob=new Blob([`TypeMonkey backup, made ${new Date().toLocaleString()}\nTo restore: open TypeMonkey, go to Settings > Back up my progress, then tap Load backup file (or paste the code below).\n\n${code}\n`],{type:"text/plain"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=BK.fileName();document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast("Backup file saved!")}catch(e){toast("Your device couldn't save a file. Use Copy code instead.")}};
  const check=async(text)=>{const r=await BK.read(text);const box=$("#bkresult");if(!box)return;
    if(r.error){box.innerHTML=`<div class="feedback bad">${esc(r.error)}</div>`;return}
    box.innerHTML=`<div class="feedback good">✓ ${BK.summary(r.state)}<p style="margin:6px 0 0"><b>Replace the progress on this device with it?</b> What's here now (${ls(S.done.length)}, ${bs(S.bananas)}) will be replaced.</p>
      <div class="row" style="margin-top:10px"><button class="btn sm" id="bkyes">Yes, restore it</button><button class="btn ghost sm" id="bkno">Cancel</button></div></div>`;
    $("#bkno").onclick=()=>box.innerHTML="";
    $("#bkyes").onclick=()=>{S=normState(r.state);save();applySettings();toast(`Welcome back! ${ls(S.done.length)} and ${bs(S.bananas)} restored.`);home()}};
  $("#bkcheck").onclick=()=>check($("#bkin").value);
  $("#bkload").onclick=()=>$("#bkfile").click();
  $("#bkfile").onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;
    if(f.size>5e6){$("#bkresult").innerHTML=`<div class="feedback bad">That file is too big to be a TypeMonkey backup.</div>`;return}
    const rd=new FileReader();rd.onload=()=>{const txt=String(rd.result||"");const m=txt.match(/TM1-\S+/i);$("#bkin").value=m?m[0]:txt.slice(0,2000);check(m?m[0]:txt)};
    rd.onerror=()=>{$("#bkresult").innerHTML=`<div class="feedback bad">TypeMonkey couldn't open that file. Try again, or paste the code instead.</div>`};rd.readAsText(f);e.target.value=""};
  $("#foot").innerHTML="";window.scrollTo(0,0);
}

/* ---------- Grown-up check (required by app stores for purchases in apps for kids) ---------- */
function grownUpGate(onPass){
  const a=6+Math.floor(Math.random()*4),b=6+Math.floor(Math.random()*4),ans=a*b;
  const opts=shuffle([ans,ans+a,ans-b]);
  const g=document.createElement("div");g.className="gate";g.setAttribute("role","dialog");g.setAttribute("aria-label","Grown-up check");
  g.innerHTML=`<div class="card"><div class="label">Grown-ups only</div><h2>Ask a parent or guardian</h2><p>To continue, answer: what is <b>${a} × ${b}</b>?</p>
    <div class="opts">${opts.map(o=>`<button class="opt" data-v="${o}">${o}</button>`).join("")}</div><button class="btn ghost sm" id="gx">Cancel</button></div>`;
  document.body.appendChild(g);
  const close=()=>g.remove();
  g.querySelector("#gx").onclick=close;
  g.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{close();if(+b.dataset.v===ans)onPass();else toast("That's not quite right. Ask a grown-up for help!")});
}
