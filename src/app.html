<title>TypeMonkey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: phone-first single column app shell; sticky stat bar, screens swap in the middle, TypeMonkey talks from a speech bubble */
:root{
  --bg:#EEF4F1; --surface:#FFFFFF; --surface2:#E3ECE7; --fg:#15211C; --muted:#5B6D65;
  --line:#CFDDD5; --accent:#FF7A1A; --accent-ink:#2A1300; --banana:#FFC83D; --leaf:#1F9D63;
  --bad:#D9443A; --code-bg:#14201B; --code-fg:#E6F2EC; --code-dim:#7FA394;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1714; --surface:#16231E; --surface2:#1E2E28; --fg:#E9F3EE; --muted:#9AB2A7;
  --line:#2A3D35; --accent:#FF8A33; --accent-ink:#2A1300; --banana:#FFD25C; --leaf:#3CC486;
  --bad:#FF6B5E; --code-bg:#0A120F; --code-fg:#E6F2EC; --code-dim:#6E9283; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1714; --surface:#16231E; --surface2:#1E2E28; --fg:#E9F3EE; --muted:#9AB2A7;
  --line:#2A3D35; --accent:#FF8A33; --accent-ink:#2A1300; --banana:#FFD25C; --leaf:#3CC486;
  --bad:#FF6B5E; --code-bg:#0A120F; --code-fg:#E6F2EC; --code-dim:#6E9283; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}
.app{max-width:720px;margin:0 auto;padding:12px 16px 40px;display:flex;flex-direction:column;gap:18px}
.stack{display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:8px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:1.35rem;background:none;border:0;color:var(--fg);padding:0}
.brand svg{width:38px;height:38px}
.brand b{color:var(--accent)}
.stats{margin-left:auto;display:flex;gap:6px}
.stat{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:800;font-size:.9rem;font-variant-numeric:tabular-nums}
.stat i{font-style:normal;font-size:.75rem;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
@media (max-width:400px){.brand .word{display:none}}

.buddy{display:flex;gap:12px;align-items:flex-end}
.buddy .tm{width:88px;height:88px;flex:none}
.buddy.bounce .tm{animation:bob .6s ease}
.mwrap{position:relative;display:inline-block;flex:none;line-height:0}
.mwrap .pet{position:absolute;right:-14px;bottom:-4px;width:46%;height:46%;filter:drop-shadow(0 2px 2px #0003)}
.buddy.bounce .pet{animation:bob .6s ease .15s}
@keyframes bob{40%{transform:translateY(-10px) rotate(-4deg)}}
.bubble{background:var(--surface);border:2px solid var(--fg);border-radius:18px 18px 18px 4px;padding:12px 14px;font-weight:700;min-width:0;flex:1}

.hero h1{font-size:clamp(2rem,7vw,2.8rem)}
.hero p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.label{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.courses{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.course{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--fg)}
.course .tag{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.course h3{font-size:1.3rem}
.course .meta{font-size:.85rem;color:var(--muted)}
.course.live{border:2px solid var(--accent)}
.course.locked{opacity:.7}
.mini{height:6px;background:var(--surface2);border-radius:999px;overflow:hidden;margin-top:4px}
.mini span{display:block;height:100%;background:var(--leaf)}
.pill{align-self:flex-start;font-size:.72rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:2px 9px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.go{background:var(--accent);color:var(--accent-ink)}
.pill.kid{background:var(--banana);color:var(--accent-ink)}
.pill.ok{background:var(--leaf);color:#fff}

.tools{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tools .tool:last-child:nth-child(odd){grid-column:1/-1}
@media (max-width:420px){.tool{padding:12px}.tool b{font-size:1.05rem}.tool span{font-size:.8rem}}
.tool{background:var(--code-bg);color:var(--code-fg);border:0;border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.tool b{font-family:var(--display);font-size:1.2rem}
.tool span{color:var(--code-dim);font-size:.88rem}

.unit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.unit-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.unit-head h3{font-size:1.15rem}
.unit-head .label{margin-left:auto}
.lessons{display:flex;flex-direction:column;gap:8px}
.lesson{display:flex;align-items:center;gap:12px;background:var(--surface2);border:0;border-radius:12px;padding:10px 12px;color:var(--fg);text-align:left;width:100%}
.lesson .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none;background:var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.lesson.open .dot{background:var(--accent);color:var(--accent-ink)}
.lesson.done .dot{background:var(--leaf);color:#fff}
.lesson.proj .dot{border-radius:10px}
.lesson .t{flex:1;min-width:0}
.lesson .t b{display:block}
.lesson .t span{font-size:.85rem;color:var(--muted)}
.lesson[disabled]{cursor:not-allowed;opacity:.62}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.85rem;padding:0;align-self:flex-start}

.paywall{background:var(--code-bg);color:var(--code-fg);border-radius:var(--r);padding:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.paywall div{flex:1;min-width:200px}
.paywall h3{font-size:1.25rem;color:var(--code-fg)}
.paywall p{margin:4px 0 0;color:var(--code-dim);font-size:.9rem}

.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:800;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.ghost{background:var(--surface2);color:var(--fg);box-shadow:0 4px 0 var(--line)}
.btn.banana{background:var(--banana);box-shadow:0 4px 0 color-mix(in srgb,var(--banana) 55%,#000)}
.btn.sm{padding:7px 12px;font-size:.88rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.progress{height:12px;background:var(--surface2);border-radius:999px;overflow:hidden;flex:1}
.progress span{display:block;height:100%;background:var(--leaf);border-radius:999px;transition:width .4s}
.lessonbar{display:flex;align-items:center;gap:12px}
.x{background:none;border:0;color:var(--muted);font-size:1.6rem;line-height:1;padding:0 4px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:1.55rem}
.card p{margin:0;max-width:62ch}
code.i{font-family:var(--mono);font-size:.88em;background:var(--surface2);padding:1px 6px;border-radius:6px;white-space:nowrap}

.editor{background:var(--code-bg);border-radius:12px;overflow:hidden;min-width:0}
.editor .head{display:flex;align-items:center;gap:8px;padding:8px 12px;color:var(--code-dim);font-family:var(--mono);font-size:.8rem;border-bottom:1px solid #ffffff14}
.editor .head span{margin-right:auto}
.editor textarea{display:block;width:100%;min-height:150px;resize:vertical;background:transparent;color:var(--code-fg);border:0;outline:0;padding:12px 14px;font-family:var(--mono);font-size:.92rem;line-height:1.6;tab-size:2;white-space:pre;overflow-x:auto}
.editor pre{margin:0;padding:12px 14px;color:var(--code-fg);font-family:var(--mono);font-size:.92rem;line-height:1.6;overflow-x:auto}
.run{background:var(--leaf);color:#fff;border:0;border-radius:8px;padding:5px 12px;font-weight:800;font-family:var(--body)}
.run[disabled]{opacity:.4;cursor:not-allowed}
.console{background:#000;color:#B8F5D3;font-family:var(--mono);font-size:.88rem;padding:10px 14px;min-height:44px;white-space:pre-wrap;word-break:break-word;border-top:1px solid #ffffff14}
.console .err{color:#FF9C92}
/* Build a Game: the console becomes a little arcade screen */
.console.arcade{background:#170F2E;background-image:repeating-linear-gradient(0deg,#ffffff06 0 1px,transparent 1px 3px);color:#FFE36E;border-top:2px solid #7C5CFF}
.console.arcade .dim{color:#8D7FC0}
.console.arcade .err{color:#FF8FA3}
.arcade-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.72rem;letter-spacing:.12em;color:#B9A8FF;margin-bottom:6px}
.arcade-top button{background:#2A1F55;color:#E8E0FF;border:1px solid #5B47C7;border-radius:999px;padding:2px 10px;font-size:.72rem;letter-spacing:0}
.tiles{line-height:1.15;letter-spacing:0}
.arcade-win,.arcade-lose{margin-top:8px;padding:6px 10px;border-radius:10px;text-align:center;font-family:var(--display);font-size:1.05rem;letter-spacing:.06em;animation:pop .5s ease}
.arcade-win{background:#FFC83D;color:#2A1300}.arcade-lose{background:#3A2350;color:#FFB4C2}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.arcade-win,.arcade-lose{animation:none}}
/* TypeMonkey Jr. card on the home screen: sunny yellow so the kids' section stands out */
.course.kids{background:#FFE58A;border-color:#F2C230;color:#2A1F00}
.course.kids .tag,.course.kids .meta{color:#6B5300}
.course.kids .mini{background:#F7D35A}
.course.kids .pill{background:#FFFFFF;color:#7A4E00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .course.kids{background:#4A3B0E;border-color:#B88F1E;color:#FFF3C9}:root:not([data-theme="light"]) .course.kids .tag,:root:not([data-theme="light"]) .course.kids .meta{color:#E8D08A}:root:not([data-theme="light"]) .course.kids .mini{background:#6A5414}}
:root[data-theme="dark"] .course.kids{background:#4A3B0E;border-color:#B88F1E;color:#FFF3C9}
:root[data-theme="dark"] .course.kids .tag,:root[data-theme="dark"] .course.kids .meta{color:#E8D08A}
:root[data-theme="dark"] .course.kids .mini{background:#6A5414}
.console .dim{color:#5E7E70}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--surface2);border:2px solid transparent;border-radius:12px;padding:12px 14px;color:var(--fg);font-weight:700}
.opt.mono{font-family:var(--mono);font-weight:600;white-space:pre-wrap}
.opt:hover:not([disabled]){border-color:var(--line)}
.opt.right{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 16%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.feedback{font-weight:700;border-radius:12px;padding:10px 14px}
.feedback pre{font-family:var(--mono);font-weight:600;font-size:.85rem;margin:6px 0 0;white-space:pre-wrap}
.feedback.good{background:color-mix(in srgb,var(--leaf) 16%,var(--surface))}
.feedback.bad{background:color-mix(in srgb,var(--bad) 14%,var(--surface))}

/* fill-in-the-blank + ordering */
.slot{font-family:var(--mono);font-size:.92rem;min-width:3.2em;padding:0 8px;margin:0 2px;border-radius:6px;border:2px dashed var(--code-dim);background:transparent;color:var(--banana);font-weight:600;line-height:1.5}
.slot.filled{border-style:solid;border-color:var(--banana)}
.slot.right{border-color:var(--leaf);color:#B8F5D3}
.slot.wrong{border-color:var(--bad);color:#FF9C92}
.tokens{display:flex;flex-wrap:wrap;gap:8px}
.token{font-family:var(--mono);font-weight:600;background:var(--surface2);border:2px solid var(--line);border-radius:10px;padding:8px 14px;color:var(--fg);box-shadow:0 3px 0 var(--line)}
.token[disabled]{opacity:.25}
.lines{display:flex;flex-direction:column;gap:6px;min-height:52px;background:var(--code-bg);border-radius:12px;padding:10px}
.lines.pick{background:transparent;padding:0}
.ln{font-family:var(--mono);font-size:.88rem;text-align:left;white-space:pre;overflow-x:auto;background:var(--surface2);border:2px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--fg)}
.lines:not(.pick) .ln{background:#ffffff0d;color:var(--code-fg);border-color:#ffffff1f}
.lines .ln.right{border-color:var(--leaf)}
.lines .ln.wrong{border-color:var(--bad)}
.empty{color:var(--code-dim);font-size:.85rem;font-family:var(--body);padding:6px}

.game-hud{display:flex;gap:10px;align-items:center;font-weight:800;font-variant-numeric:tabular-nums}
.timer{height:10px;flex:1;background:var(--surface2);border-radius:999px;overflow:hidden}
.timer span{display:block;height:100%;background:var(--banana);transition:width 1s linear}
.big{font-family:var(--display);font-size:3rem;font-weight:800;color:var(--accent);line-height:1}
.reward{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.reward div{background:var(--surface2);border-radius:12px;padding:12px;text-align:center}
.reward b{display:block;font-family:var(--display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.reward span{font-size:.8rem;color:var(--muted);font-weight:700}
.cert{border:3px solid var(--banana);border-radius:var(--r);padding:16px;text-align:center;background:color-mix(in srgb,var(--banana) 12%,var(--surface))}
.cert h3{font-size:1.5rem}

.langs{display:flex;gap:6px;flex-wrap:wrap}
.lang{border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 12px;font-weight:800;font-size:.88rem}
.lang[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.note{background:color-mix(in srgb,var(--banana) 18%,var(--surface));border-radius:12px;padding:10px 14px;font-weight:600;font-size:.92rem}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;max-width:calc(100% - 32px);z-index:9}
.foot{color:var(--muted);font-size:.8rem;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.foot .row{justify-content:center}
.restbl{overflow-x:auto;margin-bottom:6px}
.restbl table{border-collapse:collapse;font-family:var(--mono);font-size:.82rem;color:#B8F5D3}
.restbl th{color:#7FA394;text-align:left;font-weight:600;border-bottom:1px solid #ffffff22}
.restbl th,.restbl td{padding:4px 12px 4px 0;white-space:nowrap}
.restbl td.null{color:#5E7E70;font-style:italic}
/* web preview */
.webview{border-top:1px solid #ffffff14;background:#fff;min-height:72px;max-height:340px;overflow:auto}
/* SQL tables */
.tbl{display:flex;flex-direction:column;gap:4px;min-width:0}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.tbl table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:.82rem;font-variant-numeric:tabular-nums}
.tbl th{background:var(--surface2);text-align:left;font-weight:600;color:var(--muted)}
.tbl th,.tbl td{padding:5px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right}
.tbl td.null{color:var(--muted);font-style:italic}
.drawer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.drawer summary{cursor:pointer;font-weight:800}
.drawer[open]{display:flex;flex-direction:column;gap:12px}
/* Jr. mazes */
.maze{position:relative;display:grid;grid-template-columns:repeat(var(--w),1fr);width:min(100%,calc(var(--w) * 64px));aspect-ratio:var(--w) / var(--h);max-width:100%;align-self:center;border-radius:14px;overflow:hidden;background:#7FC77A}
.mc{display:grid;place-items:center;font-size:clamp(1.1rem,5vw,1.9rem)}
.mc.path{background:#F3DFA8;box-shadow:inset 0 0 0 1px #E5CC88}
.mc.tree{background:#5FAE5A}
.mk{position:absolute;width:calc(100% / var(--w));height:calc(100% / var(--h));display:grid;place-items:center;transition:left .32s ease,top .32s ease,transform .25s ease;pointer-events:none}
.mface{width:82%;height:82%;display:grid;place-items:center}.mface svg{width:100%;height:100%;filter:drop-shadow(0 2px 2px #0004)}
.arr{position:absolute;right:-2px;bottom:-2px;width:46%;height:46%;display:grid;place-items:center;background:#14201B;color:#FFD25C;border-radius:50%;font-size:clamp(.7rem,3vw,1rem);font-weight:900;transition:transform .25s ease}
.prog{display:flex;flex-wrap:wrap;gap:6px;min-height:52px;background:var(--code-bg);border-radius:12px;padding:8px;align-items:center}
.chip{font-size:1.2rem;min-width:44px;height:44px;padding:0 6px;white-space:nowrap;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:800}
.repblk{display:flex;flex-wrap:wrap;gap:4px;align-items:center;border:2px solid var(--banana);border-radius:12px;padding:4px}
.repblk.open{border-style:dashed}
.repn,.repclose{border:0;border-radius:8px;background:var(--banana);color:var(--accent-ink);font-weight:800;padding:8px 10px}
.repclose{background:var(--surface2);color:var(--fg)}
.palette{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.blk{display:flex;align-items:center;gap:8px;justify-content:center;border:0;border-radius:14px;padding:12px;font-weight:800;font-size:1rem;color:var(--accent-ink);background:var(--banana);box-shadow:0 4px 0 color-mix(in srgb,var(--banana) 55%,#000)}
.blk span{font-size:1.4rem;white-space:nowrap}
.blk.b-fwd{background:var(--accent);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.blk.b-rep,.blk.b-until{background:var(--leaf);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--leaf) 60%,#000)}
.blk.b-ifR,.blk.b-ifL{background:#7C5CFF;color:#fff;box-shadow:0 4px 0 #5A3FD0}
.repblk.until{border-color:var(--leaf)}
.blk.b-call{background:#FF6FAE;color:#fff;box-shadow:0 4px 0 #C93E80}
.lanes{display:flex;gap:6px}
.lane{flex:1;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:8px;font-weight:800}
.lane[aria-pressed="true"]{border-color:#FF6FAE;background:color-mix(in srgb,#FF6FAE 14%,var(--surface))}
.prog.fprog{background:#3A1730}
.prog.active{outline:3px solid #FF6FAE;outline-offset:2px}
span.repn{display:inline-block}
.blk:active{transform:translateY(3px)}
.due{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:.85rem;font-family:var(--body);vertical-align:middle}
.shopstage{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stage-monkey .tm{width:120px;height:136px}
.stage-info{min-width:0}.stage-info p{margin:4px 0 0;color:var(--muted)}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.shopitem{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--fg);text-align:center}
.shopitem.on{border-color:var(--leaf)}
.shopitem .pill{align-self:center}
.mini-monkey .tm{width:72px;height:82px}
.shopitem{position:relative}
.shopitem.away{opacity:.55}
.season{position:absolute;top:6px;left:6px;font-size:.68rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.legal h3{font-size:1.1rem;margin-top:6px}
.legal p{color:var(--fg);line-height:1.6}
.gate{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,#000 55%,transparent);display:grid;place-items:center;padding:16px}
.gate .card{max-width:420px;width:100%}
.daily{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,color-mix(in srgb,var(--banana) 35%,var(--surface)),var(--surface));border:2px solid var(--banana);border-radius:var(--r);padding:12px 14px;text-align:left;color:var(--fg)}
.daily.done{border-color:var(--line);background:var(--surface)}
.daily .dicon{font-size:1.8rem}
.daily .dtext{flex:1;min-width:0;display:flex;flex-direction:column}
.daily .dtext b{font-family:var(--display);font-size:1.15rem}
.daily .dtext span{color:var(--muted);font-size:.88rem}
.badgegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;opacity:.7}
.badge.on{opacity:1;border:2px solid var(--banana)}
.badge .bicon{font-size:2.2rem;line-height:1.2}
.badge span{font-size:.82rem;color:var(--muted)}
.badge .pill{margin-top:4px}
.celebrate{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,#000 55%,transparent);display:grid;place-items:center;padding:16px}
.celebrate .card{max-width:360px;width:100%;text-align:center;align-items:center;position:relative;overflow:hidden}
.badge-big{font-size:4rem;line-height:1;animation:pop .6s ease}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti span{position:absolute;top:-10%;left:calc(var(--i) * 7%);font-size:1.2rem;animation:fall 1.6s ease-in forwards;animation-delay:calc(var(--i) * .07s)}
@keyframes fall{to{transform:translateY(520px) rotate(360deg);opacity:0}}
.gear{background:var(--surface);border:1px solid var(--line);color:var(--fg);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;padding:0;flex:none}
.setlist{gap:4px}
.setlist h3{font-size:1.1rem;margin-bottom:4px}
.setrow{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;padding-block:10px;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0}
.setrow>div:first-child{min-width:0;flex:1 1 180px;display:flex;flex-direction:column}
.setrow span{color:var(--muted);font-size:.88rem}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--fg);font-weight:800;font-size:.88rem;padding:7px 12px;border-radius:9px}
.seg button[aria-checked="true"]{background:var(--surface);box-shadow:0 1px 3px #0002;color:var(--accent)}
.unlocked{text-align:center;font-weight:800;color:var(--leaf);background:color-mix(in srgb,var(--leaf) 12%,var(--surface));border-radius:var(--r);padding:14px}
html.bigtext{font-size:112.5%}html.bigtext body{font-size:18px}
html.calm *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

        if(ch==='"'||ch==="'"||ch==="`")qq=ch;else if("([{".includes(ch))d++;else if(")]}".includes(ch))d--;

const norm=l=>{l=String(l).trim();return /^[\[{]/.test(l)?l.replace(/\s+/g,""):l};
function checkOut(st,out){
  const err=out.find(o=>o[0]==="err");
  if(err)return [false,"Your code hit an error. Read the red line in the console: it says what went wrong and usually which line."];
  const logs=out.filter(o=>o[0]==="log").map(o=>o[1]);
  if(st.out){
    const ok=st.out.length===logs.length&&st.out.every((e,i)=>norm(e)===norm(logs[i]));
    if(!ok)return [false,"Close! The output doesn't match yet.",`Expected:\n${st.out.join("\n")}\n\nYou printed:\n${logs.join("\n")||"(nothing)"}`];
  }
  for(const [re,msg] of st.outRe||[])if(!logs.some(l=>re.test(l)))return [false,msg];
  return [true];
}
async function grade(st,code,kind="js"){
  const run=RUNNERS[kind];
  for(const [re,msg] of st.use||[])if(!re.test(code))return [false,msg];
  const r=checkOut(st,await run(code));if(!r[0])return r;
  for(const [find,rep,lines] of st.variants||[]){
    if(!find.test(code))continue;
    const r2=checkOut({out:lines},await run(code.replace(find,rep)));
    if(!r2[0])return [false,`Works for this example, but I changed the starting value (${rep}) and it broke. Make sure your code uses the variables instead of fixed answers.`,r2[2]];
  }
  return [true,st.win||pick(WINS)];
}

function wireEditor(id,after,kind){
  const ta=$("#code-"+id);if(!ta)return;
  ta.addEventListener("keydown",e=>{if(e.key==="Tab"){e.preventDefault();const s=ta.selectionStart;ta.value=ta.value.slice(0,s)+"  "+ta.value.slice(ta.selectionEnd);ta.selectionStart=ta.selectionEnd=s+2}});
  const out=$("#out-"+id),web=out.classList.contains("webview");
  if(web)renderWeb(out,ta.value);
  $("#run-"+id).onclick=async()=>{if(web){renderWeb(out,ta.value);after&&after(ta.value);return}
    const k=kind||(cur?kindOf(cur.c):"js");ranLang(k);const res=await RUNNERS[k](ta.value);paintConsole(out,res,PRINT_HINT[k]);after&&after(ta.value,res)};
}

function fill(s){

  const toks=shuffle(s.tokens.map((t,i)=>i));

    <div class="editor"><div class="head"><span>${cur.c.lang}</span></div><pre id="fcode"></pre></div>
    <div class="tokens" id="toks">${toks.map(i=>`<button class="token" data-t="${i}">${esc(s.tokens[i])}</button>`).join("")}</div><div id="fb"></div></div>
    <div id="bud">${buddy("Tap a piece to drop it in the next blank. Tap a blank to take it back.","think")}</div>
    <div class="row"><button class="btn" id="check" disabled>Check</button><button class="btn" id="go" hidden>Continue</button></div>`);
  const draw=(marks)=>{
    $("#fcode").innerHTML=esc(s.code).replace(/\[(\d)\]/g,(m,d)=>{const t=slots[d];const mk=marks?marks[d]:"";

  };

  $$(".token").forEach(b=>b.onclick=()=>{const e=slots.indexOf(null);if(e<0)return;slots[e]=+b.dataset.t;sync()});

    tries++;const marks=slots.map((t,i)=>s.tokens[t]===s.blanks[i]?"right":"wrong");const ok=!marks.includes("wrong");
    draw(marks);
    if(ok||tries>=2){doneF=true;$("#check").hidden=true;$("#go").hidden=false;$$(".token").forEach(b=>b.disabled=true);answered(ok&&tries===1)}
    if(ok){award(tries===1?15:8);$("#fb").innerHTML=`<div class="feedback good">✓ ${esc(s.why)}</div>`;$("#bud").innerHTML=buddy(pick(WINS),"cheer")}
    else if(tries>=2){$("#fb").innerHTML=`<div class="feedback bad">The answer is: ${s.blanks.map(esc).join(" , ")}. ${esc(s.why)}</div>`;$("#bud").innerHTML=buddy("Tricky one! Now you've seen it, it'll stick.","oops")}

function order(s){

    <div class="lines" id="ans"></div><div class="label">Tap the lines in order</div><div class="lines pick" id="pool"></div><div id="fb"></div></div>
    <div id="bud">${buddy("Tap lines to add them. Tap a placed line to send it back.","think")}</div>
    <div class="row"><button class="btn" id="check" disabled>Check</button><button class="btn" id="go" hidden>Continue</button></div>`);
  const draw=(marks)=>{
    $("#ans").innerHTML=picked.length?picked.map((i,k)=>`<button class="ln ${marks?marks[k]:""}" data-k="${k}">${esc(s.lines[i])}</button>`).join(""):'<span class="empty">Your program builds here</span>';

    tries++;

    else if(tries>=2){picked=s.lines.map((l,i)=>i);draw(picked.map(()=>"right"));$("#fb").innerHTML=`<div class="feedback bad">Here's the right order. ${esc(s.why)}</div>`;$("#bud").innerHTML=buddy("Order is everything in code. You'll get the next one!","oops")}
    else{draw(marks);$("#fb").innerHTML=`<div class="feedback bad">The red lines are in the wrong spot. Tap them to take them back out.</div>`;$("#bud").innerHTML=buddy("Almost! Rearrange the red ones.","oops")}
  };
  draw();$("#go").onclick=next;
}

/* ---------- TypeMonkey Jr.: maze puzzles ---------- */
const DIRS={N:[0,-1],E:[1,0],S:[0,1],W:[-1,0]},LEFT={N:"W",W:"S",S:"E",E:"N"},RIGHT={N:"E",E:"S",S:"W",W:"N"},ROT={E:0,S:90,W:180,N:270};
const BLOCKS={fwd:{icon:"👣",label:"Forward"},left:{icon:"↺",label:"Turn left"},right:{icon:"↻",label:"Turn right"},rep:{icon:"🔁",label:"Repeat"},
  until:{icon:"🔁🍌",label:"Repeat until 🍌"},call:{icon:"⭐",label:"My move"},ifR:{icon:"🌴↻",label:"Tree ahead? Turn right"},ifL:{icon:"🌴↺",label:"Tree ahead? Turn left"}};
const isBox=b=>typeof b==="object";
function mazeInfo(g){let start;const goals=[];g.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch==="S")start=[x,y];if(ch==="B")goals.push([x,y])}));return {start,goal:goals[0],goals,w:g[0].length,h:g.length}}
const blockCount=prog=>prog.reduce((n,b)=>n+(isBox(b)?1+b.body.length:1),0);
/* runs a program; path entries are [x, y, dir, bump?, eatenKey?]
   The program must end exactly when the last banana is eaten: any move or turn after that is "extra".
   (Repeat until 🍌 stops by itself the moment the last banana is eaten.) */
function simulate(grid,dir,prog,fn){
  const m=mazeInfo(grid);let [x,y]=m.start,d=dir;const path=[[x,y,d]];const left=new Set(m.goals.map(g=>g.join(",")));let steps=0,won=false;
  const treeAhead=()=>{const [dx,dy]=DIRS[d];const ch=(grid[y+dy]||"")[x+dx];return ch===undefined||ch==="#"};
  const one=t=>{
    if(++steps>500)return "loop";
    if(t==="ifR"||t==="ifL"){if(!treeAhead())return null}
    if(won){  // TypeMonkey already has every banana, so this block is one too many
      if(t==="fwd"&&!treeAhead()){const [dx,dy]=DIRS[d];x+=dx;y+=dy;path.push([x,y,d])}
      else if(t==="fwd")path.push([x,y,d,"bump"]);
      else{d=(t==="left"||t==="ifL")?LEFT[d]:RIGHT[d];path.push([x,y,d])}
      return "extra";
    }
    if(t==="left"||t==="ifL")d=LEFT[d];
    else if(t==="right"||t==="ifR")d=RIGHT[d];
    else{
      if(treeAhead()){path.push([x,y,d,"bump"]);return "wall"}
      const [dx,dy]=DIRS[d];x+=dx;y+=dy;const k=x+","+y;
      if(left.has(k)){left.delete(k);path.push([x,y,d,null,k]);if(!left.size){won=true;return "won"}return null}
    }
    path.push([x,y,d]);return null;
  };
  const runList=(list,inUntil)=>{
    for(const b of list){
      let r=null;
      if(isBox(b)){
        if(b.until){
          if(won){r="extra";path.push([x,y,d,"bump"])}
          else{if(!b.body.length)return "loop";let guard=0;
            while(!won){if(++guard>80)return "loop";r=runList(b.body,true);if(r==="won"){r=null;break}if(r)return r}}
        }else for(let k=0;k<b.rep;k++){r=runList(b.body,inUntil);if(r==="won"){if(inUntil)return "won";r=null;continue}if(r)return r}
      }else if(b==="call"){

function rush(poolIn,secs,onEnd,onQuit){

    $("#screen").innerHTML=`<div class="stack"><div class="card" style="align-items:center;text-align:center"><div class="label">Time!</div><div class="big">${score}/${pool.length}</div><p>+${score*2} bananas · +${score*3} XP</p></div>

      <p style="color:var(--muted);font-size:.85rem">${hint||"Several lines of output are shown with spaces between them."}</p>
      <div class="opts">${ord.map(k=>`<button class="opt mono" data-k="${k}">${esc(opts[k])}</button>`).join("")}</div></div></div>`;
    $("#quitg").onclick=()=>{clearInterval(timer);ended=true;onQuit()};
    $$(".opt").forEach(b=>b.onclick=()=>{
      const ok=+b.dataset.k===0;b.classList.add(ok?"right":"wrong");if(ok)score++;

const DAY=864e5,GAPS=[0,DAY,3*DAY,7*DAY];   // after each right answer: back in 1, 3, then 7 days; one more right = learned

    if(r){if(ok){cur.earned.remembered=(cur.earned.remembered||0)+1;r.box++;if(r.box>=GAPS.length){delete S.review[st._rv];cur.earned.learned=(cur.earned.learned||0)+1}else r.due=Date.now()+GAPS[r.box]}

  if(r.kind==="pool"){const p=(f.l.pool||[])[r.j];if(!p)return null;
    return {type:"quiz",q:"What does this print?",code:p[0],opts:[...p[1]],a:0,mono:true,why:`It prints ${p[1][0].includes("\n")?"those lines":p[1][0]}.`,_rv:key,_course:f.c,_from:f.l.title}}
  const st=f.l.steps[r.i];if(!st||!["quiz","fill","order"].includes(st.type))return null;
  return {...st,_rv:key,_course:f.c,_from:f.l.title};
}
function startReview(){
  const due=Object.entries(S.review||{}).filter(([,r])=>r.due<=Date.now()).sort((a,b)=>a[1].due-b[1].due);
  const steps=[];for(const [k,r] of due){const st=reviewStep(k,r);if(st)steps.push(st);else delete S.review[k];if(steps.length>=10)break}
  if(!steps.length){
    const next=Object.values(S.review||{}).sort((a,b)=>a.due-b.due)[0];
    rerender=home;
    $("#screen").innerHTML=`<div class="stack"><div class="row"><button class="btn ghost sm" id="back">← Home</button></div>
      <section class="hero"><div class="label">Review</div><h1>${reviewSize()?"All caught up!":"Nothing to review yet"}</h1>
      <p>${reviewSize()?`You have ${reviewSize()} question${reviewSize()===1?"":"s"} in review. The next one comes back ${whenText(next.due)}.`:"When you miss a quiz, a fill-in, an ordering puzzle or an Output Rush question, it lands here. Then it comes back after a day, three days and a week until it sticks."}</p></section>
      ${buddy(reviewSize()?"Your brain remembers things better when you practice them with gaps in between. Science!":"Go play some lessons. I'll keep track of anything tricky.","happy")}
      <div class="row"><button class="btn" id="go2">${reviewSize()?"Back home":"Find a lesson"}</button></div></div>`;
    $("#back").onclick=home;$("#go2").onclick=()=>reviewSize()?home():coursePage(nextUp(COURSES[0])?"js":"js");
    foot();save();return;
  }
  save();
  cur={c:steps[0]._course,l:{id:null,title:"Review",steps:[...steps,{type:"done"}]},item:null,step:0,earned:{xp:0,ban:0,right:0,total:0},review:true};
  rerender=renderStep;renderStep();
}
function whenText(t){const d=t-Date.now();if(d<=0)return "now";if(d<36e5)return "in "+Math.max(1,Math.round(d/6e4))+" minutes";if(d<DAY*1.5)return "tomorrow";return "in "+Math.round(d/DAY)+" days"}
function reviewDone(){
  const n=cur.earned.reviewed||0,ok=cur.earned.remembered||0,learned=cur.earned.learned||0;
  S.xp+=ok*5;S.bananas+=ok*2;if(n)bumpStreak();S.stats.remembered=(S.stats.remembered||0)+ok;S.stats.learned=(S.stats.learned||0)+learned;save();
  shell(`<div class="card" style="text-align:center;align-items:center"><div class="label">Review complete</div><h2>${ok}/${n} remembered</h2>
    <div class="reward"><div><b>+${ok*5}</b><span>XP</span></div><div><b>+${ok*2}</b><span>Bananas</span></div><div><b>${learned}</b><span>Learned for good</span></div></div>
    <p>${n-ok?`${n-ok} question${n-ok===1?"":"s"} will come back soon for another try.`:"Every one right! They'll come back in a few days to make sure they stick."}</p></div>
    ${buddy(ok===n?"Your memory is getting stronger every day!":"Mistakes are how brains grow. See you next review!",ok===n?"cheer":"happy")}
    <div class="row"><button class="btn" id="back">Back home</button></div>`);
  $("#back").onclick=home;
}

/* ---------- Daily challenge: 3 questions, the same for everyone on a given day ---------- */
function seeded(seed){let h=2166136261>>>0;for(const ch of seed){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)>>>0}
  return ()=>{h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;return h/4294967296}}
const dailyDoneToday=()=>(S.daily||{}).last===dayStr(new Date());
function dailySteps(){
  const rnd=seeded("typemonkey-"+dayStr(new Date()));
  const started=(S.stats.started||[]).filter(id=>{const c=courseById(id);return c&&c.units&&!c.kids});
  const cids=started.length?started:((S.stats.started||[]).includes("jr")?["jr"]:["js"]);
  const cands=[];
  for(const cid of cids){const c=courseById(cid);for(const x of flat(c)){
    if(!x.l.steps||!(S.done.includes(x.l.id)||x.idx<2))continue;
    (x.l.pool||[]).forEach((p,j)=>cands.push({kind:"pool",c,l:x.l,j}));
    x.l.steps.forEach((q,i)=>{if(q.type==="quiz")cands.push({kind:"step",c,l:x.l,i})});
  }}
  const picks=[];while(picks.length<3&&cands.length){picks.push(cands.splice(Math.floor(rnd()*cands.length),1)[0])}
  return picks.map(pk=>{
    if(pk.kind==="pool"){const p=pk.l.pool[pk.j];return {type:"quiz",q:"What does this print?",code:p[0],opts:[...p[1]],a:0,mono:true,why:`It prints ${p[1][0].includes("\n")?"those lines":p[1][0]}.`,_course:pk.c,_from:pk.l.title,_src:{key:pk.l.id+"#p"+pk.j,item:{kind:"pool",lid:pk.l.id,j:pk.j}}}}
    return {...pk.l.steps[pk.i],_course:pk.c,_from:pk.l.title,_src:{key:pk.l.id+"#"+pk.i,item:{kind:"step",lid:pk.l.id,i:pk.i}}};
  });
}
function startDaily(){
  if(dailyDoneToday()){toast("You already did today's challenge. A new one unlocks tomorrow!");return}
  const steps=dailySteps();if(!steps.length)return toast("Play a lesson first, then the daily challenge unlocks!");
  cur={c:steps[0]._course,l:{id:null,title:"Daily challenge",steps:[...steps,{type:"done"}]},item:null,step:0,earned:{xp:0,ban:0,right:0,total:0},daily:true};
  rerender=renderStep;renderStep();
}
function dailyDone(){
  const ok=cur.earned.right,n=cur.earned.total;
  const t=dayStr(new Date()),y=dayStr(new Date(Date.now()-864e5));const d=S.daily||{};
  const streak=d.last===y?(d.streak||0)+1:1;S.daily={last:t,streak,best:Math.max(d.best||0,streak)};
  const ban=10+ok*3+(streak>=3?5:0),xp=ok*10;S.bananas+=ban;S.xp+=xp;bumpStreak();bump("dailies");save();
  shell(`<div class="card" style="text-align:center;align-items:center"><div class="label">Daily challenge complete</div><h2>${ok}/${n} right</h2>
    <div class="reward"><div><b>+${xp}</b><span>XP</span></div><div><b>+${ban}</b><span>Bananas</span></div><div><b>${streak}</b><span>Daily streak</span></div></div>
    <p>${streak>=3?"Streak bonus +5 bananas! ":""}A new challenge unlocks tomorrow.</p></div>
    ${buddy(ok===n?"Perfect daily! See you tomorrow!":"Nice work! Anything you missed is waiting in Review.",ok===n?"cheer":"happy")}
    <div class="row"><button class="btn" id="back">Back home</button></div>`);
  $("#back").onclick=home;
}

        <span class="pill ${on?"ok":owned?"":"kid"}">${on?(slot==="pet"?"With you":"Wearing"):owned?"Owned":away?`Back in ${seasonName(it)}`:`🍌 ${it.price}`}</span></button>`}).join("")}</div>
    <div id="buybar"></div>
  </div>`;
  $("#back").onclick=home;
  $$("[data-tab]").forEach(b=>b.onclick=()=>shop(b.dataset.tab));

      <button class="btn banana" id="buy" ${S.bananas>=it.price?"":"disabled"}>Buy · 🍌 ${it.price}</button><button class="btn ghost" id="nobuy">Cancel</button></div>`;
    $("#buybar").scrollIntoView({block:"nearest"});

  });
  foot();window.scrollTo(0,0);
}

/* ---------- Grown-up check (required by app stores for purchases in apps for kids) ---------- */
function grownUpGate(onPass){
  const a=6+Math.floor(Math.random()*4),b=6+Math.floor(Math.random()*4),ans=a*b;
  const opts=shuffle([ans,ans+a,ans-b]);
  const g=document.createElement("div");g.className="gate";g.setAttribute("role","dialog");g.setAttribute("aria-label","Grown-up check");
  g.innerHTML=`<div class="card"><div class="label">Grown-ups only</div><h2>Ask a parent or guardian</h2><p>To continue, answer: what is <b>${a} × ${b}</b>?</p>
    <div class="opts">${opts.map(o=>`<button class="opt" data-v="${o}">${o}</button>`).join("")}</div><button class="btn ghost sm" id="gx">Cancel</button></div>`;
  document.body.appendChild(g);
  const close=()=>g.remove();
  g.querySelector("#gx").onclick=close;
  g.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{close();if(+b.dataset.v===ans)onPass();else toast("That's not quite right. Ask a grown-up for help!")});
}
