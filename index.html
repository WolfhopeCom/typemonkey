.unlocked{text-align:center;font-weight:800;color:var(--leaf);background:color-mix(in srgb,var(--leaf) 12%,var(--surface));border-radius:var(--r);padding:14px}
html.bigtext{font-size:112.5%}html.bigtext body{font-size:18px}
html.calm *{animation:none!important;transition:none!important}
/* ===== Motion pack: smooth screens, a living mascot, juicy Jr. moves and a big finish (all off with Reduce Motion) ===== */
@keyframes enterUp{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes nodeIn{from{opacity:0;scale:.6}to{opacity:1;scale:1}}
@keyframes breathe{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-3px) rotate(-2deg)}60%{transform:translateY(-1px) rotate(1.5deg)}}
@keyframes hop{0%{transform:translateY(0) scale(1,1)}25%{transform:translateY(-22%) scale(.94,1.08)}55%{transform:translateY(0) scale(1.1,.88)}100%{transform:translateY(0) scale(1,1)}}
@keyframes bonk{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-10%) rotate(-10deg)}45%{transform:translateX(8%) rotate(8deg)}70%{transform:translateX(-4%) rotate(-4deg)}}
@keyframes victory{0%{transform:translateY(0) rotate(0) scale(1)}35%{transform:translateY(-38%) rotate(180deg) scale(1.15)}70%{transform:translateY(0) rotate(360deg) scale(1)}85%{transform:scale(1.12,.9)}100%{transform:none}}
@keyframes puff{from{opacity:.75;transform:translate(-50%,-50%) scale(.4)}to{opacity:0;transform:translate(-50%,-80%) scale(1.5)}}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1;transform:translate(-50%,-30%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
@keyframes rays{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes jumpIn{0%{opacity:0;transform:translateY(60px) scale(.5)}55%{opacity:1;transform:translateY(-14px) scale(1.08)}75%{transform:translateY(0) scale(.96,1.04)}100%{transform:none}}
@keyframes cfall{0%{transform:translate3d(0,-10vh,0) rotate(0)}100%{transform:translate3d(var(--dx),110vh,0) rotate(var(--rot))}}
@keyframes glowGood{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--leaf) 55%,transparent)}100%{box-shadow:0 0 0 18px transparent}}
#screen>.stack>.card,#screen>.stack>.hero,#screen>.stack>.buddy{animation:enterUp .38s cubic-bezier(.2,.8,.3,1) both}
#screen>.stack>.card:nth-of-type(2){animation-delay:.05s}#screen>.stack>.buddy{animation-delay:.12s}
.pnode{animation:nodeIn .42s cubic-bezier(.3,1.5,.5,1) both}
.pnode:nth-child(2){animation-delay:.04s}.pnode:nth-child(3){animation-delay:.08s}.pnode:nth-child(4){animation-delay:.12s}.pnode:nth-child(5){animation-delay:.16s}.pnode:nth-child(6){animation-delay:.2s}.pnode:nth-child(7){animation-delay:.24s}.pnode:nth-child(n+8){animation-delay:.28s}
.buddy .tm{transform-origin:50% 90%;animation:breathe 3.6s ease-in-out infinite}
.buddy.bounce .tm{animation:bob .6s ease,breathe 3.6s ease-in-out .6s infinite}
.feedback.good{animation:sheetUp .25s ease,glowGood .7s ease-out .1s}
.mk .mface{transform-origin:50% 85%}
.mk.hop .mface{animation:hop .34s ease-out}
.mk.bonk .mface{animation:bonk .45s ease-out}
.mk.win .mface{animation:victory .9s cubic-bezier(.3,.7,.3,1)}
.mfx{position:absolute;pointer-events:none;z-index:3;font-size:clamp(.9rem,4vw,1.4rem);font-weight:900;white-space:nowrap}
.mfx.puff{width:calc(60% / var(--w));aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff9 0,#fff0 70%);animation:puff .5s ease-out forwards}
.repadd{min-width:36px;height:36px;border-radius:10px;border:2px dashed #ffffff66;background:transparent;color:#fff;font-size:1.2rem;font-weight:900;margin-left:2px}
.progtip{margin:6px 2px 0;font-size:.95rem;color:var(--muted);min-height:0}.progtip:empty{display:none}
.mthink{position:absolute;z-index:4;transform:translateY(-105%);background:#fff;color:#2A1300;border:2px solid #7C5CFF;border-radius:14px;padding:4px 10px;font-weight:900;font-size:clamp(.75rem,3.4vw,1rem);white-space:nowrap;pointer-events:none;box-shadow:0 3px 0 #5A3FD0;animation:thinkIn .3s cubic-bezier(.3,1.5,.5,1)}
@keyframes thinkIn{from{opacity:0;scale:.5}to{opacity:1;scale:1}}
.mthink.low{transform:translateY(4px)}.mthink.low::after{display:none}
.mthink::after{content:"";position:absolute;left:var(--tail,50%);bottom:-8px;width:10px;height:10px;background:#fff;border-right:2px solid #7C5CFF;border-bottom:2px solid #7C5CFF;transform:translateX(-50%) rotate(45deg)}
.mfx.up{animation:floatUp .9s ease-out forwards;color:#2A1300;text-shadow:0 2px 0 #fff8}
.fin-stage{position:relative;width:100%;height:170px;display:grid;place-items:center;overflow:hidden;border-radius:18px;background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--banana) 55%,transparent),transparent 70%)}
.fin-stage .rays{position:absolute;left:50%;top:58%;width:380px;height:380px;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--banana) 45%,transparent) 0 10deg,transparent 10deg 24deg);animation:rays 18s linear infinite;opacity:.8;-webkit-mask:radial-gradient(circle closest-side,#000 25%,transparent 100%);mask:radial-gradient(circle closest-side,#000 25%,transparent 100%)}
.fin-stage .tm{position:relative;width:132px;height:132px;animation:jumpIn .8s cubic-bezier(.3,.8,.3,1) both,breathe 3s ease-in-out 1s infinite}
.reward div{animation:enterUp .4s cubic-bezier(.2,.8,.3,1) both}.reward div:nth-child(2){animation-delay:.12s}.reward div:nth-child(3){animation-delay:.24s}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:0;width:9px;height:14px;border-radius:2px;animation:cfall var(--t) cubic-bezier(.3,.4,.6,1) var(--d) forwards;opacity:.95}
@media (prefers-reduced-motion:reduce){.buddy .tm,.fin-stage .rays{animation:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== 10-onboarding: first-run steps, Today card (goal ring + streak week), goal sheet ===== */
body:has(.onb) .topbar,body:has(.onb) #foot{display:none}
.app:has(.onb){padding-bottom:0}
.onb{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:14px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.onb-top{display:flex;align-items:center;gap:8px;min-height:44px}
.onb-top .progress{height:14px}
.onb-top .progress span{background:var(--accent);transition:width .45s cubic-bezier(.3,1.3,.5,1)}
.onb-gap{width:44px;flex:none}
.onb-back{font-size:1.5rem;font-weight:800}
.onb-skip{background:none;border:0;color:var(--muted);font-weight:800;font-size:.95rem;min-height:44px;min-width:44px;padding:0 6px;flex:none}
.onb-talk{display:flex;gap:10px;align-items:flex-end}
.onb-talk .bubble{animation:enterUp .35s cubic-bezier(.2,.8,.3,1) .1s both}
.onb-m{flex:none;line-height:0}.onb-m .tm{width:72px;height:72px;transform-origin:50% 90%}
.onb-hop .tm{animation:hop .55s ease-out .1s,breathe 3.6s ease-in-out .7s infinite}
.onb-tilt .tm{animation:onbTilt 1.1s ease-in-out .1s,breathe 3.6s ease-in-out 1.2s infinite}
@keyframes onbTilt{30%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}}
.onb-body{display:flex;flex-direction:column;gap:12px;flex:1}
.onb-q{font-size:clamp(1.55rem,6.4vw,2rem);animation:enterUp .35s cubic-bezier(.2,.8,.3,1) both}
.onb-opts{display:flex;flex-direction:column;gap:10px}
.onb-opt{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;text-align:left;background:var(--surface);color:var(--fg);border:2px solid var(--line);border-radius:18px;padding:10px 14px;box-shadow:0 4px 0 var(--line);transition:transform .08s,border-color .15s,background .15s;animation:enterUp .38s cubic-bezier(.2,.8,.3,1) calc(.06s + var(--i,0) * .05s) both}
.onb-opt:active,.onb-lang:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.onb-opt .oe{width:44px;height:44px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;font-size:1.5rem;flex:none}
.onb-opt .ot{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.onb-opt .ot b{font-family:var(--display);font-size:1.18rem;font-weight:800}
.onb-opt .ot span{color:var(--muted);font-size:.88rem;font-weight:700}
.onb-opt .oxp{flex:none;font-weight:900;font-size:.9rem;background:var(--surface2);border-radius:999px;padding:4px 10px;font-variant-numeric:tabular-nums}
.onb-opt.sel,.onb-lang.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 70%,#000)}
.onb-opt.sel .oe{background:var(--accent);animation:pop .35s ease}
.onb-opt.sel .oxp{background:var(--accent);color:var(--accent-ink)}
.onb-langs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.onb-lang{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-height:72px;min-width:0;text-align:left;background:var(--surface);color:var(--fg);border:2px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 4px 0 var(--line);animation:enterUp .38s cubic-bezier(.2,.8,.3,1) calc(.04s + var(--i,0) * .035s) both}
.onb-lang b{font-family:var(--display);font-size:1.12rem;line-height:1.15}
.onb-lang .tag{font-family:var(--mono);font-size:.72rem;color:var(--muted);overflow-wrap:anywhere;line-height:1.3}
.onb-lang.rec{grid-column:1/-1;min-height:84px}
.onb-lang.rec b{font-size:1.35rem}
.onb-lang.kids:not(.sel){background:color-mix(in srgb,var(--banana) 35%,var(--surface));border-color:color-mix(in srgb,var(--banana) 70%,var(--line))}
.onb-note{margin:0;color:var(--muted);font-weight:700;font-size:.9rem;text-align:center}
.onb-foot{position:sticky;bottom:0;z-index:6;background:var(--bg);margin-inline:-16px;padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.onb-cta{width:100%;min-height:54px;font-size:1.15rem;font-family:var(--display);letter-spacing:.01em}
.onb-cta.onb-cta-big{min-height:60px;font-size:1.3rem}
.onb-hello{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding-block:8px}
.onb-hello h1{font-size:clamp(2rem,8vw,2.6rem);animation:enterUp .4s cubic-bezier(.2,.8,.3,1) .15s both}
.onb-hello p{margin:0;color:var(--muted);font-weight:700;max-width:30ch;animation:enterUp .4s cubic-bezier(.2,.8,.3,1) .25s both}
.onb-big{line-height:0}.onb-big .tm{width:150px;height:150px}
.onb-wave .mwrap{animation:jumpIn .8s cubic-bezier(.3,.8,.3,1) both}
.onb-wave .tm{transform-origin:50% 90%;animation:onbWave 1.4s ease-in-out .8s 2,breathe 3.4s ease-in-out 3.6s infinite}
@keyframes onbWave{0%,100%{transform:rotate(0)}20%{transform:rotate(-10deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
.onb-fin{height:190px}
.onb-sum{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;animation:enterUp .4s cubic-bezier(.2,.8,.3,1) .35s both}
.onb-sum span{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800}
@media (max-height:700px){.onb{gap:10px}.onb-opt{min-height:56px;padding-block:7px}.onb-opt .oe{width:40px;height:40px}.onb-m .tm{width:60px;height:60px}.onb-talk .bubble{padding:9px 12px}.onb-big .tm{width:120px;height:120px}.onb-fin{height:150px}.onb-lang{min-height:60px;padding:8px 10px}.onb-lang.rec{min-height:70px}}

/* Today card: daily goal ring + this week's streak */
.today{display:flex;align-items:center;gap:14px;width:100%;text-align:left;color:var(--fg);background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:0 4px 0 var(--line);transition:transform .08s}
.today:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.today.done{border-color:color-mix(in srgb,var(--leaf) 55%,var(--line));background:color-mix(in srgb,var(--leaf) 8%,var(--surface))}
.tring{position:relative;width:68px;height:68px;flex:none;display:grid;place-items:center}
.tring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.tring circle{fill:none;stroke-width:8}
.tring .trk{stroke:var(--surface2)}
.tring .bar{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.3,.9,.3,1),stroke .3s}
.today.done .bar{stroke:var(--leaf)}
.rin{position:relative;display:flex;flex-direction:column;align-items:center;line-height:1;font-variant-numeric:tabular-nums}
.rin b{font-family:var(--display);font-size:1.3rem;font-weight:800}
.rin small{font-size:.66rem;font-weight:800;color:var(--muted);margin-top:1px}
.rin b.ok{color:var(--leaf);font-size:1.9rem}
.today.cheer .tring{animation:pop .6s ease}
.tbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.thead{display:flex;flex-direction:column;line-height:1.2}
.thead b{font-family:var(--display);font-size:1.12rem}
.thead span{color:var(--muted);font-size:.85rem;font-weight:700}
.today.done .thead span{color:var(--leaf)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;max-width:250px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px}
.wd i{width:100%;max-width:28px;aspect-ratio:1;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-style:normal;font-size:.85rem;line-height:1}
.wd small{font-size:.62rem;font-weight:800;color:var(--muted);line-height:1}
.wd.on i{background:color-mix(in srgb,var(--accent) 22%,var(--surface));box-shadow:inset 0 0 0 2px var(--accent)}
.wd.now small{color:var(--accent)}
.wd.now:not(.on) i{box-shadow:inset 0 0 0 2px var(--accent);background:transparent}
.wd.fut i{opacity:.55}
.goalhit{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 8px;width:100%;background:color-mix(in srgb,var(--leaf) 14%,var(--surface));border:2px solid var(--leaf);border-radius:14px;padding:8px 12px;animation:pop .5s ease .5s both}
.goalhit span{font-size:1.3rem}.goalhit b{font-family:var(--display);font-size:1.1rem}.goalhit small{flex-basis:100%;color:var(--muted);font-weight:700}
.onb-sheet{align-items:end}
.onb-sheet .card{gap:10px;animation:sheetUp .25s ease;margin-bottom:env(safe-area-inset-bottom,0px)}
.sheethead{display:flex;align-items:center;justify-content:space-between}
#goalSeg button{min-width:40px;min-height:38px}

/* ===== 20-delight: combo pill + chip, answer pop/shake, finish summary, streak milestone screen ===== */
/* combo banner: pops in under the top bar, over the lesson progress */
.tm-combo{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:40;display:flex;align-items:center;gap:10px;padding:8px 18px 8px 12px;border-radius:999px;
  background:linear-gradient(135deg,#FFB13B,#FA7A20 60%,#F2541B);color:#2A1300;box-shadow:0 6px 0 #B9420E,0 12px 24px -8px #F2541B99;
  pointer-events:none;opacity:0;transform:translate(-50%,-30px) scale(.6);white-space:nowrap}
.tm-combo.show{animation:tmComboIn 1.9s cubic-bezier(.3,1.4,.5,1) forwards}
.tm-combo .tc-fire{font-size:1.9rem;line-height:1;display:inline-block;transform-origin:50% 90%;animation:tmFlick .5s ease-in-out infinite alternate}
.tm-combo .tc-txt{display:flex;flex-direction:column;line-height:1.05}
.tm-combo b{font-family:var(--display);font-weight:800;font-size:1.3rem;color:#fff;text-shadow:0 2px 0 #B9420E}
.tm-combo small{font-weight:800;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:#4A1E00}
.tm-combo.lvl2{background:linear-gradient(135deg,#FFD34D,#FF8A1F 55%,#F2541B)}
.tm-combo.lvl3{background:linear-gradient(135deg,#FFE27A,#FF7A1A 45%,#E8384F);box-shadow:0 6px 0 #A8263A,0 14px 30px -6px #E8384Faa}
.tm-combo.lvl3 b{font-size:1.45rem}
.tm-combo .tc-sp{position:absolute;font-style:normal;font-size:1rem;animation:tmTwinkle .9s ease-in-out infinite alternate}
.tm-combo .tc-sp.s1{right:-8px;top:-10px}.tm-combo .tc-sp.s2{left:-6px;bottom:-10px;animation-delay:.35s}
@keyframes tmComboIn{0%{opacity:0;transform:translate(-50%,-30px) scale(.6)}14%{opacity:1;transform:translate(-50%,0) scale(1.08)}22%{transform:translate(-50%,0) scale(1)}82%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-16px) scale(.92)}}
@keyframes tmFlick{from{transform:rotate(-6deg) scale(1)}to{transform:rotate(6deg) scale(1.12,1.06)}}
@keyframes tmTwinkle{from{opacity:.3;transform:scale(.7) rotate(0)}to{opacity:1;transform:scale(1.15) rotate(25deg)}}
html.calm .tm-combo.show,.tm-combo.show.calm{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.tm-combo.show{opacity:1;transform:translate(-50%,0)}}

/* small flame counter at the end of the lesson progress bar */
.tm-chip{display:inline-flex;align-items:center;gap:2px;flex:none;font-weight:900;font-size:.95rem;color:var(--accent);font-variant-numeric:tabular-nums;min-width:44px;justify-content:center}
.tm-chip b{font-family:var(--display);font-size:1.15rem;line-height:1}
.tm-chip.bump{animation:tmBump .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes tmBump{0%{transform:scale(1)}40%{transform:scale(1.45) rotate(-8deg)}100%{transform:scale(1)}}
.lessonbar .progress.hot span{background:linear-gradient(90deg,var(--leaf),#9BD34A 55%,var(--banana));position:relative;overflow:hidden}
.lessonbar .progress.hot span::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#fff8 50%,transparent 70%);transform:translateX(-100%);animation:tmSweep 1.6s ease-in-out infinite}
@keyframes tmSweep{to{transform:translateX(100%)}}

/* right answer: a little pop + shine; wrong: a soft side-to-side shake */
.tm-pop{animation:tmPop .42s cubic-bezier(.3,1.6,.5,1) calc(var(--k,0) * 60ms) both;position:relative;overflow:hidden}
.opt.tm-pop::after,.ln.tm-pop::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,#ffffff8c 50%,transparent 65%);transform:translateX(-110%);animation:tmShineX .7s ease-out .12s forwards;pointer-events:none}
@keyframes tmPop{0%{transform:scale(1)}45%{transform:scale(1.045)}100%{transform:scale(1)}}
@keyframes tmShineX{to{transform:translateX(110%)}}
.tm-shake{animation:tmShake .42s ease both}
@keyframes tmShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.console.tm-shine{animation:tmConsoleGlow .9s ease-out}
@keyframes tmConsoleGlow{0%{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--leaf) 90%,transparent)}100%{box-shadow:inset 0 0 0 2px transparent}}
.console.tm-shake{animation:tmShake .38s ease}

/* finish card: perfect lesson ribbon + best combo */
.tm-fin{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.tm-perfect{display:flex;align-items:center;gap:10px;width:100%;justify-content:center;padding:10px 14px;border-radius:14px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,color-mix(in srgb,var(--banana) 55%,var(--surface)),color-mix(in srgb,var(--accent) 30%,var(--surface)));border:2px solid color-mix(in srgb,var(--banana) 80%,var(--accent));
  animation:enterUp .45s cubic-bezier(.2,.8,.3,1) .45s both}
.tm-perfect::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,#ffffffa0 50%,transparent 65%);transform:translateX(-110%);animation:tmShineX 1s ease-out 1.1s forwards;pointer-events:none}
.tm-perfect .tp-star{font-size:1.9rem;line-height:1;animation:pop .6s ease 1s both}
.tm-perfect .tp-t{display:flex;flex-direction:column;text-align:left;line-height:1.15}
.tm-perfect b{font-family:var(--display);font-size:1.25rem;color:var(--fg)}
.tm-perfect small{font-weight:700;color:var(--fg);opacity:.75;font-size:.85rem}
.tm-best{font-weight:700;color:var(--muted);font-size:.95rem;animation:enterUp .4s cubic-bezier(.2,.8,.3,1) .6s both}
.tm-best b{color:var(--accent)}

/* streak milestone: full-screen warm celebration */
.celebrate.tm-ms{z-index:65;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto;
  background:radial-gradient(circle at 50% 30%,#FFE08A 0,#FFB347 38%,#FA7A20 72%,#D9480F 100%);color:#2A1300;animation:tmMsIn .35s ease both}
.tm-ms.out{animation:tmMsOut .22s ease forwards}
@keyframes tmMsIn{from{opacity:0}to{opacity:1}}
@keyframes tmMsOut{to{opacity:0;transform:scale(1.04)}}
.tm-ms-in{width:100%;max-width:400px;margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.tm-ms-stage{position:relative;width:100%;height:clamp(190px,34vh,260px);display:grid;place-items:center}
.tm-ms-rays{position:absolute;left:50%;top:50%;width:440px;height:440px;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,#fff5 0 9deg,transparent 9deg 22deg);animation:rays 22s linear infinite;
  -webkit-mask:radial-gradient(circle closest-side,#000 20%,transparent 100%);mask:radial-gradient(circle closest-side,#000 20%,transparent 100%)}
.tm-ms-fl{position:relative;width:clamp(120px,22vh,160px);aspect-ratio:100/120;animation:tmGrow 1s cubic-bezier(.3,1.5,.5,1) .15s both}
.tm-flame{width:100%;height:100%;display:block;transform-origin:50% 95%;animation:tmFlame 1.1s ease-in-out 1.1s infinite alternate;filter:drop-shadow(0 8px 14px #B9420E88)}
.tm-ms-n{position:absolute;left:0;right:0;bottom:12%;font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,7vh,3.1rem);line-height:1;color:#fff;-webkit-text-stroke:1.5px #C2410C;paint-order:stroke fill;text-shadow:0 3px 0 #C2410C,0 0 16px #F2541B;animation:pop .6s ease .9s both}
.tm-ms-mk{position:absolute;right:max(0px,calc(50% - 168px));bottom:-10px;width:118px;height:118px;filter:drop-shadow(0 6px 8px #B9420E66);animation:jumpIn .8s cubic-bezier(.3,.8,.3,1) .55s both}
.tm-ms-mk .tm{width:100%;height:100%;animation:tmCheer .7s ease-in-out 1.4s infinite alternate;transform-origin:50% 90%}
@keyframes tmGrow{0%{transform:scale(.15);opacity:0}60%{transform:scale(1.18);opacity:1}80%{transform:scale(.95)}100%{transform:scale(1)}}
@keyframes tmFlame{from{transform:scale(1,1) skewX(-2deg)}to{transform:scale(1.04,1.08) skewX(2deg)}}
@keyframes tmCheer{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-8px) rotate(4deg)}}
.tm-ms-label{font-size:.78rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#5A2600;animation:enterUp .4s ease .7s both}
.tm-ms h2{font-size:clamp(1.9rem,8vw,2.4rem);color:#2A1300;animation:enterUp .45s cubic-bezier(.2,.8,.3,1) .8s both}
.tm-ms p{margin:0;font-weight:800;font-size:1.1rem;color:#4A1E00;animation:enterUp .45s cubic-bezier(.2,.8,.3,1) .9s both}
.tm-ms-week{display:flex;gap:6px;justify-content:center;margin-top:4px;animation:enterUp .45s ease 1s both}
.tm-ms-week span{display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:800;font-size:.75rem;color:#5A2600}
.tm-ms-week i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:1.05rem;background:#ffffff40;border:2px solid #ffffff70}
.tm-ms-week .on i{background:#fff;border-color:#fff;box-shadow:0 3px 0 #C2410C55}
.tm-ms-ban{font-weight:900;background:#fff;color:#2A1300;border-radius:999px;padding:6px 16px;box-shadow:0 3px 0 #C2410C66;animation:pop .6s ease 1.15s both}
.tm-ms .tm-ms-ok{width:100%;max-width:320px;min-height:54px;font-size:1.15rem;margin-top:8px;background:#fff;color:#C2410C;box-shadow:0 5px 0 #C2410C;animation:enterUp .45s ease 1.25s both}
.tm-ms .tm-ms-ok:active{box-shadow:0 2px 0 #C2410C}
.tm-ms .tm-ms-ok:focus-visible{outline-color:#fff}

/* Settings stays on one phone screen with the extra Vibration row */
.setpage .setrow{padding-block:8px}

/* ===== Course map v2: unit banners, dotted trail, treasure chests (see src/features/30-map.js) ===== */
.unit.umap{--uc:#E8681A;--ubg:var(--surface);background:var(--ubg);padding-top:0;gap:6px}
.unit.umap .unit-head.ubanner{position:sticky;top:var(--tbh,64px);z-index:4;margin:0 -14px 4px;padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:nowrap;
  border-radius:calc(var(--r) - 1px) calc(var(--r) - 1px) 16px 16px;color:#fff;
  background:radial-gradient(circle at 100% 0,#ffffff24 0 64px,transparent 65px),radial-gradient(circle at 100% 0,#ffffff14 0 104px,transparent 105px),linear-gradient(135deg,var(--uc),color-mix(in srgb,var(--uc) 78%,#000));
  box-shadow:0 4px 0 color-mix(in srgb,var(--uc) 62%,#000)}
.ubanner .ub-badge{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#ffffff2e;font-weight:900;font-size:1.35rem;font-family:var(--display,inherit);box-shadow:inset 0 -3px 0 #0000001f}
.ubanner .ub-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ubanner .ub-eye{font-size:.72rem;font-weight:900;letter-spacing:.09em;text-transform:uppercase;opacity:.92;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ubanner .ub-tag{background:#ffffff33;border-radius:999px;padding:1px 8px;letter-spacing:.05em;font-size:.66rem}
.ubanner h3{font-size:1.12rem;line-height:1.2;color:#fff;margin:0;overflow-wrap:anywhere}
.ubanner .ub-ring{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(#fff calc(var(--p) * 360deg),#ffffff3d 0)}
.ubanner .ub-ring b{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--uc) 82%,#000);font-size:.8rem;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ubanner .ub-ring.full{background:conic-gradient(#FFD25C 360deg,#0000 0)}
.ubanner .ub-ring.full b{background:#FFC845;color:#5A3B00;font-size:1.1rem}
/* finished unit: soft golden card, golden badge */
.unit.umap.ucomplete{--ubg:color-mix(in srgb,var(--banana) 9%,var(--surface));border:2px solid color-mix(in srgb,var(--banana) 70%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--banana) 16%,transparent)}
.unit.umap.ucomplete .ubanner{margin-inline:-14px}
.unit.umap.ucomplete .ub-badge{background:#FFC845;color:#5A3B00}
.unit.umap.ulocked .ubanner{filter:saturate(.55)}
/* path + trail */
.unit.umap .path{position:relative;gap:34px;padding-block:22px 10px}
.unit.umap .path>.pnode{z-index:1}
.unit.umap .path>.pnode.next{margin-top:30px}
.unit.umap .pbtn.lesson[disabled]{opacity:1}
.unit.umap .pbtn.lesson[disabled] .pic{opacity:.6}
.unit.umap .pnode.locked .plabel b,.unit.umap .pnode.pro .plabel b{color:color-mix(in srgb,var(--fg) 70%,var(--ubg))}
.unit.umap .plabel{background:var(--ubg);border-radius:10px;padding:2px 8px}
.path>svg.trail{position:absolute;left:0;top:0;pointer-events:none;z-index:0;overflow:visible}
.path>svg.trail path{fill:none;stroke:color-mix(in srgb,var(--line) 70%,var(--muted));stroke-width:7;stroke-linecap:round;stroke-dasharray:.1 12;opacity:.75}
.path>svg.trail path.on{stroke:var(--leaf);opacity:1}
/* treasure chest */
.pnode.chest .pbtn.chestbtn{position:relative;width:88px;height:78px;border:0;border-radius:22px;padding:4px;background:transparent;box-shadow:none;display:grid;place-items:center;cursor:pointer}
.pnode.chest .chestbtn:active{transform:translateY(3px)!important;box-shadow:none!important}
.pnode.chest .chestbtn[disabled]{opacity:1;cursor:default}
.chest-svg{width:76px;height:68px;overflow:visible;filter:drop-shadow(0 5px 0 #00000026)}
.chest-svg .clid{transform-box:view-box;transform-origin:8px 30px;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.chest-svg .cglow{fill:#FFE680;opacity:0}
.pnode.chest.locked .chest-svg,.pnode.chest.pro .chest-svg{filter:grayscale(.9) brightness(1.15) contrast(.7) drop-shadow(0 5px 0 #0000001a)}
:root[data-theme="dark"] .pnode.chest.locked .chest-svg,:root[data-theme="dark"] .pnode.chest.pro .chest-svg{filter:grayscale(.9) brightness(.7) contrast(.8)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pnode.chest.locked .chest-svg,:root:not([data-theme="light"]) .pnode.chest.pro .chest-svg{filter:grayscale(.9) brightness(.7) contrast(.8)}}
.chestbtn .clock{position:absolute;right:2px;bottom:4px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.95rem;background:var(--surface);box-shadow:0 2px 0 var(--line)}
.pnode.chest.ready .chestbtn::before{content:"";position:absolute;inset:-8px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,color-mix(in srgb,var(--banana) 65%,transparent) 0,transparent 68%);animation:chestGlow 1.8s ease-in-out infinite}
.pnode.chest .chest-svg{position:relative}
.pnode.chest.ready .chest-svg{animation:chestWiggle 2.4s ease-in-out infinite;transform-origin:50% 90%}
.pnode.chest.ready .plabel b{color:color-mix(in srgb,var(--accent) 80%,var(--fg))}
.pnode.chest.opening .chest-svg{animation:chestShake .6s ease-in-out}
.chest-svg .cloot{opacity:0;transition:opacity .3s}
.pnode.chest.opened .chest-svg .clid{transform:translate(-4px,-15px) rotate(-22deg)}
.pnode.chest.opened .chest-svg .cglow{opacity:.5}
.pnode.chest.opened .chest-svg .cloot{opacity:1}
.pnode.chest.opened .chestbtn{background:radial-gradient(circle,color-mix(in srgb,var(--banana) 30%,transparent) 0,transparent 66%)}
.pnode.chest.opened .plabel span{color:color-mix(in srgb,var(--leaf) 85%,var(--fg));font-weight:800}
@keyframes chestWiggle{0%,62%,100%{transform:rotate(0)}68%{transform:rotate(-7deg) scale(1.04)}74%{transform:rotate(6deg) scale(1.04)}80%{transform:rotate(-4deg)}86%{transform:rotate(2deg)}}
@keyframes chestGlow{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.1);opacity:1}}
@keyframes chestShake{0%,100%{transform:none}20%{transform:translateX(-4px) rotate(-6deg)}40%{transform:translateX(4px) rotate(6deg)}60%{transform:translateX(-3px) rotate(-4deg) scale(1.08)}80%{transform:translateY(-6px) scale(1.12)}}
.chest-pop{position:fixed;z-index:61;pointer-events:none;transform:translate(-50%,-20%);background:var(--banana);color:#2A1300;font-weight:900;font-size:1.05rem;padding:6px 14px;border-radius:999px;box-shadow:0 4px 0 color-mix(in srgb,var(--banana) 55%,#000);white-space:nowrap;animation:floatUp 1.5s ease-out forwards}
.chest-pop span{color:#7A4E00;font-size:.85rem;margin-left:4px}
html.calm .chest-pop{display:none}
@media (prefers-reduced-motion:reduce){.chest-pop{display:none}}

/* ===== 40-monkey: levels, mascot polish, profile ===== */
/* living mascot: blink every few seconds; hop when tapped (both off in Calm mode / Reduce Motion via the core rules) */
@keyframes tmBlink{0%,91%,100%{transform:scaleY(1)}94.5%{transform:scaleY(.08)}}
.tm .tm-eyes{transform-box:fill-box;transform-origin:50% 55%;animation:tmBlink 5.2s ease-in-out infinite}
@keyframes tmHop{0%{transform:translateY(0) scale(1)}22%{transform:translateY(2%) scale(1.08,.9)}50%{transform:translateY(-20%) scale(.95,1.07) rotate(-4deg)}78%{transform:translateY(0) scale(1.06,.94)}100%{transform:none}}
.tm.tm-hop{animation:tmHop .55s cubic-bezier(.3,.7,.4,1)!important;transform-origin:50% 90%}
.buddy .tm,.prof-stage .tm,#brandMonkey .tm{cursor:pointer}

/* top bar: level chip on the mascot */
#brandMonkey{position:relative;display:block;line-height:0;width:38px;height:38px;flex:none}
#brandMonkey .tm{width:38px;height:38px;transform-origin:50% 90%}
.tm-lvl{position:absolute;right:-7px;bottom:-4px;min-width:19px;height:19px;padding:0 4px;border-radius:999px;display:grid;place-items:center;font:900 .7rem/1 var(--body);font-variant-numeric:tabular-nums;color:#fff;background:var(--leaf);box-shadow:0 0 0 2px var(--bg);pointer-events:none}
.tm-lvl.gold{background:var(--banana);color:#2A1300}
.tm-lvl.legend{background:linear-gradient(135deg,#FFC845,#FF6FAE 60%,#7C5CFF);color:#fff}

/* Home: slim level card */
.lvcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.lvcard:active{transform:scale(.99)}
.lvnum{flex:none;width:46px;height:46px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:color-mix(in srgb,var(--leaf) 16%,var(--surface));color:var(--leaf);font:800 1.35rem/1 var(--display);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--leaf) 45%,transparent)}
.lvnum small{font:900 .58rem/1 var(--body);letter-spacing:.08em;margin-bottom:1px}
.lvtext{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.lvtext b{font-family:var(--display);font-size:1.08rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvbar,.prof-bar,.pc-bar{display:block;height:9px;border-radius:999px;background:var(--surface2);overflow:hidden}
.lvbar>span,.prof-bar>span,.pc-bar>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--leaf),color-mix(in srgb,var(--leaf) 60%,var(--banana)))}
.lvsub{font-size:.8rem;font-weight:700;color:var(--muted)}
.lvgo{flex:none;font-weight:800;font-size:.85rem;color:var(--accent)}
@media (max-width:360px){.lvgo{display:none}}

/* Profile */
.prof{gap:14px}
.prof-top{justify-content:space-between}
.prof-hero{align-items:center;text-align:center;gap:6px;padding:0 0 18px;overflow:hidden;
  background:linear-gradient(180deg,color-mix(in srgb,var(--banana) 30%,var(--surface)) 0,var(--surface) 62%)}
.prof-stage{position:relative;width:100%;height:calc(var(--ms) + 38px);display:grid;place-items:end center;padding-bottom:6px;overflow:hidden;
  background:radial-gradient(ellipse 60% 18% at 50% 96%,color-mix(in srgb,var(--fg) 12%,transparent),transparent 70%)}
.prof-stage .rays{position:absolute;left:50%;top:55%;width:420px;height:420px;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--banana) 40%,transparent) 0 9deg,transparent 9deg 22deg);opacity:.55;animation:rays 28s linear infinite;-webkit-mask:radial-gradient(circle closest-side,#000 20%,transparent 100%);mask:radial-gradient(circle closest-side,#000 20%,transparent 100%)}
.prof-stage .mwrap{position:relative}
.prof-stage .tm{width:var(--ms);height:calc(var(--ms) * 1.13);transform-origin:50% 90%;animation:breathe 3.6s ease-in-out infinite}
.prof-id{width:100%;padding:0 18px;display:flex;flex-direction:column;gap:6px;align-items:center}
.prof-lv{display:inline-block;background:var(--leaf);color:#fff;font-weight:900;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 12px}
.prof-id h1{font-size:clamp(1.8rem,8vw,2.4rem)}
.prof-bar{width:100%;height:14px;margin-top:4px}
.prof-xp{width:100%;display:flex;justify-content:space-between;gap:8px;font-size:.85rem;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.ptiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ptile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px 9px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px;min-width:0}
.ptile .pt-ic{font-size:1.3rem;line-height:1.2}
.ptile b{font-family:var(--display);font-size:1.4rem;line-height:1.1;font-variant-numeric:tabular-nums;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ptile b small{font-size:.8rem;color:var(--muted)}
.ptile>span:last-child{font-size:.74rem;font-weight:800;color:var(--muted);line-height:1.2}
.ptile.hot{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.pw-head{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.pw-head h3{font-size:1.3rem}
.pw-head .muted{font-size:.8rem;font-weight:700}
.pw-bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:150px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:0}
.pw-col{height:100%;display:grid;grid-template-rows:18px 1fr 22px;align-items:end;justify-items:center;min-width:0}
.pw-col .pw-bar{grid-row:2;width:min(28px,70%);border-radius:4px 4px 0 0;background:color-mix(in srgb,var(--accent) 45%,var(--surface2));align-self:end}
.pw-col.today .pw-bar{background:var(--accent)}
.pw-val{grid-row:1;font-size:.72rem;font-weight:800;color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}
.pw-lab{grid-row:3;font-size:.72rem;font-weight:800;color:var(--muted);align-self:center;white-space:nowrap}
.pw-col.today .pw-lab{color:var(--fg)}
.pw-bars{grid-template-rows:1fr}
.pw-col{grid-template-rows:18px minmax(0,1fr) 22px}
.pw-col .pw-bar{max-height:100%}
.pw-empty{font-size:.88rem}
.prof-road{gap:10px}
.road{display:flex;gap:10px;overflow-x:auto;margin:0 -18px;padding:2px 18px 6px;scroll-snap-type:x proximity;scrollbar-width:none}
.road::-webkit-scrollbar{display:none}
.road-i{flex:none;width:104px;scroll-snap-align:start;background:var(--surface2);border-radius:14px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.road-i b{font-size:.78rem;line-height:1.15;min-height:2.3em;display:flex;align-items:center}
.road-i .mini-monkey .tm{width:58px;height:66px}
.road-i:not(.on) .mini-monkey{filter:grayscale(.85);opacity:.6}
.road-i.next{box-shadow:inset 0 0 0 2px var(--accent)}
.road-i.next .mini-monkey{filter:none;opacity:1}
.road-i .pill{align-self:center}
.prof-courses{gap:10px}
.pcourse{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;background:var(--surface2);color:var(--fg);border:0;border-radius:12px;padding:10px 12px}
.pc-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pc-t b{font-family:var(--display);font-size:1.05rem}
.pc-t span{font-size:.8rem;font-weight:700;color:var(--muted);white-space:nowrap}
.pc-bar{height:8px;background:var(--surface)}
.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Level-up celebration (uses the core .celebrate overlay so badge pop-ups wait their turn) */
.celebrate.lvlup{background:color-mix(in srgb,#000 62%,transparent);z-index:31}
.lvup-card{gap:8px;padding-top:0;animation:lvIn .45s cubic-bezier(.3,1.4,.5,1) both}
@keyframes lvIn{from{opacity:0;transform:scale(.8) translateY(20px)}to{opacity:1;transform:none}}
.lvup-stage{position:relative;width:calc(100% + 36px);margin:0 -18px 2px;height:200px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 58%,color-mix(in srgb,var(--banana) 60%,transparent),transparent 68%)}
.lvup-stage .rays{position:absolute;left:50%;top:56%;width:440px;height:440px;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--banana) 50%,transparent) 0 10deg,transparent 10deg 24deg);animation:rays 14s linear infinite;-webkit-mask:radial-gradient(circle closest-side,#000 25%,transparent 100%);mask:radial-gradient(circle closest-side,#000 25%,transparent 100%)}
.lvup-stage .tm{position:relative;width:132px;height:150px;transform-origin:50% 90%;animation:lvGrow 1.2s cubic-bezier(.3,.8,.3,1) both,breathe 3s ease-in-out 1.3s infinite}
@keyframes lvGrow{0%{transform:scale(.55);opacity:0}30%{transform:scale(.7) translateY(0);opacity:1}48%{transform:scale(.72) translateY(-14px)}62%{transform:scale(1.18,.92)}78%{transform:scale(.96,1.05) translateY(-4px)}100%{transform:none}}
.lvup-sparks i{position:absolute;left:50%;top:54%;font-style:normal;font-size:1.15rem;opacity:0;animation:spark 1.6s ease-out var(--d) infinite}
@keyframes spark{0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) translateY(-30px) scale(.4)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) translateY(calc(var(--r) * -1)) scale(1.1)}}
.lvup-num{font-size:2.4rem;color:var(--accent);animation:pop .6s ease .3s both}
.lvup-title{font-family:var(--display);font-weight:800;font-size:1.45rem;line-height:1.1;margin-top:-6px}
.lvup-card p{font-size:.95rem}
.lvup-rewards{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lvup-rewards .pill{font-size:.85rem;padding:4px 12px;text-transform:none;letter-spacing:0}
.lvup-gift{display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface2);border-radius:14px;padding:8px 12px;width:100%}
.lvup-gift .mini-monkey .tm{width:56px;height:64px}
.lvup-gift div:last-child{display:flex;flex-direction:column;min-width:0}
.lvup-gift span{font-size:.82rem;color:var(--muted)}
@media (max-height:700px){.lvup-stage{height:160px}.lvup-stage .tm{width:108px;height:122px}.lvup-num{font-size:2rem}}
html.calm .lvup-sparks{display:none}
@media (prefers-reduced-motion:reduce){.lvup-sparks{display:none}}
/* dark mode: softer rays so the stage glows instead of turning muddy */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lvup-stage .rays{opacity:.4}:root:not([data-theme="light"]) .prof-stage .rays{opacity:.3}}
:root[data-theme="dark"] .lvup-stage .rays{opacity:.4}:root[data-theme="dark"] .prof-stage .rays{opacity:.3}

/* 50-beginner: word helper + tap coach */
.term{cursor:pointer;text-decoration:underline dotted color-mix(in srgb,var(--accent) 80%,transparent);text-decoration-thickness:2px;text-underline-offset:4px;border-radius:4px;-webkit-tap-highlight-color:transparent}
.term:hover,.term:focus-visible{background:color-mix(in srgb,var(--accent) 14%,transparent);outline:none}
code.i.term{text-decoration-color:var(--accent)}
.gloss-tip{margin:0;padding:8px 12px;border-radius:12px;background:color-mix(in srgb,var(--accent) 10%,var(--surface));color:var(--fg);font-size:.92rem;font-weight:600}
.term-demo{text-decoration:underline dotted var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.gloss-pop{position:fixed;z-index:80;background:var(--surface);color:var(--fg);border:2px solid var(--accent);border-radius:16px;padding:12px 14px 14px;box-shadow:0 12px 30px #0003;animation:gpIn .18s ease-out}
.gloss-pop::before{content:"";position:absolute;left:calc(var(--ax) - 8px);width:14px;height:14px;background:var(--surface);border:2px solid var(--accent);transform:rotate(45deg)}
.gloss-pop.below::before{top:-9px;border-right:0;border-bottom:0}
.gloss-pop.above::before{bottom:-9px;border-left:0;border-top:0}
.gloss-pop .gp-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gloss-pop .gp-head b{font-family:var(--display,inherit);font-size:1.05rem}
.gloss-pop .x{min-width:36px;min-height:36px}
.gloss-pop p{margin:4px 0 0;line-height:1.45}
@keyframes gpIn{from{opacity:0;transform:translateY(4px) scale(.97)}to{opacity:1;transform:none}}

.coach-hand{position:fixed;left:0;top:0;z-index:70;pointer-events:none;display:flex;flex-direction:column;align-items:flex-start;gap:2px;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.coach-hand[hidden]{display:none}
.coach-hand .ch-f{font-size:2.1rem;line-height:1;filter:drop-shadow(0 3px 2px #0004);animation:chTap 1s ease-in-out infinite}
@keyframes chTap{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.coach-glow{position:relative;animation:coachGlow 1.2s ease-in-out infinite;z-index:1}
@keyframes coachGlow{0%,100%{box-shadow:0 0 0 3px var(--accent),0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}50%{box-shadow:0 0 0 3px var(--accent),0 0 0 9px color-mix(in srgb,var(--accent) 0%,transparent)}}
@media (prefers-reduced-motion:reduce){.coach-hand .ch-f,.coach-glow{animation:none}.coach-glow{box-shadow:0 0 0 3px var(--accent)}.coach-hand{transition:none}}

/* 70-streak: Banana Freezes + daily streak card */
.fzchip{display:inline-flex;align-items:center;gap:2px;margin-left:8px;padding:1px 8px;border-radius:999px;font-size:.78rem;font-weight:800;background:color-mix(in srgb,#5BC0EB 22%,var(--surface));color:var(--fg);vertical-align:middle}
.today .week .wd.fz i{background:color-mix(in srgb,#5BC0EB 30%,var(--surface))}
.fzcard{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:2px solid color-mix(in srgb,#5BC0EB 55%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,#5BC0EB 14%,var(--surface)),var(--surface))}
.fzcard .fz-ic{font-size:2rem;line-height:1}
.fzcard .fz-t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.fzcard .fz-t span{color:var(--muted);font-size:.88rem}
.fzcard .btn{flex:none}
.fznote{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,#5BC0EB 14%,var(--surface));font-size:.92rem}
.tm-ice{display:block;font-size:5.2rem;line-height:1;animation:tmIce .7s cubic-bezier(.3,1.5,.5,1) both}
@keyframes tmIce{from{transform:scale(.3) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.tm-ms-week span.fz i{background:color-mix(in srgb,#5BC0EB 35%,transparent)}
.tm-ms-week span.now{font-weight:900}
.tm-day .tm-ms-n{animation:tmDayN .6s .25s cubic-bezier(.3,1.6,.5,1) both}
@keyframes tmDayN{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.tm-ice,.tm-day .tm-ms-n{animation:none}}

/* 80-syntax: syntax colors (light surfaces, dark surfaces, and the always-dark code panels) */
:root{--sy-k:#7A35C8;--sy-s:#0B7F45;--sy-n:#B9470B;--sy-f:#1A62C4;--sy-c:#6A7B73}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sy-k:#C9A8FF;--sy-s:#74E2A9;--sy-n:#FDBA74;--sy-f:#86BEFF;--sy-c:#8FA39A}}
:root[data-theme="dark"]{--sy-k:#C9A8FF;--sy-s:#74E2A9;--sy-n:#FDBA74;--sy-f:#86BEFF;--sy-c:#8FA39A}
.editor pre,.tbuild{--sy-k:#C9A8FF;--sy-s:#8BE5B3;--sy-n:#FDBA74;--sy-f:#8CC4FF;--sy-c:#8A9C94}
.tile.on{--sy-k:#6A23B5;--sy-s:#0A6B3A;--sy-n:#A13A05;--sy-f:#154FA3;--sy-c:#5C5048}
.sy-k{color:var(--sy-k);font-weight:700}
.sy-s{color:var(--sy-s)}
.sy-n{color:var(--sy-n)}
.sy-f{color:var(--sy-f)}
.sy-c{color:var(--sy-c);font-style:italic}
.tile.tilewrong{animation:tileWrong .5s ease;box-shadow:0 0 0 3px #E5484D,0 3px 0 #B4282D!important}
@keyframes tileWrong{0%,100%{transform:none}20%{transform:translateX(-6px) rotate(-2deg)}40%{transform:translateX(5px) rotate(1.5deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){.tile.tilewrong{animation:none}}

/* 90-name */
.nm-tag{align-self:center;border:0;border-radius:999px;padding:6px 14px;min-height:36px;font:inherit;font-weight:800;font-size:.95rem;background:var(--surface);color:var(--fg);box-shadow:0 0 0 2px var(--line) inset,0 3px 0 var(--line);cursor:pointer}
.nm-tag.empty{background:color-mix(in srgb,var(--accent) 14%,var(--surface));box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 50%,transparent) inset,0 3px 0 color-mix(in srgb,var(--accent) 35%,transparent)}
.nm-tag:active{transform:translateY(2px);box-shadow:0 0 0 2px var(--line) inset,0 1px 0 var(--line)}
.nm-stage{display:grid;place-items:center;margin:4px 0 10px}.nm-stage .tm{width:110px;height:110px}
.nm-ideas{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
.nm-in{width:100%;box-sizing:border-box;min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:1.1rem;font-weight:700;padding:0 14px;margin-bottom:12px}
.nm-in:focus{outline:none;border-color:var(--accent)}
.nm-on{color:var(--accent)}

/* ===== 95-polish: the TypeMonkey 1.2 look =====
   One idea, used everywhere: anything you can tap is a chunky toy block (2px outline + a solid edge underneath)
   that sinks when you press it, like the code tiles. Things you only read stay flat and quiet.
   Loaded last, so it refines the earlier styles without changing any markup they rely on. */
:root{
  --r-sm:12px; --r:18px; --r-lg:22px;
  --edge:#C8D6CD; --edge-acc:#C25A0E; --edge-leaf:#167650; --edge-bad:#A8352D; --edge-ban:#C99512;
  --good-bg:#DDF4E7; --good-ink:#145C3D; --bad-bg:#FBE2DF; --bad-ink:#8C2A23;
  --press:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.3,1.35,.5,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --edge:#0B1411; --edge-acc:#9C4610; --edge-leaf:#1E6E4C; --edge-bad:#8F332C; --edge-ban:#9C7612;
  --good-bg:#173A2B; --good-ink:#9BE7C2; --bad-bg:#3E201E; --bad-ink:#FFB7AF}}
:root[data-theme="dark"]{
  --edge:#0B1411; --edge-acc:#9C4610; --edge-leaf:#1E6E4C; --edge-bad:#8F332C; --edge-ban:#9C7612;
  --good-bg:#173A2B; --good-ink:#9BE7C2; --bad-bg:#3E201E; --bad-ink:#FFB7AF}

/* ---------- type ---------- */
h1,h2,h3{letter-spacing:-.012em;text-wrap:balance}
.card h2{font-size:1.5rem;line-height:1.2}
.label{text-transform:none;letter-spacing:0;font-size:.92rem;font-weight:800;color:var(--muted)}
.pill{text-transform:none;letter-spacing:0;font-size:.78rem;padding:3px 10px}

/* ---------- surfaces: flat, calm ---------- */
.card{border:1.5px solid var(--line);border-radius:var(--r-lg);padding:20px}
.bubble{border:2px solid var(--line);border-radius:20px 20px 20px 6px;box-shadow:0 3px 0 var(--line);font-weight:700;line-height:1.45}
.todo{background:color-mix(in srgb,var(--banana) 16%,var(--surface));border-left:4px solid var(--banana);border-radius:6px 14px 14px 6px;padding:10px 14px}

/* ---------- blocks: everything you tap ---------- */
.btn{border-radius:14px;min-height:46px;box-shadow:0 4px 0 var(--edge-acc);transition:transform .09s var(--press),box-shadow .09s var(--press),background-color .15s}
.btn:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--edge-acc)}
.btn.banana{box-shadow:0 4px 0 var(--edge-ban)}
.btn.banana:active:not([disabled]){box-shadow:0 1px 0 var(--edge-ban)}
.btn.ghost{background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ghost:active:not([disabled]){box-shadow:0 1px 0 var(--line)}
.btn.sm{min-height:36px;border-radius:12px}
.btn[disabled],.btn.banana[disabled]{opacity:1;background:var(--surface2);color:color-mix(in srgb,var(--muted) 75%,var(--surface2));box-shadow:0 4px 0 var(--line);border-color:transparent}

.opt{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-sm);box-shadow:0 4px 0 var(--line);padding:14px 16px;transition:transform .09s var(--press),box-shadow .09s var(--press),background-color .15s,border-color .15s}
.opt:hover:not([disabled]){border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.opt:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.right{border-color:var(--leaf);box-shadow:0 4px 0 var(--edge-leaf);background:var(--good-bg);color:var(--good-ink)}
.opt.wrong{border-color:var(--bad);box-shadow:0 4px 0 var(--edge-bad);background:var(--bad-bg);color:var(--bad-ink)}
.opt[disabled]:not(.right):not(.wrong){opacity:.55}

.token{background:var(--surface);border-radius:12px;box-shadow:0 3px 0 var(--line);transition:transform .09s var(--press),box-shadow .09s var(--press)}
.token:active:not([disabled]){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.tile{transition:transform .09s var(--press),box-shadow .09s var(--press)}
.tile:active{transform:translateY(2px)}

.lvcard,.today,.daily{border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:var(--r);transition:transform .09s var(--press),box-shadow .09s var(--press)}
.lvcard:active,.today:active,.daily:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.daily{border-color:var(--banana);box-shadow:0 4px 0 var(--edge-ban)}
.daily.done{border-color:var(--line);box-shadow:0 4px 0 var(--line)}
.continue{border-radius:var(--r-lg);box-shadow:0 5px 0 var(--edge-acc)}
.continue:active{box-shadow:0 2px 0 var(--edge-acc)}

.tool{border-radius:var(--r);box-shadow:0 4px 0 var(--edge);transition:transform .09s var(--press),box-shadow .09s var(--press);min-height:108px}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}

/* ---------- Home: course grid with language badges ---------- */
.courses{grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:340px){.courses{grid-template-columns:1fr}}
.course{position:relative;border:2px solid var(--line);border-radius:var(--r);box-shadow:0 4px 0 var(--line);padding:14px 14px 12px;gap:3px;min-width:0;transition:transform .09s var(--press),box-shadow .09s var(--press)}
.course:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.course.live{border:2px solid var(--accent);box-shadow:0 4px 0 var(--edge-acc)}
.course.kids{border-color:var(--edge-ban);box-shadow:0 4px 0 var(--edge-ban)}
.course::before{content:"JS";display:grid;place-items:center;width:44px;height:44px;border-radius:13px;margin-bottom:6px;font-family:var(--mono);font-weight:800;font-size:.95rem;letter-spacing:-.02em;background:#F7DF1E;color:#2B2600;box-shadow:inset 0 -3px 0 #0000001f}
.course[data-c="game"]::before{content:"▶";background:#7C5CFF;color:#fff;font-size:1.1rem}
.course[data-c="py"]::before{content:"Py";background:#3776AB;color:#FFE873}
.course[data-c="web"]::before{content:"</>";background:#E8572A;color:#fff;font-size:.85rem}
.course[data-c="sql"]::before{content:"SQL";background:#0F7F88;color:#fff;font-size:.8rem}
.course[data-c="cs"]::before{content:"C#";background:#6B2D8C;color:#fff}
.course[data-c="cpp"]::before{content:"C++";background:#1E5FA8;color:#fff;font-size:.82rem}
.course[data-c="java"]::before{content:"Jv";background:#D9661C;color:#fff}
.course[data-c="swift"]::before{content:"Sw";background:#F05138;color:#fff}
.course[data-c="jr"]::before{content:"Jr";background:#fff;color:#7A4E00}
.course .pill{position:absolute;top:14px;right:12px;max-width:calc(100% - 76px);overflow:hidden;text-overflow:ellipsis}
.course h3{font-size:1.15rem;line-height:1.2;margin:0}
.course .tag{font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.course .meta{font-size:.8rem}
.course .mini{height:7px;margin-top:6px}
.continue small{text-transform:none;letter-spacing:0;font-size:.85rem}
/* returning players: skip the big tagline, start with the monkey's greeting */
.stack.tm-returning>.hero{display:none}

/* ---------- progress bars with a little shine ---------- */
.lessonbar .progress{height:14px}
.progress span,.mini span{position:relative}
.lessonbar .progress span::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:3px;border-radius:3px;background:#FFFFFF59}
.progress span{transition:width .5s var(--spring)}

/* ---------- answer result sheet ---------- */
.feedback{position:relative;border-radius:16px;padding:14px 16px;line-height:1.45}
.feedback.good,.feedback.bad{padding-left:56px;min-height:58px}
.feedback.good::before,.feedback.bad::before{position:absolute;left:14px;top:13px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:1rem;color:#fff}
.feedback.good{background:var(--good-bg);color:var(--good-ink)}
.feedback.good::before{content:"✓";background:var(--leaf);box-shadow:0 2px 0 var(--edge-leaf)}
.feedback.bad{background:var(--bad-bg);color:var(--bad-ink)}
.feedback.bad::before{content:"✕";background:var(--bad);box-shadow:0 2px 0 var(--edge-bad)}
.actionbar:has(.feedback.good) .btn:not(.ghost):not([disabled]):not(.banana){background:var(--leaf);color:#fff;box-shadow:0 4px 0 var(--edge-leaf)}
.actionbar:has(.feedback.good) .btn:not(.ghost):not([disabled]):not(.banana):active{box-shadow:0 1px 0 var(--edge-leaf)}
.actionbar:has(.feedback.good){background:color-mix(in srgb,var(--leaf) 9%,var(--bg))}
.actionbar:has(.feedback.bad){background:color-mix(in srgb,var(--bad) 7%,var(--bg))}

/* ---------- screen changes: a short rise, so you see where you went ---------- */
@keyframes tmEnter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#screen>.tm-enter{animation:tmEnter .24s var(--press) both}

/* ---------- focus you can see (keyboards, switch control) ---------- */
:where(button,[role="button"],a,input,textarea):focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 70%,transparent);outline-offset:2px}

@media (prefers-reduced-motion:reduce){#screen>.tm-enter{animation:none}.btn,.opt,.course,.tool,.token,.tile,.lvcard,.today,.daily{transition:none}}

/* order puzzle: the lines to pick are blocks too */
.lines.pick .ln{background:var(--surface);border:2px solid var(--line);border-radius:12px;box-shadow:0 3px 0 var(--line);transition:transform .09s var(--press),box-shadow .09s var(--press)}
.lines.pick .ln:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.lines:not(.pick) .ln{border-radius:10px}

</style>
</head>

      <div class="stat" title="Day streak">🔥 <span id="sStreak">0</span></div>

  </header>
  <main id="screen"><div class="boot" role="status"><div class="boot-m">🐒</div><b>TypeMonkey is waking up…</b><span>Getting the bananas ready</span></div></main>

</div>
