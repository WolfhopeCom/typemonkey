<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF7A1A">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>TypeMonkey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: phone-first single column app shell; sticky stat bar, screens swap in the middle, TypeMonkey talks from a speech bubble */
:root{
  --bg:#EEF4F1; --surface:#FFFFFF; --surface2:#E3ECE7; --fg:#15211C; --muted:#5B6D65;
  --line:#CFDDD5; --accent:#FF7A1A; --accent-ink:#2A1300; --banana:#FFC83D; --leaf:#1F9D63;
  --bad:#D9443A; --code-bg:#14201B; --code-fg:#E6F2EC; --code-dim:#7FA394;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1714; --surface:#16231E; --surface2:#1E2E28; --fg:#E9F3EE; --muted:#9AB2A7;
  --line:#2A3D35; --accent:#FF8A33; --accent-ink:#2A1300; --banana:#FFD25C; --leaf:#3CC486;
  --bad:#FF6B5E; --code-bg:#0A120F; --code-fg:#E6F2EC; --code-dim:#6E9283; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1714; --surface:#16231E; --surface2:#1E2E28; --fg:#E9F3EE; --muted:#9AB2A7;
  --line:#2A3D35; --accent:#FF8A33; --accent-ink:#2A1300; --banana:#FFD25C; --leaf:#3CC486;
  --bad:#FF6B5E; --code-bg:#0A120F; --code-fg:#E6F2EC; --code-dim:#6E9283; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}
.app{max-width:720px;margin:0 auto;padding:12px 16px 40px;display:flex;flex-direction:column;gap:18px}
.stack{display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:8px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:1.35rem;background:none;border:0;color:var(--fg);padding:0}
.brand svg{width:38px;height:38px}
.brand b{color:var(--accent)}
.stats{margin-left:auto;display:flex;gap:6px}
.stat{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:800;font-size:.9rem;font-variant-numeric:tabular-nums}
.stat i{font-style:normal;font-size:.75rem;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
@media (max-width:400px){.brand .word{display:none}}

.buddy{display:flex;gap:12px;align-items:flex-end}
.buddy svg{width:88px;height:88px;flex:none}
.buddy.bounce svg{animation:bob .6s ease}
@keyframes bob{40%{transform:translateY(-10px) rotate(-4deg)}}
.bubble{background:var(--surface);border:2px solid var(--fg);border-radius:18px 18px 18px 4px;padding:12px 14px;font-weight:700;min-width:0;flex:1}

.hero h1{font-size:clamp(2rem,7vw,2.8rem)}
.hero p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.label{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.courses{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.course{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--fg)}
.course .tag{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.course h3{font-size:1.3rem}
.course .meta{font-size:.85rem;color:var(--muted)}
.course.live{border:2px solid var(--accent)}
.course.locked{opacity:.7}
.mini{height:6px;background:var(--surface2);border-radius:999px;overflow:hidden;margin-top:4px}
.mini span{display:block;height:100%;background:var(--leaf)}
.pill{align-self:flex-start;font-size:.72rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:2px 9px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.go{background:var(--accent);color:var(--accent-ink)}
.pill.kid{background:var(--banana);color:var(--accent-ink)}
.pill.ok{background:var(--leaf);color:#fff}

.tools{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.tools{grid-template-columns:1fr}}
.tool{background:var(--code-bg);color:var(--code-fg);border:0;border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.tool b{font-family:var(--display);font-size:1.2rem}
.tool span{color:var(--code-dim);font-size:.88rem}

.unit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.unit-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.unit-head h3{font-size:1.15rem}
.unit-head .label{margin-left:auto}
.lessons{display:flex;flex-direction:column;gap:8px}
.lesson{display:flex;align-items:center;gap:12px;background:var(--surface2);border:0;border-radius:12px;padding:10px 12px;color:var(--fg);text-align:left;width:100%}
.lesson .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none;background:var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.lesson.open .dot{background:var(--accent);color:var(--accent-ink)}
.lesson.done .dot{background:var(--leaf);color:#fff}
.lesson.proj .dot{border-radius:10px}
.lesson .t{flex:1;min-width:0}
.lesson .t b{display:block}
.lesson .t span{font-size:.85rem;color:var(--muted)}
.lesson[disabled]{cursor:not-allowed;opacity:.62}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.85rem;padding:0;align-self:flex-start}

.paywall{background:var(--code-bg);color:var(--code-fg);border-radius:var(--r);padding:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.paywall div{flex:1;min-width:200px}
.paywall h3{font-size:1.25rem;color:var(--code-fg)}
.paywall p{margin:4px 0 0;color:var(--code-dim);font-size:.9rem}

.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:800;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.ghost{background:var(--surface2);color:var(--fg);box-shadow:0 4px 0 var(--line)}
.btn.banana{background:var(--banana);box-shadow:0 4px 0 color-mix(in srgb,var(--banana) 55%,#000)}
.btn.sm{padding:7px 12px;font-size:.88rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.progress{height:12px;background:var(--surface2);border-radius:999px;overflow:hidden;flex:1}
.progress span{display:block;height:100%;background:var(--leaf);border-radius:999px;transition:width .4s}
.lessonbar{display:flex;align-items:center;gap:12px}
.x{background:none;border:0;color:var(--muted);font-size:1.6rem;line-height:1;padding:0 4px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:1.55rem}
.card p{margin:0;max-width:62ch}
code.i{font-family:var(--mono);font-size:.88em;background:var(--surface2);padding:1px 6px;border-radius:6px;white-space:nowrap}

.editor{background:var(--code-bg);border-radius:12px;overflow:hidden;min-width:0}
.editor .head{display:flex;align-items:center;gap:8px;padding:8px 12px;color:var(--code-dim);font-family:var(--mono);font-size:.8rem;border-bottom:1px solid #ffffff14}
.editor .head span{margin-right:auto}
.editor textarea{display:block;width:100%;min-height:150px;resize:vertical;background:transparent;color:var(--code-fg);border:0;outline:0;padding:12px 14px;font-family:var(--mono);font-size:.92rem;line-height:1.6;tab-size:2;white-space:pre;overflow-x:auto}
.editor pre{margin:0;padding:12px 14px;color:var(--code-fg);font-family:var(--mono);font-size:.92rem;line-height:1.6;overflow-x:auto}
.run{background:var(--leaf);color:#fff;border:0;border-radius:8px;padding:5px 12px;font-weight:800;font-family:var(--body)}
.run[disabled]{opacity:.4;cursor:not-allowed}
.console{background:#000;color:#B8F5D3;font-family:var(--mono);font-size:.88rem;padding:10px 14px;min-height:44px;white-space:pre-wrap;word-break:break-word;border-top:1px solid #ffffff14}
.console .err{color:#FF9C92}
.console .dim{color:#5E7E70}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--surface2);border:2px solid transparent;border-radius:12px;padding:12px 14px;color:var(--fg);font-weight:700}
.opt.mono{font-family:var(--mono);font-weight:600;white-space:pre-wrap}
.opt:hover:not([disabled]){border-color:var(--line)}
.opt.right{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 16%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.feedback{font-weight:700;border-radius:12px;padding:10px 14px}
.feedback pre{font-family:var(--mono);font-weight:600;font-size:.85rem;margin:6px 0 0;white-space:pre-wrap}
.feedback.good{background:color-mix(in srgb,var(--leaf) 16%,var(--surface))}
.feedback.bad{background:color-mix(in srgb,var(--bad) 14%,var(--surface))}

/* fill-in-the-blank + ordering */
.slot{font-family:var(--mono);font-size:.92rem;min-width:3.2em;padding:0 8px;margin:0 2px;border-radius:6px;border:2px dashed var(--code-dim);background:transparent;color:var(--banana);font-weight:600;line-height:1.5}
.slot.filled{border-style:solid;border-color:var(--banana)}
.slot.right{border-color:var(--leaf);color:#B8F5D3}
.slot.wrong{border-color:var(--bad);color:#FF9C92}
.tokens{display:flex;flex-wrap:wrap;gap:8px}
.token{font-family:var(--mono);font-weight:600;background:var(--surface2);border:2px solid var(--line);border-radius:10px;padding:8px 14px;color:var(--fg);box-shadow:0 3px 0 var(--line)}
.token[disabled]{opacity:.25}
.lines{display:flex;flex-direction:column;gap:6px;min-height:52px;background:var(--code-bg);border-radius:12px;padding:10px}
.lines.pick{background:transparent;padding:0}
.ln{font-family:var(--mono);font-size:.88rem;text-align:left;white-space:pre;overflow-x:auto;background:var(--surface2);border:2px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--fg)}
.lines:not(.pick) .ln{background:#ffffff0d;color:var(--code-fg);border-color:#ffffff1f}
.lines .ln.right{border-color:var(--leaf)}
.lines .ln.wrong{border-color:var(--bad)}
.empty{color:var(--code-dim);font-size:.85rem;font-family:var(--body);padding:6px}

.game-hud{display:flex;gap:10px;align-items:center;font-weight:800;font-variant-numeric:tabular-nums}
.timer{height:10px;flex:1;background:var(--surface2);border-radius:999px;overflow:hidden}
.timer span{display:block;height:100%;background:var(--banana);transition:width 1s linear}
.big{font-family:var(--display);font-size:3rem;font-weight:800;color:var(--accent);line-height:1}
.reward{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.reward div{background:var(--surface2);border-radius:12px;padding:12px;text-align:center}
.reward b{display:block;font-family:var(--display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.reward span{font-size:.8rem;color:var(--muted);font-weight:700}
.cert{border:3px solid var(--banana);border-radius:var(--r);padding:16px;text-align:center;background:color-mix(in srgb,var(--banana) 12%,var(--surface))}
.cert h3{font-size:1.5rem}

.langs{display:flex;gap:6px;flex-wrap:wrap}
.lang{border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 12px;font-weight:800;font-size:.88rem}
.lang[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.note{background:color-mix(in srgb,var(--banana) 18%,var(--surface));border-radius:12px;padding:10px 14px;font-weight:600;font-size:.92rem}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;max-width:calc(100% - 32px);z-index:9}
.foot{color:var(--muted);font-size:.8rem;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.foot .row{justify-content:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div class="app">
  <header class="topbar">
    <button class="brand" id="homeBtn" aria-label="TypeMonkey home"><span id="brandMonkey"></span><span class="word">Type<b>Monkey</b></span></button>
    <div class="stats">
      <div class="stat" title="Day streak">🔥 <span id="sStreak">0</span></div>
      <div class="stat" title="Bananas">🍌 <span id="sBan">0</span></div>
      <div class="stat"><i>XP</i> <span id="sXp">0</span></div>
    </div>
  </header>
  <main id="screen"></main>
  <footer class="foot" id="foot"></footer>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* TypeMonkey · JavaScript course · Units 1–2
   Step types: talk, code, quiz, fill, order, game(uses lesson.pool), done
   code steps: use=[[regex,msg]], out=[exact lines], outRe=[regex], variants=[[find,replace,[lines]]], hint */
const C=s=>`<code class="i">${s}</code>`;

const JS_UNIT1={name:"Talking to the computer",free:true,lessons:[
{id:"js1",title:"Hello, console",sub:"console.log, strings, variables",steps:[
 {type:"talk",title:"Hey, I'm TypeMonkey.",mood:"cheer",
  body:`<p>We're going to learn JavaScript, the language that runs inside every web browser. Websites, games, apps, even some robots use it.</p><p>Today you'll make the computer talk back to you.</p>`,
  say:"I'll be right here the whole way. Tap Continue!"},
 {type:"talk",title:"Make the computer talk",
  body:`<p>${C("console.log()")} prints whatever you put inside the parentheses. Text goes inside quotes, and text in quotes is called a <b>string</b>.</p>`,
  demo:`console.log("Hello, world!");\nconsole.log("I'm learning JavaScript");`,
  say:"Press ▶ Run and watch the console. Change the text and run it again!"},
 {type:"talk",title:"Boxes with names",mood:"think",
  body:`<p>A <b>variable</b> is a labeled box that holds a value. Use ${C("const")} for a box you won't change, and ${C("let")} for one you will.</p>`,
  demo:`const snack = "banana";\nlet count = 3;\nconsole.log(snack);\nconsole.log(count);`,
  say:"Notice: no quotes around snack when we print it. We want what's IN the box."},
 {type:"fill",title:"Fill in the blanks",body:`<p>Make a box called ${C("city")} and print what's inside it.</p>`,
  code:`[0] city = "Paris";\nconsole.log([1]);`,blanks:["const","city"],tokens:["const","city","\"city\"","print"],
  why:"const makes the box, and city (no quotes) reads what's inside."},
 {type:"code",title:"Your turn: introduce yourself",
  body:`<p>Make a ${C("const")} called ${C("name")} with your name in it. Then print ${C("Hi, I'm")} followed by your name. You can glue strings together with ${C("+")}.</p>`,
  start:`// Your code here\nconst name = \n`,
  use:[[/\bconst\s+name\s*=/,"Create the box with: const name = \"...\""]],
  outRe:[[/^Hi, I'm \S+/,"Print it exactly like: Hi, I'm Sam   (hint: \"Hi, I'm \" + name)"]],
  hint:`const name = "Sam";\nconsole.log("Hi, I'm " + name);`},
 {type:"quiz",q:"Which keyword makes a variable you can't reassign?",opts:["const","let","var","fixed"],a:0,why:"const locks the box. let lets you put a new value in later."},
 {type:"quiz",q:"What does this print?",code:`console.log("2" + 2);`,opts:["22","4","\"2\" + 2","An error"],a:0,mono:true,why:"\"2\" is a string, so + glues instead of adds. Sneaky, right?"},
 {type:"quiz",q:"Which one is a valid string?",opts:["'hello'","hello","<hello>","(hello)"],a:0,mono:true,why:"Strings need quotes. Single ' or double \" both work."},
 {type:"game"},{type:"done"}],
 pool:[
  [`console.log("Hi" + "!");`,["Hi!","Hi +!","Hi !"]],
  [`const a = "Ty";\nconsole.log(a + "pe");`,["Type","a + pe","Ty pe"]],
  [`const x = "box";\nconsole.log(x);`,["box","x","\"box\""]],
  [`console.log("3" + 4);`,["34","7","NaN"]],
  [`console.log(3 + 4);`,["7","34","3 + 4"]],
  [`let pet = "cat";\nconsole.log("my " + pet);`,["my cat","my pet","mycat"]],
  [`const n = "5";\nconsole.log(n + n);`,["55","10","n + n"]]
 ]},

{id:"js2",title:"Numbers & math",sub:"+ − * /, order of operations, %",steps:[
 {type:"talk",title:"JavaScript is a calculator",
  body:`<p>Numbers don't need quotes. You can add ${C("+")}, subtract ${C("-")}, multiply ${C("*")} and divide ${C("/")}.</p>`,
  demo:`console.log(7 + 3);\nconsole.log(7 - 3);\nconsole.log(7 * 3);\nconsole.log(7 / 2);`,
  say:"Run it. Yep, 7 / 2 gives 3.5. Decimals just work."},
 {type:"talk",title:"Order matters",mood:"think",
  body:`<p>Just like math class, ${C("*")} and ${C("/")} happen before ${C("+")} and ${C("-")}. Parentheses go first of all.</p><p>Two bonus operators: ${C("%")} gives the <b>remainder</b> after dividing, and ${C("**")} is "to the power of".</p>`,
  demo:`console.log(2 + 3 * 4);\nconsole.log((2 + 3) * 4);\nconsole.log(10 % 3);\nconsole.log(2 ** 3);`,
  say:"10 % 3 is 1, because 3 fits into 10 three times with 1 left over."},
 {type:"quiz",q:"What does this print?",code:`console.log(10 % 4);`,opts:["2","2.5","0","4"],a:0,mono:true,why:"4 fits into 10 twice (8), leaving 2."},
 {type:"fill",title:"Price check",body:`<p>Print the total cost of 3 items that cost 4 each.</p>`,
  code:`const price = 4;\nconst qty = 3;\nconsole.log(price [0] qty);`,blanks:["*"],tokens:["*","+","%","/"],
  why:"4 * 3 = 12. Multiply price by quantity."},
 {type:"code",title:"Banana budget",
  body:`<p>You have 20 dollars and bananas cost 3 each. Print how much money is <b>left over</b> after buying as many as you can.</p>`,
  start:`const money = 20;\nconst cost = 3;\n// print the leftover money\n`,
  use:[[/%/,"The remainder operator % is perfect for 'left over'."]],out:["2"],
  hint:`const money = 20;\nconst cost = 3;\nconsole.log(money % cost);`},
 {type:"quiz",q:"What does this print?",code:`console.log(2 + 3 * 4);`,opts:["14","20","9"],a:0,mono:true,why:"Multiply first: 3 * 4 = 12, then 2 + 12 = 14."},
 {type:"quiz",q:"What does this print?",code:`console.log(5 + "5");`,opts:["55","10","Error"],a:0,mono:true,why:"Mixing a number with a string turns + into gluing."},
 {type:"game"},{type:"done"}],
 pool:[
  [`console.log(8 - 3 * 2);`,["2","10","13"]],
  [`console.log((8 - 3) * 2);`,["10","2","13"]],
  [`console.log(9 % 2);`,["1","4.5","0"]],
  [`console.log(12 / 4);`,["3","48","8"]],
  [`console.log(2 ** 4);`,["16","8","6"]],
  [`console.log(7 % 7);`,["0","1","7"]],
  [`console.log(1 + 2 + "3");`,["33","6","123"]],
  [`console.log(10 - 2 - 3);`,["5","11","9"]]
 ]},

{id:"js3",title:"Strings that do stuff",sub:"joining, length, template literals, methods",steps:[
 {type:"talk",title:"Gluing strings",
  body:`<p>${C("+")} joins strings. Every string also knows its own length with ${C(".length")}.</p>`,
  demo:`const first = "Type";\nconst last = "Monkey";\nconsole.log(first + last);\nconsole.log(first + " " + last);\nconsole.log(last.length);`,
  say:"Spaces count as characters too. \" \" is a string with one space in it."},
 {type:"talk",title:"Template literals",mood:"cheer",
  body:`<p>Backticks ${C("`")} let you drop variables right into a string with ${C("${ }")}. Way cleaner than lots of ${C("+")}.</p>`,
  demo:"const name = \"Mo\";\nconst age = 4;\nconsole.log(`${name} is ${age} years old`);\nconsole.log(`Next year: ${age + 1}`);",
  say:"You can even do math inside ${ }. Try it!"},
 {type:"talk",title:"String superpowers",
  body:`<p>Strings come with built-in <b>methods</b>: ${C(".toUpperCase()")}, ${C(".toLowerCase()")} and ${C(".includes()")}. You can grab one letter with square brackets. Counting starts at <b>0</b>.</p>`,
  demo:`const word = "banana";\nconsole.log(word.toUpperCase());\nconsole.log(word.includes("nan"));\nconsole.log(word[0]);\nconsole.log(word[1]);`,
  say:"word[0] is the FIRST letter. Programmers count from zero."},

  body:`<p>A <b>boolean</b> is either ${C("true")} or ${C("false")}. Comparisons give you booleans: ${C("&gt;")} ${C("&lt;")} ${C("&gt;=")} ${C("&lt;=")}, ${C("===")} (equal) and ${C("!==")} (not equal).</p>`,

{id:"js6",title:"if / else",sub:"making your code choose",steps:[

  body:`<p>${C("if")} runs a block of code only when its condition is ${C("true")}. The block lives inside curly braces ${C("{ }")}.</p>`,

  say:"Change hunger to 2 and run it again. The banana line disappears."},
 {type:"talk",title:"Otherwise…",
  body:`<p>${C("else")} runs when the condition is ${C("false")}. Exactly one of the two blocks will run.</p>`,
  demo:`const temp = 12;\nif (temp > 20) {\n  console.log("Wear shorts");\n} else {\n  console.log("Grab a jacket");\n}`,
  say:"Indenting the inside lines makes code way easier to read."},

{id:"js7",title:"else if & logic",sub:"many choices, &&, ||, !",steps:[

  body:`<p>Chain checks with ${C("else if")}. JavaScript tests them top to bottom and runs the <b>first</b> one that's true.</p>`,
  demo:`const score = 84;\nif (score >= 90) {\n  console.log("A");\n} else if (score >= 80) {\n  console.log("B");\n} else if (score >= 70) {\n  console.log("C");\n} else {\n  console.log("Keep practicing");\n}`,
  say:"84 isn't >= 90, but it is >= 80, so it stops at B."},

  body:`<p>${C("&amp;&amp;")} means AND: both sides must be true. ${C("||")} means OR: at least one side is true. ${C("!")} flips true to false.</p>`,
  demo:`const hasTicket = true;\nconst age = 15;\nconsole.log(hasTicket && age >= 13);\nconsole.log(age < 12 || age > 65);\nconsole.log(!hasTicket);`,
  say:"&& is picky. || is chill."},

{id:"js12",title:"Project: FizzBuzz",sub:"the famous interview puzzle",project:true,steps:[
 {type:"talk",title:"A classic",mood:"cheer",
  body:`<p>FizzBuzz is a real puzzle used in coding job interviews. The rules:</p><p>Count from 1 to 15. For multiples of 3 print ${C("Fizz")}. For multiples of 5 print ${C("Buzz")}. For multiples of both print ${C("FizzBuzz")}. Otherwise print the number.</p>`,
  say:"Hint: check the 'both' case FIRST. Order matters!"},
 {type:"code",title:"Warm-up: countdown",
  body:`<p>Print 5, 4, 3, 2, 1 and then ${C("Go!")}.</p>`,start:`// countdown here\n`,
  use:[[/\bfor\s*\(|\bwhile\s*\(/,"Use a loop."]],out:["5","4","3","2","1","Go!"],
  hint:`for (let i = 5; i >= 1; i--) {\n  console.log(i);\n}\nconsole.log("Go!");`},
 {type:"code",title:"FizzBuzz 1 to 15",
  body:`<p>Write the full FizzBuzz from 1 to 15. A number is a multiple of 3 when ${C("i % 3 === 0")}.</p>`,
  start:`for (let i = 1; i <= 15; i++) {\n  // your if / else if chain here\n}\n`,
  use:[[/\bfor\s*\(/,"Use a for loop."],[/%/,"Use % to check multiples."]],
  out:["1","2","Fizz","4","Buzz","Fizz","7","8","Fizz","Buzz","11","Fizz","13","14","FizzBuzz"],
  hint:`for (let i = 1; i <= 15; i++) {\n  if (i % 15 === 0) {\n    console.log("FizzBuzz");\n  } else if (i % 3 === 0) {\n    console.log("Fizz");\n  } else if (i % 5 === 0) {\n    console.log("Buzz");\n  } else {\n    console.log(i);\n  }\n}`},
 {type:"done"}]}
]};

{id:"js14",title:"Return values",sub:"functions that hand back an answer",steps:[
 {type:"talk",title:"Give something back",
  body:`<p>${C("return")} sends a value back to wherever the function was called. Then you can store it or print it.</p>`,
  demo:`function add(a, b) {\n  return a + b;\n}\nconst result = add(2, 3);\nconsole.log(result);\nconsole.log(add(10, 20));`,
  say:"Printing shows a value. Returning hands it over so your code can use it."},
 {type:"talk",title:"return ends the function",mood:"think",
  body:`<p>As soon as ${C("return")} runs, the function stops. Anything after it is skipped.</p>`,
  demo:`function double(n) {\n  return n * 2;\n  console.log("never runs");\n}\nconsole.log(double(4));`,
  say:"Useful trick: return early when you already know the answer."},

{id:"js15",title:"Arrow functions & scope",sub:"the short way, and where variables live",steps:[
 {type:"talk",title:"Arrow functions",
  body:`<p>Modern JavaScript has a shorter way to write functions using ${C("=&gt;")}. If it's one expression, the answer returns automatically.</p>`,
  demo:"const triple = (n) => n * 3;\nconsole.log(triple(4));\n\nconst greet = (name) => {\n  return `Hi, ${name}`;\n};\nconsole.log(greet(\"Sky\"));",
  say:"You'll see arrows everywhere in real code."},
 {type:"talk",title:"Scope: where variables live",mood:"think",
  body:`<p>A variable made <b>inside</b> a function only exists inside it. Variables made outside can be used anywhere.</p>`,
  demo:`const outside = "I'm global";\nfunction test() {\n  const inside = "I'm local";\n  console.log(outside);\n  console.log(inside);\n}\ntest();\nconsole.log(inside);`,
  say:"That last line errors: inside doesn't exist out here."},
 {type:"quiz",q:"What does this print?",code:`const half = (n) => n / 2;\nconsole.log(half(10));`,opts:["5","20","n / 2"],a:0,mono:true,why:"One-line arrow functions return automatically."},
 {type:"fill",title:"Write an arrow",body:`<p>Make add return a + b.</p>`,
  code:`const add = (a, b) [0] a + b;\nconsole.log(add(2, 2));`,blanks:["=>"],tokens:["=>",">=","->","=="],why:"=> is the arrow. >= means greater-or-equal."},

  body:`<p>Write an arrow function ${C("toF")} that turns Celsius into Fahrenheit: ${C("c * 9 / 5 + 32")}. Print ${C("toF(100)")} and ${C("toF(0)")}.</p>`,
  start:`// const toF = ...\n\n`,
  use:[[/=>/,"Use an arrow function: const toF = (c) => ..."]],out:["212","32"],
  hint:`const toF = (c) => c * 9 / 5 + 32;\nconsole.log(toF(100));\nconsole.log(toF(0));`},
 {type:"game"},{type:"done"}],

{id:"js16",title:"Project: Tip Calculator",sub:"functions working together",project:true,steps:[
 {type:"talk",title:"Build a real tool",mood:"cheer",
  body:`<p>You'll build the brain of a tip calculator app: small functions that each do one job, then combine them.</p>`,
  say:"This is how real apps are built. Small pieces."},
 {type:"code",title:"Step 1: the tip",
  body:`<p>Write ${C("tip(bill, percent)")} that returns the tip amount: ${C("bill * percent / 100")}. Print ${C("tip(50, 20)")}.</p>`,
  start:`// define tip\n\nconsole.log(tip(50, 20));\n`,
  use:[[/\breturn\b|=>/,"Return the tip from your function."]],out:["10"],variants:[[/tip\(50, 20\)\)/,"tip(80, 15))",["12"]]],
  hint:`function tip(bill, percent) {\n  return bill * percent / 100;\n}\n\nconsole.log(tip(50, 20));`},
 {type:"code",title:"Step 2: the total",
  body:`<p>Add ${C("total(bill, percent)")} that uses ${C("tip")} and returns bill plus tip. Print ${C("Total: $50")} for a 40 dollar bill with 25% tip.</p>`,
  start:"function tip(bill, percent) {\n  return bill * percent / 100;\n}\n\n// define total here\n\nconsole.log(`Total: $${total(40, 25)}`);\n",
  use:[[/function\s+total|total\s*=/,"Define a function called total."],[/tip\(/,"Call tip() inside total."]],out:["Total: $50"],
  hint:"function tip(bill, percent) {\n  return bill * percent / 100;\n}\n\nfunction total(bill, percent) {\n  return bill + tip(bill, percent);\n}\n\nconsole.log(`Total: $${total(40, 25)}`);"},
 {type:"code",title:"Step 3: split the bill",
  body:`<p>Add ${C("split(bill, percent, people)")} that returns each person's share. Print ${C("split(90, 20, 4)")}, which should be ${C("27")}.</p>`,
  start:"function tip(bill, percent) {\n  return bill * percent / 100;\n}\nfunction total(bill, percent) {\n  return bill + tip(bill, percent);\n}\n\n// define split here\n\nconsole.log(split(90, 20, 4));\n",
  use:[[/total\(/,"Reuse total() inside split."]],out:["27"],
  hint:"function tip(bill, percent) {\n  return bill * percent / 100;\n}\nfunction total(bill, percent) {\n  return bill + tip(bill, percent);\n}\n\nfunction split(bill, percent, people) {\n  return total(bill, percent) / people;\n}\n\nconsole.log(split(90, 20, 4));"},
 {type:"done"}]}
]};

{id:"js18",title:"Changing arrays",sub:"push, pop, includes, indexOf",steps:[

  body:`<p>${C(".push()")} adds to the end. ${C(".pop()")} removes the last item and gives it back to you.</p>`,

  demo:`const pets = ["cat", "dog", "fish"];\nconsole.log(pets.includes("dog"));\nconsole.log(pets.indexOf("fish"));\nconsole.log(pets.indexOf("lion"));`,

{id:"js21",title:"Project: Shopping Cart",sub:"arrays + loops + functions",project:true,steps:[

  say:"Real e-commerce code looks a lot like this!"},
 {type:"code",title:"Step 1: cart total",
  body:`<p>Write ${C("cartTotal(prices)")} that returns the sum of all prices. Print ${C("cartTotal(cart)")}.</p>`,
  start:`const cart = [4, 10, 6];\n\n// define cartTotal\n\nconsole.log(cartTotal(cart));\n`,

  use:[[/\bif\s*\(/,"Use if / else."]],out:["Add $5 for free shipping"],variants:[[/\[4, 10, 6\]/,"[20, 10]",["Free shipping!"]],[/\[4, 10, 6\]/,"[24]",["Add $1 for free shipping"]]],
  hint:"const cart = [4, 10, 6];\nfunction cartTotal(prices) {\n  let sum = 0;\n  for (const p of prices) sum += p;\n  return sum;\n}\nconst total = cartTotal(cart);\nif (total >= 25) {\n  console.log(\"Free shipping!\");\n} else {\n  console.log(`Add $${25 - total} for free shipping`);\n}"},

{id:"js24",title:"Arrays of objects",sub:"lists of real-world data",steps:[
 {type:"talk",title:"Real data looks like this",
  body:`<p>Apps store lists of objects: users, products, posts. Loop over them like any array.</p>`,
  demo:"const students = [\n  { name: \"Ava\", score: 92 },\n  { name: \"Leo\", score: 74 },\n  { name: \"Kai\", score: 85 }\n];\nfor (const s of students) {\n  console.log(`${s.name} got ${s.score}`);\n}",

  demo:"const students = [\n  { name: \"Ava\", score: 92 },\n  { name: \"Leo\", score: 74 },\n  { name: \"Kai\", score: 85 }\n];\nconst honor = students.filter((s) => s.score >= 80);\nconsole.log(honor.map((s) => s.name));",

{id:"js25",title:"Final Project: Leaderboard",sub:"everything you've learned, in one app",project:true,steps:[
 {type:"talk",title:"The final boss",mood:"cheer",
  body:`<p>Every game has a leaderboard. You'll build one from scratch: sorting players, printing ranks, and adding new scores. Here's one new tool you'll need:</p>`,
  demo:`const nums = [30, 10, 20];\nnums.sort((a, b) => b - a);\nconsole.log(nums);`,
  say:"sort with (a, b) => b - a puts the biggest first. That's all you need!"},
 {type:"code",title:"Step 1: who's on top?",
  body:`<p>Sort the players by score, highest first, then print the top player's name.</p>`,
  start:`const players = [\n  { name: "Leo", score: 720 },\n  { name: "Ava", score: 950 },\n  { name: "Kai", score: 810 }\n];\n`,
  use:[[/\.sort\(/,"Use .sort((a, b) => b.score - a.score)."]],out:["Ava"],variants:[[/score: 720/,"score: 999",["Leo"]]],
  hint:`const players = [\n  { name: "Leo", score: 720 },\n  { name: "Ava", score: 950 },\n  { name: "Kai", score: 810 }\n];\nplayers.sort((a, b) => b.score - a.score);\nconsole.log(players[0].name);`},
 {type:"code",title:"Step 2: print the board",
  body:`<p>Print the sorted board with ranks, like ${C("1. Ava - 950")}.</p>`,
  start:`const players = [\n  { name: "Leo", score: 720 },\n  { name: "Ava", score: 950 },\n  { name: "Kai", score: 810 }\n];\nplayers.sort((a, b) => b.score - a.score);\n// print each rank\n`,
  use:[[/\bfor\s*\(|forEach/,"Use a loop. The index helps with the rank number."]],out:["1. Ava - 950","2. Kai - 810","3. Leo - 720"],
  hint:"const players = [\n  { name: \"Leo\", score: 720 },\n  { name: \"Ava\", score: 950 },\n  { name: \"Kai\", score: 810 }\n];\nplayers.sort((a, b) => b.score - a.score);\nfor (let i = 0; i < players.length; i++) {\n  const p = players[i];\n  console.log(`${i + 1}. ${p.name} - ${p.score}`);\n}"},
 {type:"code",title:"Step 3: new high score",
  body:`<p>Write ${C("addScore(name, score)")} that pushes a new player, re-sorts the board and <b>returns</b> the new rank (1 for first place). Add ${C("Mo")} with 880 and print the rank.</p>`,
  start:`const players = [\n  { name: "Leo", score: 720 },\n  { name: "Ava", score: 950 },\n  { name: "Kai", score: 810 }\n];\n\n// define addScore\n\nconsole.log(addScore("Mo", 880));\n`,
  use:[[/\.push\(/,"Push the new player in."],[/\.sort\(/,"Sort again after adding."],[/\breturn\b/,"Return the rank."]],out:["2"],
  variants:[[/addScore\("Mo", 880\)/,"addScore(\"Mo\", 1000)",["1"]],[/addScore\("Mo", 880\)/,"addScore(\"Mo\", 5)",["4"]]],
  hint:`const players = [\n  { name: "Leo", score: 720 },\n  { name: "Ava", score: 950 },\n  { name: "Kai", score: 810 }\n];\n\nfunction addScore(name, score) {\n  const p = { name: name, score: score };\n  players.push(p);\n  players.sort((a, b) => b.score - a.score);\n  return players.indexOf(p) + 1;\n}\n\nconsole.log(addScore("Mo", 880));`},
 {type:"done"}]}
]};

  body:`<p>In C#, you say what <b>type</b> a variable holds: ${C("int")} for whole numbers, ${C("double")} for decimals, ${C("string")} for text and ${C("bool")} for true/false.</p>`,

/* ---------- Code runner: in-page, loop-guarded, with a fallback if eval is blocked ---------- */
function guardLoops(code){
  const G="__tmG()";let res="",i=0;const re=/\b(for|while)\s*\(|\bdo\s*\{/g;
  while(i<code.length){
    re.lastIndex=i;const m=re.exec(code);
    if(!m){res+=code.slice(i);break}
    res+=code.slice(i,m.index);
    if(m[0].startsWith("do")){res+="do{"+G+";";i=m.index+m[0].length;continue}
    let j=m.index+m[0].length,depth=1,q=null;const start=j;
    for(;j<code.length&&depth;j++){const ch=code[j];
      if(q){if(ch==="\\")j++;else if(ch===q)q=null;continue}
      if(ch==='"'||ch==="'"||ch==="`")q=ch;else if(ch==="(")depth++;else if(ch===")")depth--;}
    if(depth){res+=code.slice(m.index);break}
    const inner=code.slice(start,j-1);let out;
    if(m[1]==="while")out=`while(${G}&&(${inner}))`;
    else{
      let parts=[],d=0,last=0,qq=null;
      for(let k=0;k<inner.length;k++){const ch=inner[k];
        if(qq){if(ch==="\\")k++;else if(ch===qq)qq=null;continue}
        if(ch==='"'||ch==="'"||ch==="`")qq=ch;else if("([{".includes(ch))d++;else if(")]}".includes(ch))d--;
        else if(ch===";"&&!d){parts.push(inner.slice(last,k));last=k+1}}
      parts.push(inner.slice(last));
      if(parts.length===3)out=`for(${parts[0]};${G}&&(${parts[1].trim()||"true"});${parts[2]})`;
      else{const b=code.slice(j).match(/^\s*\{/);out=`for(${inner})`+(b?b[0]+G+";":"");if(b)j+=b[0].length}
    }
    res+=out;i=j;
  }
  return res;
}
function makeConsole(out){
  const fmt=v=>typeof v==="string"?v:(()=>{try{const j=JSON.stringify(v);return j===undefined?String(v):j}catch(_){return String(v)}})();
  const lg=(...a)=>out.push(["log",a.map(fmt).join(" ")]);
  return {log:lg,info:lg,warn:lg,error:(...a)=>out.push(["err",a.map(fmt).join(" ")])};
}
let evalBlocked=false;
function runCode(code){
  const out=[];const con=makeConsole(out);
  const body="let __tmN=0;const __tmG=()=>{if(++__tmN>100000)throw new Error('Your loop ran 100,000 times, so I stopped it. Check that it can end.');return true};\n"+guardLoops(code);
  if(!evalBlocked){
    let fn=null;
    try{fn=new Function("console",body)}catch(err){
      if(err instanceof SyntaxError){out.push(["err","SyntaxError: "+err.message]);return Promise.resolve(out)}
      evalBlocked=true;
    }
    if(fn){try{fn(con)}catch(err){out.push(["err",(err.name||"Error")+": "+err.message])}return Promise.resolve(out)}
  }
  return new Promise(res=>{
    window.__tmCon=con;
    const onErr=e=>{out.push(["err",String(e.message||e).replace(/^Uncaught /,"").replace(/Failed to execute '\w+' on '\w+': /,"")]);e.preventDefault&&e.preventDefault()};
    window.addEventListener("error",onErr);
    const s=document.createElement("script");
    s.textContent="(function(console){try{"+body+"\n}catch(err){console.error((err.name||'Error')+': '+err.message)}})(window.__tmCon);";
    document.body.appendChild(s);s.remove();window.removeEventListener("error",onErr);res(out);
  });
}
function paintConsole(el,out){
  el.innerHTML=out.length?out.map(([k,v])=>`<div class="${k==="err"?"err":""}">${k==="err"?"✖ ":"› "}${esc(v)}</div>`).join(""):'<span class="dim">(nothing printed. Try console.log)</span>';
}

/* ---------- Grading code challenges ---------- */
const norm=l=>{l=String(l).trim();return /^[\[{]/.test(l)?l.replace(/\s+/g,""):l};
function checkOut(st,out){
  const err=out.find(o=>o[0]==="err");
  if(err)return [false,"Your code hit an error. Read the red line in the console. A missing quote, bracket or brace is the usual suspect."];
  const logs=out.filter(o=>o[0]==="log").map(o=>o[1]);
  if(st.out){
    const ok=st.out.length===logs.length&&st.out.every((e,i)=>norm(e)===norm(logs[i]));
    if(!ok)return [false,"Close! The output doesn't match yet.",`Expected:\n${st.out.join("\n")}\n\nYou printed:\n${logs.join("\n")||"(nothing)"}`];
  }
  for(const [re,msg] of st.outRe||[])if(!logs.some(l=>re.test(l)))return [false,msg];
  return [true];
}
async function grade(st,code){
  for(const [re,msg] of st.use||[])if(!re.test(code))return [false,msg];
  const r=checkOut(st,await runCode(code));if(!r[0])return r;
  for(const [find,rep,lines] of st.variants||[]){
    if(!find.test(code))continue;
    const r2=checkOut({out:lines},await runCode(code.replace(find,rep)));
    if(!r2[0])return [false,`Works for this example, but I changed the starting value (${rep}) and it broke. Make sure your code uses the variables instead of fixed answers.`,r2[2]];
  }
  return [true,st.win||pick(WINS)];
}

function findLesson(id){for(const c of COURSES){const f=flat(c).find(x=>x.l.id===id);if(f)return {c,...f}}return null}
function status(c,item){

  if(S.done.includes(l.id))return "done";

  return (!prev.l.steps||S.done.includes(prev.l.id))?"open":"locked";
}
function countLessons(c){const L=flat(c).filter(x=>x.l.steps);return [L.filter(x=>S.done.includes(x.l.id)).length,L.length,flat(c).length]}
function nextUp(c){const L=flat(c);return L.find(x=>S.progress[x.l.id])||L.find(x=>status(c,x)==="open")}

  $("#foot").innerHTML=`<span>Prototype · progress saves on this device only</span>
   <div class="row"><button class="linkbtn" id="tester">${S.tester?"Tester mode: ON (all lessons open)":"Tester mode: off"}</button><button class="linkbtn" id="reset">Reset progress</button></div><div id="confirm"></div>`;
  $("#tester").onclick=()=>{S.tester=!S.tester;save();toast(S.tester?"Tester mode on: every lesson is open.":"Tester mode off.");rerender()};
  $("#reset").onclick=()=>{$("#confirm").innerHTML=`<div class="row"><span>Erase all XP, bananas and lessons?</span><button class="btn sm" id="yes">Erase</button><button class="btn ghost sm" id="no">Keep</button></div>`;
    $("#yes").onclick=()=>{S={xp:0,bananas:0,streak:0,lastDay:null,done:[],progress:{},pro:false,tester:false};save();toast("Progress erased.");home()};
    $("#no").onclick=()=>$("#confirm").innerHTML=""};
}
let rerender=home;

/* ---------- Course page ---------- */
function coursePage(cid){
  rerender=()=>coursePage(cid);
  const c=courseById(cid);const L=flat(c);const [d,n]=countLessons(c);
  $("#screen").innerHTML=`<div class="stack">
    <div class="row"><button class="btn ghost sm" id="back">← Courses</button></div>
    <section class="hero"><div class="label">Course</div><h1>${c.name}</h1><p>${c.blurb||""}</p></section>
    <div class="row"><div class="progress"><span style="width:${n?d/n*100:0}%"></span></div><b style="font-variant-numeric:tabular-nums">${d}/${n}</b></div>
    ${c.units.map((u,ui)=>`<div class="unit"><div class="unit-head"><h3>Unit ${ui+1} · ${u.name}</h3><span class="label">${u.free?"Free":S.pro?"Unlocked":"Pro"}</span></div><div class="lessons">${
      L.filter(x=>x.ui===ui).map(x=>{const st=status(c,x);const res=S.progress[x.l.id]&&st!=="pro"&&st!=="soon";
        const cls=st==="done"&&!res?"done":(st==="open"||res||st==="done")?"open":"";
        return `<button class="lesson ${cls} ${x.l.project?"proj":""}" data-l="${x.l.id}" ${st==="open"||st==="done"||res?"":"disabled"}>
          <span class="dot">${st==="done"&&!res?"✓":x.l.project?"★":x.idx+1}</span>
          <span class="t"><b>${x.l.title}</b><span>${res?`Step ${S.progress[x.l.id].step+1} of ${x.l.steps.length-1} · saved`:x.l.sub}</span></span>
          <span class="pill ${st==="open"||res?"go":st==="done"?"ok":""}">${res?"Resume":{done:"Replay",open:"Play",pro:"Pro",locked:"🔒",soon:"Soon"}[st]}</span></button>
          ${res?`<button class="linkbtn" data-restart="${x.l.id}">Start “${x.l.title}” over</button>`:""}`}).join("")}</div></div>`).join("")}
    ${S.pro?"":`<div class="paywall"><div><h3>Unlock all of TypeMonkey</h3><p>Every unit in every language, plus future courses and bonus games. One-time purchase.</p></div><button class="btn banana" id="buy">Unlock · $4.99</button></div>`}
  </div>`;
  $("#back").onclick=home;
  if($("#buy"))$("#buy").onclick=()=>{S.pro=true;save();toast("Demo unlock: everything is open. In the real app this is the App Store / Google Play purchase.");coursePage(cid)};
  $$(".lesson:not([disabled])").forEach(b=>b.onclick=()=>startLesson(b.dataset.l));
  $$("[data-restart]").forEach(b=>b.onclick=()=>{delete S.progress[b.dataset.restart];save();startLesson(b.dataset.restart)});
  foot();window.scrollTo(0,0);
}

/* ---------- Lesson runner ---------- */
let cur=null;
function startLesson(id){
  const f=findLesson(id);const p=S.progress[id];
  cur={c:f.c,l:f.l,item:f,step:0,earned:{xp:0,ban:0,right:0,total:0}};
  if(p&&p.step>0&&p.step<f.l.steps.length-1){cur.step=p.step;cur.earned={...cur.earned,...p.earned}}
  rerender=renderStep;renderStep();
}
function saveSpot(){
  const p=S.progress[cur.l.id]||{drafts:{}};
  S.progress[cur.l.id]={...p,step:cur.step,earned:{...cur.earned}};save();
}
function draft(k,v){const p=S.progress[cur.l.id];if(!p)return;p.drafts=p.drafts||{};if(v===undefined)return p.drafts[k];p.drafts[k]=v;save()}
function shell(inner){
  const pct=Math.round(cur.step/(cur.l.steps.length-1)*100);
  $("#screen").innerHTML=`<div class="stack">
    <div class="lessonbar"><button class="x" id="quit" aria-label="Leave lesson">×</button><div class="progress"><span style="width:${pct}%"></span></div></div>
    ${inner}</div>`;
  $("#quit").onclick=()=>coursePage(cur.c.id);
  $("#foot").innerHTML="";window.scrollTo(0,0);
}
function next(){cur.step++;renderStep()}
function editorBlock(id,code,runnable,file){
  return `<div class="editor"><div class="head"><span>${file}</span>${runnable?`<button class="run" id="run-${id}">▶ Run</button>`:""}</div>
    ${runnable?`<textarea id="code-${id}" spellcheck="false" autocapitalize="off" autocorrect="off" aria-label="Code editor" rows="${Math.min(14,Math.max(5,code.split("\n").length+1))}">${esc(code)}</textarea>
    <div class="console" id="out-${id}"><span class="dim">Console output appears here</span></div>`:`<pre>${esc(code)}</pre>`}</div>`;
}
function wireEditor(id,after){
  const ta=$("#code-"+id);if(!ta)return;
  ta.addEventListener("keydown",e=>{if(e.key==="Tab"){e.preventDefault();const s=ta.selectionStart;ta.value=ta.value.slice(0,s)+"  "+ta.value.slice(ta.selectionEnd);ta.selectionStart=ta.selectionEnd=s+2}});
  $("#run-"+id).onclick=async()=>{const out=await runCode(ta.value);paintConsole($("#out-"+id),out);after&&after(ta.value,out)};
}
const award=(xp,ban=0)=>{cur.earned.xp+=xp;cur.earned.ban+=ban};

function renderStep(){
  const s=cur.l.steps[cur.step];const R=cur.c.runnable;
  if(s.type!=="done")saveSpot();
  const T={talk,code:codeStep,quiz,fill,order,game:gameIntro,done:finish}[s.type];T(s,R);
}
function talk(s,R){
  shell(`<div class="card"><h2>${s.title}</h2>${s.body}${s.demo?editorBlock("d",s.demo,R,cur.c.lang):""}</div>
    ${buddy(s.say||"",s.mood||"happy")}<div class="row"><button class="btn" id="go">Continue</button></div>`);
  if(s.demo&&R)wireEditor("d");$("#go").onclick=next;
}
function codeStep(s){
  let tries=0,solved=false;const k="c"+cur.step;
  shell(`<div class="card"><div class="label">${cur.l.project?"Project step":"Code challenge"} · +30 XP</div><h2>${s.title}</h2>${s.body}${editorBlock("c",draft(k)||s.start,true,cur.c.lang)}<div id="fb"></div></div>
    <div id="bud">${buddy("Write your code, then hit ▶ Run. I'll check it for you.","think")}</div>
    <div class="row"><button class="btn" id="go" disabled>Continue</button><button class="btn ghost" id="hint">Show me how</button></div>`);
  wireEditor("c",async(code)=>{
    tries++;const [ok,msg,detail]=await grade(s,code);
    $("#fb").innerHTML=`<div class="feedback ${ok?"good":"bad"}">${ok?"✓ ":""}${esc(msg)}${detail?`<pre>${esc(detail)}</pre>`:""}</div>`;
    $("#bud").innerHTML=buddy(ok?"Look at you go! 🍌 +5":tries>2?"Stuck? Tap “Show me how”. Peeking is part of learning.":"Not quite yet. You've got this.",ok?"cheer":"oops");
    if(ok&&!solved){solved=true;$("#go").disabled=false;award(30,5)}
  });
  $("#code-c").addEventListener("input",()=>draft(k,$("#code-c").value));
  $("#hint").onclick=()=>{$("#code-c").value=s.hint;draft(k,s.hint);$("#bud").innerHTML=buddy("Here's one way to write it. Read it line by line, then press ▶ Run.","happy")};
  $("#go").onclick=next;
}
function quiz(s){
  const order=shuffle(s.opts.map((o,i)=>i));
  shell(`<div class="card"><div class="label">Quick quiz · +10 XP</div><h2 style="font-size:1.35rem">${s.q}</h2>${s.code?`<div class="editor"><pre>${esc(s.code)}</pre></div>`:""}
    <div class="opts">${order.map(i=>`<button class="opt ${s.mono?"mono":""}" data-i="${i}">${esc(s.opts[i])}</button>`).join("")}</div><div id="fb"></div></div>
    <div id="bud">${buddy("Take your best guess!","think")}</div><div class="row"><button class="btn" id="go" hidden>Continue</button></div>`);
  $$(".opt").forEach(b=>b.onclick=()=>{
    const ok=+b.dataset.i===s.a;
    $$(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.i===s.a)x.classList.add("right")});
    if(!ok)b.classList.add("wrong");else{award(10);cur.earned.right++}
    cur.earned.total++;
    $("#fb").innerHTML=`<div class="feedback ${ok?"good":"bad"}">${ok?"Correct! ":"Not this time. "}${esc(s.why)}</div>`;
    $("#bud").innerHTML=buddy(ok?"Big brain moment! 🧠":"No worries, now you know!",ok?"cheer":"oops");
    $("#go").hidden=false;
  });
  $("#go").onclick=next;
}
function fill(s){
  const n=s.blanks.length;let slots=Array(n).fill(null),tries=0,doneF=false;
  const toks=shuffle(s.tokens.map((t,i)=>i));
  shell(`<div class="card"><div class="label">Fill in the blanks · +15 XP</div><h2>${s.title}</h2>${s.body||""}
    <div class="editor"><div class="head"><span>${cur.c.lang}</span></div><pre id="fcode"></pre></div>
    <div class="tokens" id="toks">${toks.map(i=>`<button class="token" data-t="${i}">${esc(s.tokens[i])}</button>`).join("")}</div><div id="fb"></div></div>
    <div id="bud">${buddy("Tap a piece to drop it in the next blank. Tap a blank to take it back.","think")}</div>
    <div class="row"><button class="btn" id="check" disabled>Check</button><button class="btn" id="go" hidden>Continue</button></div>`);
  const draw=(marks)=>{
    $("#fcode").innerHTML=esc(s.code).replace(/\[(\d)\]/g,(m,d)=>{const t=slots[d];const mk=marks?marks[d]:"";
      return `<button class="slot ${t!==null?"filled":""} ${mk}" data-s="${d}">${t!==null?esc(s.tokens[t]):"&nbsp;"}</button>`});
    $$(".slot").forEach(b=>b.onclick=()=>{if(doneF)return;const d=+b.dataset.s;if(slots[d]!==null){slots[d]=null;sync()}});
  };
  const sync=()=>{draw();$$(".token").forEach(b=>b.disabled=doneF||slots.includes(+b.dataset.t));$("#check").disabled=slots.includes(null)||doneF};
  $$(".token").forEach(b=>b.onclick=()=>{const e=slots.indexOf(null);if(e<0)return;slots[e]=+b.dataset.t;sync()});
  $("#check").onclick=()=>{
    tries++;const marks=slots.map((t,i)=>s.tokens[t]===s.blanks[i]?"right":"wrong");const ok=!marks.includes("wrong");
    draw(marks);
    if(ok||tries>=2){doneF=true;$("#check").hidden=true;$("#go").hidden=false;$$(".token").forEach(b=>b.disabled=true)}
    if(ok){award(tries===1?15:8);$("#fb").innerHTML=`<div class="feedback good">✓ ${esc(s.why)}</div>`;$("#bud").innerHTML=buddy(pick(WINS),"cheer")}
    else if(tries>=2){$("#fb").innerHTML=`<div class="feedback bad">The answer is: ${s.blanks.map(esc).join(" , ")}. ${esc(s.why)}</div>`;$("#bud").innerHTML=buddy("Tricky one! Now you've seen it, it'll stick.","oops")}
    else{$("#fb").innerHTML=`<div class="feedback bad">The red blanks aren't right yet. Tap them to swap.</div>`;$("#bud").innerHTML=buddy("So close! One more try.","oops")}
  };
  sync();$("#go").onclick=next;
}
function order(s){
  let pool=shuffle(s.lines.map((l,i)=>i));let tries=0;
  if(pool.every((v,i)=>v===i))pool.reverse();
  let picked=[],doneO=false;
  shell(`<div class="card"><div class="label">Put it in order · +15 XP</div><h2>${s.title}</h2>${s.body||""}
    <div class="lines" id="ans"></div><div class="label">Tap the lines in order</div><div class="lines pick" id="pool"></div><div id="fb"></div></div>
    <div id="bud">${buddy("Tap lines to add them. Tap a placed line to send it back.","think")}</div>
    <div class="row"><button class="btn" id="check" disabled>Check</button><button class="btn" id="go" hidden>Continue</button></div>`);
  const draw=(marks)=>{
    $("#ans").innerHTML=picked.length?picked.map((i,k)=>`<button class="ln ${marks?marks[k]:""}" data-k="${k}">${esc(s.lines[i])}</button>`).join(""):'<span class="empty">Your program builds here</span>';
    $("#pool").innerHTML=pool.filter(i=>!picked.includes(i)).map(i=>`<button class="ln" data-i="${i}">${esc(s.lines[i])}</button>`).join("");
    $$("#ans .ln").forEach(b=>b.onclick=()=>{if(doneO)return;picked.splice(+b.dataset.k,1);draw()});
    $$("#pool .ln").forEach(b=>b.onclick=()=>{picked.push(+b.dataset.i);draw()});
    $("#check").disabled=picked.length!==s.lines.length||doneO;
  };
  $("#check").onclick=()=>{
    tries++;
    const marks=picked.map((i,k)=>s.lines[i]===s.lines[k]?"right":"wrong");const ok=!marks.includes("wrong");
    if(ok||tries>=2){doneO=true;$("#check").hidden=true;$("#go").hidden=false}
    if(ok){draw(marks);award(tries===1?15:8);$("#fb").innerHTML=`<div class="feedback good">✓ ${esc(s.why)}</div>`;$("#bud").innerHTML=buddy(pick(WINS),"cheer")}
    else if(tries>=2){picked=s.lines.map((l,i)=>i);draw(picked.map(()=>"right"));$("#fb").innerHTML=`<div class="feedback bad">Here's the right order. ${esc(s.why)}</div>`;$("#bud").innerHTML=buddy("Order is everything in code. You'll get the next one!","oops")}
    else{draw(marks);$("#fb").innerHTML=`<div class="feedback bad">The red lines are in the wrong spot. Tap them to take them back out.</div>`;$("#bud").innerHTML=buddy("Almost! Rearrange the red ones.","oops")}
  };
  draw();$("#go").onclick=next;
}

/* ---------- Mini-game: Output Rush ---------- */
function gameIntro(){
  if(!cur.l.pool||!cur.l.pool.length)return next();
  shell(`<div class="card"><div class="label">Mini-game</div><h2>Output Rush</h2><p>45 seconds on the clock. Read each snippet and tap what it prints. Every right answer earns 2 bananas.</p></div>
    ${buddy("Speed round! Don't overthink it.","cheer")}<div class="row"><button class="btn banana" id="go">Start the clock</button><button class="btn ghost" id="skip">Skip</button></div>`);
  $("#go").onclick=()=>rush(cur.l.pool,45,(score)=>{award(score*3,score*2);next()},()=>coursePage(cur.c.id),cur.c.lang);
  $("#skip").onclick=next;
}
function rush(poolIn,secs,onEnd,onQuit,file){
  const pool=shuffle(poolIn);let i=0,score=0,left=secs,ended=false;
  const timer=setInterval(()=>{left--;const t=$("#tleft");if(t){t.textContent=left;$("#tbar").style.width=(left/secs*100)+"%"}if(left<=0)end()},1000);
  function end(){if(ended)return;ended=true;clearInterval(timer);
    $("#screen").innerHTML=`<div class="stack"><div class="card" style="align-items:center;text-align:center"><div class="label">Time!</div><div class="big">${score}/${pool.length}</div><p>+${score*2} bananas · +${score*3} XP</p></div>
      ${buddy(score>=Math.ceil(pool.length*.8)?"Unreal speed. Are you secretly a monkey?":score>=pool.length/2?"Solid run! Practice makes it automatic.":"Good warm-up. These get easy fast.",score>=pool.length/2?"cheer":"happy")}
      <div class="row"><button class="btn" id="fin">Continue</button></div></div>`;
    $("#fin").onclick=()=>onEnd(score);}
  function round(){
    if(i>=pool.length)return end();
    const [code,opts]=pool[i];const ord=shuffle(opts.map((o,k)=>k));
    $("#screen").innerHTML=`<div class="stack"><div class="game-hud"><button class="x" id="quitg" aria-label="Quit game">×</button><span>⏱ <span id="tleft">${left}</span>s</span><div class="timer"><span id="tbar" style="width:${left/secs*100}%"></span></div><span>🍌 ${score*2}</span></div>
      <div class="card"><div class="label">What prints? · ${i+1} of ${pool.length}</div><div class="editor"><div class="head"><span>${file}</span></div><pre>${esc(code)}</pre></div>
      <p style="color:var(--muted);font-size:.85rem">Several lines of output are shown with spaces between them.</p>
      <div class="opts">${ord.map(k=>`<button class="opt mono" data-k="${k}">${esc(opts[k])}</button>`).join("")}</div></div></div>`;
    $("#quitg").onclick=()=>{clearInterval(timer);ended=true;onQuit()};
    $$(".opt").forEach(b=>b.onclick=()=>{
      const ok=+b.dataset.k===0;b.classList.add(ok?"right":"wrong");if(ok)score++;
      $$(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.k===0)x.classList.add("right")});
      setTimeout(()=>{i++;if(!ended)round()},ok?350:900);
    });
  }
  round();
}
function practice(){
  rerender=home;
  let pool=[];let file="script.js";
  for(const c of COURSES)for(const x of flat(c))if(S.done.includes(x.l.id)&&x.l.pool)pool.push(...x.l.pool);
  if(!pool.length){pool=[...COURSES[0].units[0].lessons[0].pool]}
  pool=shuffle(pool).slice(0,12);
  $("#foot").innerHTML="";
  rush(pool,60,(score)=>{S.xp+=score*3;S.bananas+=score*2;if(score)bumpStreak();save();home()},home,file);
}

/* ---------- Finish ---------- */
function finish(){
  const id=cur.l.id;const first=!S.done.includes(id);
  const bonus=first?20:0;cur.earned.xp+=bonus;
  S.xp+=cur.earned.xp;S.bananas+=cur.earned.ban;bumpStreak();if(first)S.done.push(id);delete S.progress[id];save();
  const L=flat(cur.c);const nx=L[cur.item.idx+1];const nst=nx&&status(cur.c,nx);
  const [d,n,all]=countLessons(cur.c);const courseDone=first&&d===n&&n===all;
  shell(`<div class="card" style="text-align:center;align-items:center"><div class="label">${cur.l.project?"Project complete":"Lesson complete"}</div><h2>${esc(cur.l.title)} ✓</h2>
    <div class="reward"><div><b>+${cur.earned.xp}</b><span>XP</span></div><div><b>+${cur.earned.ban}</b><span>Bananas</span></div><div><b>${S.streak}</b><span>Day streak</span></div></div>
    ${cur.earned.total?`<p>Quiz: ${cur.earned.right} of ${cur.earned.total} right${first?" · first-time bonus +20 XP":""}</p>`:first?"<p>First-time bonus +20 XP</p>":""}</div>
    ${courseDone?`<div class="cert"><div class="label">Course complete</div><h3>You finished ${cur.c.name}!</h3><p>${d} lessons, every project built. TypeMonkey is officially impressed.</p></div>`:""}
    ${buddy(courseDone?"WE DID IT! Time to build something of your own in the Playground.":nx?`Next up: ${Q(nx.l.title)} Come back tomorrow to keep your streak alive!`:"That's everything in this course for now. More is on the way!","cheer")}
    <div class="row">${nx&&(nst==="open"||nst==="done")?`<button class="btn" id="nxt">Next lesson</button>`:""}${nx&&nst==="pro"?`<button class="btn banana" id="nxt">Unlock the next unit</button>`:""}<button class="btn ghost" id="back">Back to course</button></div>`);
  $("#back").onclick=()=>coursePage(cur.c.id);
  if($("#nxt"))$("#nxt").onclick=()=>nst==="pro"?coursePage(cur.c.id):startLesson(nx.l.id);
}

/* ---------- Playground ---------- */
const PLAY={
  js:{name:"JavaScript",file:"script.js",run:true,start:`// Try anything! Press ▶ Run.\nconst name = "TypeMonkey";\nfor (let i = 1; i <= 3; i++) {\n  console.log(\`\${name} says ook #\${i}\`);\n}\n`},
  py:{name:"Python",file:"main.py",start:`name = "TypeMonkey"\nfor i in range(1, 4):\n    print(f"{name} says ook #{i}")\n`},
  cs:{name:"C#",file:"Program.cs",start:`using System;\n\nclass Program {\n  static void Main() {\n    for (int i = 1; i <= 3; i++) {\n      Console.WriteLine($"TypeMonkey says ook #{i}");\n    }\n  }\n}\n`},
  cpp:{name:"C++",file:"main.cpp",start:`#include <iostream>\n\nint main() {\n  for (int i = 1; i <= 3; i++) {\n    std::cout << "TypeMonkey says ook #" << i << "\\n";\n  }\n  return 0;\n}\n`}
};
function playground(lang="js"){
  rerender=()=>playground(lang);
  const P=PLAY[lang];
  let saved;try{saved=(S.play||{})[lang]}catch(e){}
  $("#screen").innerHTML=`<div class="stack">
    <div class="row"><button class="btn ghost sm" id="back">← Home</button></div>
    <section class="hero"><div class="label">Playground</div><h1>Code anything.</h1><p>No lesson, no rules. Write code, run it, break it, fix it. Your code is saved as you type.</p></section>
    <div class="langs">${Object.entries(PLAY).map(([k,v])=>`<button class="lang" data-k="${k}" aria-pressed="${k===lang}">${v.name}</button>`).join("")}</div>
    ${P.run?"":`<div class="note">${P.name} needs its compiler, which ships inside the full TypeMonkey app. In this preview only JavaScript runs, so you can write ${P.name} here but not run it yet.</div>`}
    <div class="editor"><div class="head"><span>${P.file}</span><button class="linkbtn" id="clear" style="color:var(--code-dim)">Reset</button><button class="run" id="run-p" ${P.run?"":"disabled"}>▶ Run</button></div>
      <textarea id="code-p" spellcheck="false" autocapitalize="off" autocorrect="off" aria-label="Playground editor" rows="14">${esc(saved||P.start)}</textarea>
      <div class="console" id="out-p"><span class="dim">${P.run?"Output appears here":"Running "+P.name+" is coming in the full app"}</span></div></div>
    ${buddy(P.run?"Tip: console.log anything you're curious about. That's how pros explore code too.":"You can still practice typing "+P.name+" syntax here. Your code is saved.","happy")}
  </div>`;
  $("#back").onclick=home;
  $$(".lang").forEach(b=>b.onclick=()=>playground(b.dataset.k));
  const ta=$("#code-p");
  ta.addEventListener("input",()=>{S.play=S.play||{};S.play[lang]=ta.value;save()});
  ta.addEventListener("keydown",e=>{if(e.key==="Tab"){e.preventDefault();const s=ta.selectionStart;ta.value=ta.value.slice(0,s)+"  "+ta.value.slice(ta.selectionEnd);ta.selectionStart=ta.selectionEnd=s+2}});
  $("#clear").onclick=()=>{ta.value=P.start;S.play=S.play||{};delete S.play[lang];save()};
  if(P.run)$("#run-p").onclick=async()=>paintConsole($("#out-p"),await runCode(ta.value));
  foot();window.scrollTo(0,0);
}

$("#homeBtn").onclick=home;
renderStats();home();
</script>
