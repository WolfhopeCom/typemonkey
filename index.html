 {type:"talk",title:"Classes",
  body:`<p>Give elements a ${C("class")}, then select it in CSS with a dot: ${C(".name")}. Many elements can share a class.</p>`,
  demo:`<style>\n  .tag {\n    background: gold;\n    padding: 4px 10px;\n    border-radius: 99px;\n  }\n</style>\n<p><span class="tag">new</span> Banana bread</p>\n<p><span class="tag">hot</span> Mango smoothie</p>`,
  say:"<span> is an inline box you can style without starting a new line."},
 {type:"talk",title:"IDs",mood:"think",
  body:`<p>An ${C("id")} is unique: only one element per page should have it. Select it with ${C("#")}. Use classes for styling most of the time.</p>`,
  demo:`<style>\n  #hero { color: white; background: darkgreen; padding: 16px; }\n</style>\n<div id="hero">Welcome to the jungle</div>`,
  say:"<div> is a general-purpose block box. You'll use it constantly."},
 {type:"quiz",q:"How do you select class=\"price\" in CSS?",opts:[".price","#price","price"],a:0,mono:true,why:"Dot for class, hash for id, plain name for a tag."},
 {type:"fill",title:"Style the warning",body:`<p>Make the warning class red.</p>`,code:`<style>\n  [0]warning { color: red; }\n</style>\n<p class="[1]">Don't feed the parrot!</p>`,blanks:[".","warning"],tokens:[".","warning","#","alert"],why:".warning matches class=\"warning\"."},
 {type:"code",title:"Highlight the deal",
  body:`<p>Give the second paragraph the class ${C("deal")}, then make ${C(".deal")} have a ${C("background")} of ${C("yellow")}.</p>`,
  start:`<style>\n</style>\n\n<p>Bananas $1</p>\n<p>Mangoes $2 (half price!)</p>\n<p>Kiwis $3</p>\n`,
  checks:[{sel:"p.deal",text:/Mango/,msg:"Add class=\"deal\" to the mango paragraph."},{sel:".deal",style:{"background-color":"yellow"},msg:"Give .deal a yellow background."},{sel:"p:not(.deal)",count:2,msg:"Only the mango paragraph should have the deal class."}],
  hint:`<style>\n  .deal { background: yellow; }\n</style>\n\n<p>Bananas $1</p>\n<p class="deal">Mangoes $2 (half price!)</p>\n<p>Kiwis $3</p>`},
 {type:"done"}]},
{id:"web6",title:"The box model",sub:"padding, border, margin",steps:[
 {type:"talk",title:"Everything is a box",
  body:`<p>Every element is a box with layers: <b>content</b>, then <b>padding</b> (space inside), <b>border</b>, and <b>margin</b> (space outside).</p>`,
  demo:`<style>\n  .box {\n    background: #FFE3C7;\n    padding: 20px;\n    border: 4px solid #FF7A1A;\n    margin: 16px;\n  }\n</style>\n<div class="box">I'm a box!</div>\n<div class="box">Me too!</div>`,
  say:"Padding is inside the border. Margin pushes other boxes away."},
 {type:"talk",title:"Rounded corners and sizes",mood:"think",
  body:`<p>${C("border-radius")} rounds the corners. ${C("width")} and ${C("max-width")} control size.</p>`,
  demo:`<style>\n  .pill { background: teal; color: white; padding: 10px 20px; border-radius: 999px; width: fit-content; }\n  .card { max-width: 220px; padding: 16px; border: 2px solid #ddd; border-radius: 16px; }\n</style>\n<div class="pill">Pill button</div>\n<br>\n<div class="card">A card that never gets wider than 220px.</div>`,
  say:"999px radius is a trick for perfectly round ends."},
 {type:"quiz",q:"Which adds space INSIDE the border?",opts:["padding","margin","gap"],a:0,mono:true,why:"Padding is inside. Margin is outside."},
 {type:"fill",title:"Round it",body:`<p>Round the corners by 12px.</p>`,code:`<style>\n  .card { [0]: 12px; }\n</style>`,blanks:["border-radius"],tokens:["border-radius","corner","round","radius"],why:"border-radius rounds the corners."},
 {type:"code",title:"Make a card",
  body:`<p>Style ${C(".card")} with ${C("padding: 16px")}, a ${C("border")} of ${C("2px solid orange")}, and ${C("border-radius: 12px")}.</p>`,
  start:`<style>\n  .card {\n  }\n</style>\n\n<div class="card">\n  <h3>Mo</h3>\n  <p>Age 4 · loves bananas</p>\n</div>\n`,
  checks:[{sel:".card",style:{"padding-top":"16px","padding-left":"16px"},msg:"Give the card padding: 16px."},{sel:".card",style:{"border-top-width":"2px","border-top-style":"solid","border-top-color":"orange"},msg:"Give the card border: 2px solid orange."},{sel:".card",style:{"border-top-left-radius":"12px"},msg:"Give the card border-radius: 12px."}],
  hint:`<style>\n  .card {\n    padding: 16px;\n    border: 2px solid orange;\n    border-radius: 12px;\n  }\n</style>\n\n<div class="card">\n  <h3>Mo</h3>\n  <p>Age 4 · loves bananas</p>\n</div>`},
 {type:"done"}]}
]};

const WEB_UNIT3={name:"Layout",lessons:[
{id:"web7",title:"Flexbox",sub:"lining things up in a row",steps:[
 {type:"talk",title:"display: flex",
  body:`<p>Add ${C("display: flex")} to a container and its children line up in a row. ${C("gap")} adds space between them.</p>`,
  demo:`<style>\n  .row { display: flex; gap: 10px; }\n  .row div { background: #FFD25C; padding: 12px; border-radius: 8px; }\n</style>\n<div class="row">\n  <div>One</div>\n  <div>Two</div>\n  <div>Three</div>\n</div>`,

 {type:"talk",title:"Aligning",mood:"think",
  body:`<p>${C("justify-content")} spreads items along the row (${C("center")}, ${C("space-between")}). ${C("align-items")} lines them up across it. ${C("flex-wrap: wrap")} lets them drop to a new line.</p>`,
  demo:`<style>\n  .nav { display: flex; justify-content: space-between; align-items: center; background: #14201B; color: white; padding: 10px 14px; border-radius: 10px; }\n  .links { display: flex; gap: 12px; }\n</style>\n<div class="nav">\n  <b>🐒 TypeMonkey</b>\n  <div class="links"><span>Learn</span><span>Play</span></div>\n</div>`,
  say:"A real nav bar in a few lines!"},
 {type:"quiz",q:"Which property turns on flexbox?",opts:["display: flex","flex: on","position: flex"],a:0,mono:true,why:"It goes on the parent container."},
 {type:"fill",title:"Center everything",body:`<p>Center the items in the row.</p>`,code:`<style>\n  .row { display: [0]; justify-content: [1]; }\n</style>`,blanks:["flex","center"],tokens:["flex","center","middle","block"],why:"display: flex, then justify-content: center."},

  body:`<p>Make ${C(".buttons")} a flex row with a ${C("gap")} of ${C("8px")}.</p>`,
  start:`<style>\n  .buttons {\n  }\n  button { padding: 8px 14px; }\n</style>\n\n<div class="buttons">\n  <button>Play</button>\n  <button>Learn</button>\n  <button>Shop</button>\n</div>\n`,
  checks:[{sel:".buttons",style:{display:"flex"},msg:"Set display: flex on .buttons."},{sel:".buttons",style:{"column-gap":"8px"},msg:"Set gap: 8px on .buttons."}],

 {type:"done"}]},
{id:"web8",title:"CSS Grid",sub:"rows and columns",steps:[
 {type:"talk",title:"display: grid",
  body:`<p>Grid lays things out in columns <b>and</b> rows. ${C("grid-template-columns: 1fr 1fr 1fr")} makes three equal columns. ${C("fr")} means "a fraction of the space".</p>`,
  demo:`<style>\n  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }\n  .grid div { background: #CDEFD9; padding: 14px; text-align: center; border-radius: 8px; }\n</style>\n<div class="grid">\n  <div>🐒</div><div>🦜</div><div>🐼</div>\n  <div>🦒</div><div>🦉</div><div>🍌</div>\n</div>`,
  say:"Six items, three columns, so two rows appear automatically."},
 {type:"talk",title:"repeat()",mood:"think",
  body:`<p>${C("repeat(4, 1fr)")} is short for four equal columns. Columns can be different sizes too: ${C("2fr 1fr")}.</p>`,
  demo:`<style>\n  .layout { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }\n  .layout div { background: #E6E1FF; padding: 14px; border-radius: 8px; }\n</style>\n<div class="layout">\n  <div>Main content (2 parts)</div>\n  <div>Sidebar (1 part)</div>\n</div>`,
  say:"Flexbox for one row, grid for two dimensions. That's the rule of thumb."},
 {type:"quiz",q:"What does grid-template-columns: repeat(3, 1fr) make?",opts:["Three equal columns","Three rows","One column 3 times wider"],a:0,mono:true,why:"repeat(3, 1fr) = 1fr 1fr 1fr."},
 {type:"fill",title:"Two columns",body:`<p>Make a two-column grid.</p>`,code:`<style>\n  .g { display: [0]; grid-template-columns: [1]; }\n</style>`,blanks:["grid","1fr 1fr"],tokens:["grid","1fr 1fr","flex","2fr"],why:"display: grid with two 1fr columns."},
 {type:"code",title:"Photo wall",
  body:`<p>Make ${C(".wall")} a grid with ${C("grid-template-columns: repeat(3, 1fr)")}.</p>`,
  start:`<style>\n  .wall {\n  }\n  .wall div { background: #FFD25C; height: 60px; border-radius: 8px; }\n</style>\n\n<div class="wall">\n  <div></div><div></div><div></div>\n  <div></div><div></div><div></div>\n</div>\n`,
  checks:[{sel:".wall",style:{display:"grid"},msg:"Set display: grid on .wall."},{sel:".wall",style:{"grid-template-columns":/^(\S+\s+){2}\S+$/},msg:"Give .wall three columns with repeat(3, 1fr)."}],
  hint:`<style>\n  .wall {\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: 8px;\n  }\n  .wall div { background: #FFD25C; height: 60px; border-radius: 8px; }\n</style>\n\n<div class="wall">\n  <div></div><div></div><div></div>\n  <div></div><div></div><div></div>\n</div>`},
 {type:"done"}]},

const WEB_UNIT4={name:"Real web pages",lessons:[
{id:"web10",title:"Forms & buttons",sub:"input, label, button, select",steps:[
 {type:"talk",title:"Collecting input",
  body:`<p>Forms collect information. ${C("&lt;label&gt;")} names a field, and ${C("&lt;input&gt;")} is the field. Connect them with ${C("for")} and ${C("id")}.</p>`,
  demo:`<form>\n  <label for="name">Your name</label><br>\n  <input id="name" type="text" placeholder="Mo">\n  <br><br>\n  <label for="age">Age</label><br>\n  <input id="age" type="number" min="1">\n  <br><br>\n  <button type="button">Sign up</button>\n</form>`,
  say:"Tap a label and the cursor jumps into its input. That's the for/id connection."},
 {type:"talk",title:"More input types",mood:"think",
  body:`<p>${C("type")} changes the input: ${C("email")}, ${C("password")}, ${C("checkbox")}, ${C("date")}. ${C("&lt;select&gt;")} makes a dropdown.</p>`,
  demo:`<label><input type="checkbox"> I love bananas</label><br><br>\n<label for="fav">Favorite fruit</label>\n<select id="fav">\n  <option>Banana</option>\n  <option>Mango</option>\n</select><br><br>\n<input type="password" placeholder="Secret">`,
  say:"Phones even show a different keyboard for email and number inputs."},
 {type:"quiz",q:"How does a label connect to its input?",opts:["The label's for matches the input's id","They must be next to each other","The label goes after the input"],a:0,why:"for=\"name\" points at id=\"name\"."},
 {type:"fill",title:"An email field",body:`<p>Make an email input.</p>`,code:`<input [0]="email" placeholder="you@example.com">`,blanks:["type"],tokens:["type","kind","format","id"],why:"type=\"email\" makes an email field."},
 {type:"code",title:"Join the club form",
  body:`<p>Build a form with a ${C("&lt;label&gt;")}, an ${C("&lt;input type=\"email\"&gt;")} and a ${C("&lt;button&gt;")}.</p>`,
  start:`<h2>Join the Banana Club</h2>\n<form>\n</form>\n`,
  checks:[{sel:"form label",msg:"Add a <label> inside the form."},{sel:"form input[type=email]",msg:"Add <input type=\"email\"> inside the form."},{sel:"form button",msg:"Add a <button> inside the form."}],
  hint:`<h2>Join the Banana Club</h2>\n<form>\n  <label for="email">Email</label><br>\n  <input id="email" type="email"><br><br>\n  <button type="button">Join</button>\n</form>`},
 {type:"done"}]},
{id:"web11",title:"Semantic HTML",sub:"header, nav, main, footer, accessibility",steps:[
 {type:"talk",title:"Tags with meaning",
  body:`<p>Instead of ${C("&lt;div&gt;")} everywhere, <b>semantic</b> tags describe what a section is: ${C("&lt;header&gt;")}, ${C("&lt;nav&gt;")}, ${C("&lt;main&gt;")}, ${C("&lt;section&gt;")} and ${C("&lt;footer&gt;")}.</p>`,
  demo:`<header>\n  <h1>TypeMonkey News</h1>\n  <nav><a href="#">Home</a> · <a href="#">Games</a></nav>\n</header>\n<main>\n  <section>\n    <h2>Monkey learns CSS</h2>\n    <p>Experts are amazed.</p>\n  </section>\n</main>\n<footer>© 2026 TypeMonkey</footer>`,
  say:"It looks the same, but screen readers and search engines understand it much better."},
 {type:"talk",title:"Accessibility",mood:"think",
  body:`<p>Accessible pages work for everyone: alt text on images, labels on inputs, real ${C("&lt;button&gt;")}s for actions, and enough color contrast to read easily.</p>`,
  demo:`<button type="button">✅ Good: a real button</button>\n<p style="color:#ccc">❌ Hard to read: light gray on white</p>\n<p style="color:#333">✅ Easy to read: dark text</p>`,
  say:"About 1 in 4 adults has some kind of disability. Accessible design matters."},
 {type:"quiz",q:"Which tag is for the main navigation links?",opts:["<nav>","<links>","<menu-bar>"],a:0,mono:true,why:"nav marks a group of navigation links."},
 {type:"order",title:"Page outline",body:`<p>Put the page sections in order, top to bottom.</p>`,lines:["<header>…</header>","<main>…</main>","<footer>…</footer>"],why:"Header at the top, main content, footer at the bottom.",noRun:true},
 {type:"code",title:"Make it semantic",
  body:`<p>Build a page with a ${C("&lt;header&gt;")} containing an ${C("&lt;h1&gt;")}, a ${C("&lt;main&gt;")} with a paragraph, and a ${C("&lt;footer&gt;")}.</p>`,
  start:`<!-- header, main, footer -->\n`,
  checks:[{sel:"header h1",msg:"Put an <h1> inside a <header>."},{sel:"main p",msg:"Put a <p> inside <main>."},{sel:"footer",msg:"Add a <footer>."}],
  hint:`<header>\n  <h1>My Site</h1>\n</header>\n<main>\n  <p>Welcome to my page.</p>\n</main>\n<footer>Made with 🍌</footer>`},
 {type:"done"}]},

 {type:"code",title:"Step 3: the sign-up form",

 {type:"talk",title:"The finished page",mood:"cheer",

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function buddy(text,mood="happy"){return `<div class="buddy bounce">${monkey(mood)}<div class="bubble">${text}</div></div>`}
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,2800)}
const Q=t=>`“${t}${/[?!.]$/.test(t)?"":"."}”`;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const WINS=["Nailed it!","Clean code. Love it.","Ook ook! That's right!","You're on fire!","Banana-level genius."];

/* ---------- State ---------- */
const KEY="typemonkey-v1";
let S={xp:0,bananas:0,streak:0,lastDay:null,done:[],progress:{},pro:false,tester:false};

if(S.inProgress){S.progress=S.progress||{};if(S.inProgress.id)S.progress[S.inProgress.id]={step:S.inProgress.step,earned:S.inProgress.earned,drafts:{}};delete S.inProgress}

function renderStats(){$("#sStreak").textContent=S.streak;$("#sBan").textContent=S.bananas;$("#sXp").textContent=S.xp}
const dayStr=d=>d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
function bumpStreak(){const t=dayStr(new Date());if(S.lastDay===t)return;const y=dayStr(new Date(Date.now()-864e5));S.streak=S.lastDay===y?S.streak+1:1;S.lastDay=t}

/* ---------- Code runner: in-page, loop-guarded, with a fallback if eval is blocked ---------- */
function guardLoops(code){
  const G="__tmG()";let res="",i=0;const re=/\b(for|while)\s*\(|\bdo\s*\{/g;
  while(i<code.length){
    re.lastIndex=i;const m=re.exec(code);
    if(!m){res+=code.slice(i);break}
    res+=code.slice(i,m.index);
    if(m[0].startsWith("do")){res+="do{"+G+";";i=m.index+m[0].length;continue}
    let j=m.index+m[0].length,depth=1,q=null;const start=j;
    for(;j<code.length&&depth;j++){const ch=code[j];
      if(q){if(ch==="\\")j++;else if(ch===q)q=null;continue}
      if(ch==='"'||ch==="'"||ch==="`")q=ch;else if(ch==="(")depth++;else if(ch===")")depth--;}
    if(depth){res+=code.slice(m.index);break}
    const inner=code.slice(start,j-1);let out;
    if(m[1]==="while")out=`while(${G}&&(${inner}))`;
    else{
      let parts=[],d=0,last=0,qq=null;
      for(let k=0;k<inner.length;k++){const ch=inner[k];
        if(qq){if(ch==="\\")k++;else if(ch===qq)qq=null;continue}
        if(ch==='"'||ch==="'"||ch==="`")qq=ch;else if("([{".includes(ch))d++;else if(")]}".includes(ch))d--;
        else if(ch===";"&&!d){parts.push(inner.slice(last,k));last=k+1}}
      parts.push(inner.slice(last));
      if(parts.length===3)out=`for(${parts[0]};${G}&&(${parts[1].trim()||"true"});${parts[2]})`;
      else{const b=code.slice(j).match(/^\s*\{/);out=`for(${inner})`+(b?b[0]+G+";":"");if(b)j+=b[0].length}
    }
    res+=out;i=j;
  }
  return res;
}
function makeConsole(out){
  const fmt=v=>typeof v==="string"?v:(()=>{try{const j=JSON.stringify(v);return j===undefined?String(v):j}catch(_){return String(v)}})();
  const lg=(...a)=>out.push(["log",a.map(fmt).join(" ")]);
  return {log:lg,info:lg,warn:lg,error:(...a)=>out.push(["err",a.map(fmt).join(" ")])};
}
let evalBlocked=false;
function runCode(code){
  const out=[];const con=makeConsole(out);
  const body="let __tmN=0;const __tmG=()=>{if(++__tmN>100000)throw new Error('Your loop ran 100,000 times, so I stopped it. Check that it can end.');return true};\n"+guardLoops(code);
  if(!evalBlocked){
    let fn=null;
    try{fn=new Function("console",body)}catch(err){
      if(err instanceof SyntaxError){out.push(["err","SyntaxError: "+err.message]);return Promise.resolve(out)}
      evalBlocked=true;
    }
    if(fn){try{fn(con)}catch(err){out.push(["err",(err.name||"Error")+": "+err.message])}return Promise.resolve(out)}
  }
  return new Promise(res=>{
    window.__tmCon=con;
    const onErr=e=>{out.push(["err",String(e.message||e).replace(/^Uncaught /,"").replace(/Failed to execute '\w+' on '\w+': /,"")]);e.preventDefault&&e.preventDefault()};
    window.addEventListener("error",onErr);
    const s=document.createElement("script");
    s.textContent="(function(console){try{"+body+"\n}catch(err){console.error((err.name||'Error')+': '+err.message)}})(window.__tmCon);";
    document.body.appendChild(s);s.remove();window.removeEventListener("error",onErr);res(out);
  });
}
function paintConsole(el,out){
  el.innerHTML=out.length?out.map(([k,v])=>`<div class="${k==="err"?"err":""}">${k==="err"?"✖ ":"› "}${esc(v)}</div>`).join(""):'<span class="dim">(nothing printed. Try console.log)</span>';
}

/* ---------- Grading code challenges ---------- */
const norm=l=>{l=String(l).trim();return /^[\[{]/.test(l)?l.replace(/\s+/g,""):l};
function checkOut(st,out){
  const err=out.find(o=>o[0]==="err");
  if(err)return [false,"Your code hit an error. Read the red line in the console. A missing quote, bracket or brace is the usual suspect."];
  const logs=out.filter(o=>o[0]==="log").map(o=>o[1]);
  if(st.out){
    const ok=st.out.length===logs.length&&st.out.every((e,i)=>norm(e)===norm(logs[i]));
    if(!ok)return [false,"Close! The output doesn't match yet.",`Expected:\n${st.out.join("\n")}\n\nYou printed:\n${logs.join("\n")||"(nothing)"}`];
  }
  for(const [re,msg] of st.outRe||[])if(!logs.some(l=>re.test(l)))return [false,msg];
  return [true];
}
async function grade(st,code){
  for(const [re,msg] of st.use||[])if(!re.test(code))return [false,msg];
  const r=checkOut(st,await runCode(code));if(!r[0])return r;
  for(const [find,rep,lines] of st.variants||[]){
    if(!find.test(code))continue;
    const r2=checkOut({out:lines},await runCode(code.replace(find,rep)));
    if(!r2[0])return [false,`Works for this example, but I changed the starting value (${rep}) and it broke. Make sure your code uses the variables instead of fixed answers.`,r2[2]];
  }
  return [true,st.win||pick(WINS)];
}

/* ---------- Web preview (HTML & CSS course): renders into an isolated shadow root ---------- */
const WEB_BASE='<style>:host{all:initial;display:block;background:#fff;color:#111;font:16px/1.45 system-ui,-apple-system,sans-serif;padding:12px;min-height:72px;overflow:auto}img{max-width:100%}</style>';
function renderWeb(host,code){
  const root=host.shadowRoot||host.attachShadow({mode:"open"});
  root.innerHTML=WEB_BASE+code.replace(/<script[\s\S]*?<\/script>/gi,"");
  return root;
}
let webScratch=null;
function sameCss(root,prop,expected,actual){
  const probe=document.createElement("span");probe.style.setProperty(prop,expected);root.appendChild(probe);
  const want=getComputedStyle(probe).getPropertyValue(prop);probe.remove();
  return want===actual||String(expected).trim()===String(actual).trim();
}
function gradeWebNow(st,code){
  for(const [re,msg] of st.use||[])if(!re.test(code))return [false,msg];
  if(!webScratch){webScratch=document.createElement("div");webScratch.style.cssText="position:absolute;left:-9999px;top:0;width:360px";document.body.appendChild(webScratch)}
  const root=renderWeb(webScratch,code);
  for(const ck of st.checks||[]){
    const els=[...root.querySelectorAll(ck.sel)];
    if(!els.length)return [false,ck.msg];
    if(ck.count&&els.length<ck.count)return [false,ck.msg];
    const el=els[0];
    if(ck.text&&!els.some(e=>ck.text.test(e.textContent.trim())))return [false,ck.msg];
    if(ck.attr&&!(el.getAttribute(ck.attr[0])||"").match(ck.attr[1]))return [false,ck.msg];
    if(ck.style){const cs=getComputedStyle(el);for(const [p,v] of Object.entries(ck.style)){
      const actual=cs.getPropertyValue(p);
      const ok=v instanceof RegExp?v.test(actual):sameCss(root,p,v,actual);
      if(!ok)return [false,ck.msg]}}
  }
  return [true,st.win||pick(WINS)];
}

/* ---------- SQL tables ---------- */
function tableHTML(c,name){

function findLesson(id){for(const c of COURSES){const f=flat(c).find(x=>x.l.id===id);if(f)return {c,...f}}return null}
function status(c,item){

}

function order(s){

/* ---------- TypeMonkey Jr.: maze puzzles ---------- */
const DIRS={N:[0,-1],E:[1,0],S:[0,1],W:[-1,0]},LEFT={N:"W",W:"S",S:"E",E:"N"},RIGHT={N:"E",E:"S",S:"W",W:"N"},ROT={E:0,S:90,W:180,N:270};
const BLOCKS={fwd:{icon:"👣",label:"Forward"},left:{icon:"↺",label:"Turn left"},right:{icon:"↻",label:"Turn right"},rep:{icon:"🔁",label:"Repeat"}};
function mazeInfo(g){let start,goal;g.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch==="S")start=[x,y];if(ch==="B")goal=[x,y]}));return {start,goal,w:g[0].length,h:g.length}}
function expandProg(prog){const out=[];for(const b of prog){if(typeof b==="object"){for(let i=0;i<b.rep;i++)out.push(...b.body)}else out.push(b)}return out}
const blockCount=prog=>prog.reduce((n,b)=>n+(typeof b==="object"?1+b.body.length:1),0);
function simulate(grid,dir,prog){
  const m=mazeInfo(grid);let [x,y]=m.start,d=dir;const path=[[x,y,d]];
  for(const t of expandProg(prog)){
    if(t==="left")d=LEFT[d];else if(t==="right")d=RIGHT[d];
    else{const [dx,dy]=DIRS[d];const nx=x+dx,ny=y+dy;const ch=(grid[ny]||"")[nx];
      if(ch===undefined||ch==="#"){path.push([x,y,d,"bump"]);return {path,result:"wall"}}
      x=nx;y=ny}
    path.push([x,y,d]);
    if(x===m.goal[0]&&y===m.goal[1])return {path,result:"win"};
  }
  return {path,result:"short"};
}
function maze(s){
  const m=mazeInfo(s.grid);let prog=JSON.parse(JSON.stringify(s.start||[]));let open=null,running=false,fails=0,won=false;
  const cell=ch=>ch==="#"?"🌴":ch==="B"?"🍌":"";
  shell(`<div class="card"><div class="label">Monkey maze${s.max?` · use ${s.max} blocks or fewer`:""} · +15 XP</div><h2>${s.title}</h2>${s.body||""}
    <div class="maze" style="--w:${m.w};--h:${m.h}" id="mz">${s.grid.map((row,y)=>[...row].map((ch,x)=>`<div class="mc ${ch==="#"?"tree":"path"}">${cell(ch)}</div>`).join("")).join("")}<div class="mk" id="mk"><div class="mface" id="mface">${monkey("happy")}</div><span class="arr" id="arr">➜</span></div></div>
    <div class="label">Your program</div><div class="prog" id="prog"></div>
    <div class="palette">${s.blocks.map(b=>`<button class="blk b-${b}" data-b="${b}"><span>${BLOCKS[b].icon}</span>${BLOCKS[b].label}</button>`).join("")}</div>
    <div id="fb"></div></div>
    <div id="bud">${buddy(s.say||"Tap the blocks to build a program, then press Go!","think")}</div>
    <div class="row"><button class="btn banana" id="run">▶ Go!</button><button class="btn ghost" id="undo">Undo</button><button class="btn ghost" id="clr">Clear</button><button class="btn ghost" id="hint" hidden>Show me</button><button class="btn" id="go" hidden>Continue</button></div>`);
  const place=(x,y,d,bump)=>{const k=$("#mk");k.style.left=`calc(${x} * 100% / ${m.w})`;k.style.top=`calc(${y} * 100% / ${m.h})`;k.style.transform=bump?"translateX(4px)":"none";$("#arr").style.transform=`rotate(${ROT[d]}deg)`};
  const reset=()=>place(m.start[0],m.start[1],s.dir);
  const draw=()=>{
    const chip=(b,i,j)=>`<button class="chip" data-i="${i}" ${j!==undefined?`data-j="${j}"`:""} aria-label="Remove ${BLOCKS[b].label}">${BLOCKS[b].icon}</button>`;
    $("#prog").innerHTML=prog.length?prog.map((b,i)=>typeof b==="object"?
      `<span class="repblk ${open===i?"open":""}"><button class="repn" data-r="${i}" aria-label="Change repeat count">🔁 ×${b.rep}</button>${b.body.map((t,j)=>chip(t,i,j)).join("")}${open===i?`<button class="repclose" data-c="${i}">done</button>`:""}</span>`:chip(b,i)).join(""):'<span class="empty">Tap blocks below to add them here</span>';
    $$("#prog .chip").forEach(c=>c.onclick=()=>{if(running||won)return;const i=+c.dataset.i;if(c.dataset.j!==undefined)prog[i].body.splice(+c.dataset.j,1);else{prog.splice(i,1);if(open!==null&&i<open)open--}draw()});
    $$("#prog .repn").forEach(c=>c.onclick=()=>{if(running||won)return;const b=prog[+c.dataset.r];b.rep=b.rep>=5?2:b.rep+1;draw()});
    $$("#prog .repclose").forEach(c=>c.onclick=()=>{open=null;draw()});
  };
  $$(".blk").forEach(b=>b.onclick=()=>{
    if(running||won)return;const t=b.dataset.b;
    if(t==="rep"){if(open!==null)return toast("Finish the repeat you're building first (tap done).");prog.push({rep:2,body:[]});open=prog.length-1}
    else if(open!==null)prog[open].body.push(t);else prog.push(t);
    draw();
  });
  $("#undo").onclick=()=>{if(running||won)return;if(open!==null&&prog[open].body.length)prog[open].body.pop();else{prog.pop();open=null}draw()};
  $("#clr").onclick=()=>{if(running||won)return;prog=[];open=null;draw();reset()};
  $("#hint").onclick=()=>{prog=JSON.parse(JSON.stringify(s.solution));open=null;draw();reset();$("#bud").innerHTML=buddy("Here's one way. Press Go to watch it work!","happy")};
  $("#run").onclick=()=>{
    if(running||won||!prog.length)return;running=true;open=null;draw();reset();
    const {path,result}=simulate(s.grid,s.dir,prog);let k=1;
    const tick=()=>{
      if(k<path.length){const [x,y,d,bump]=path[k];place(x,y,d,bump);k++;return setTimeout(tick,380)}
      running=false;
      const tooMany=s.max&&blockCount(prog)>s.max;
      if(result==="win"&&!tooMany){won=true;award(15,3);$("#mface").innerHTML=monkey("cheer");$("#fb").innerHTML=`<div class="feedback good">🍌 Banana reached! ${esc(s.win||pick(WINS))}</div>`;
        $("#bud").innerHTML=buddy("YES! Your program worked!","cheer");["run","undo","clr","hint"].forEach(i=>$("#"+i).hidden=true);$("#go").hidden=false;return}
      fails++;$("#mface").innerHTML=monkey("oops");setTimeout(()=>{const f=$("#mface");if(f)f.innerHTML=monkey("happy")},900);
      const msg=result==="win"?`You got there, but used ${blockCount(prog)} blocks. Can you do it with ${s.max} or fewer? Try a Repeat block!`:result==="wall"?"Bonk! TypeMonkey bumped into a tree. Find the step that went wrong and fix it.":"So close! TypeMonkey stopped before reaching the banana. Add more steps.";
      $("#fb").innerHTML=`<div class="feedback bad">${msg}</div>`;
      $("#bud").innerHTML=buddy(fails>=3?"Want a peek? Tap “Show me”.":"Bugs are normal! Every coder fixes their programs.","oops");
      if(fails>=2&&s.solution)$("#hint").hidden=false;
    };
    setTimeout(tick,200);
  };
  draw();reset();$("#go").onclick=next;
}

/* ---------- Mini-game: Output Rush ---------- */
function gameIntro(){
  if(!cur.l.pool||!cur.l.pool.length)return next();
  shell(`<div class="card"><div class="label">Mini-game</div><h2>Output Rush</h2><p>45 seconds on the clock. Read each snippet and tap what it prints. Every right answer earns 2 bananas.</p></div>
    ${buddy("Speed round! Don't overthink it.","cheer")}<div class="row"><button class="btn banana" id="go">Start the clock</button><button class="btn ghost" id="skip">Skip</button></div>`);
  $("#go").onclick=()=>rush(cur.l.pool.map(p=>[p[0],p[1],cur.c.lang,cur.c.rushHint]),45,(score)=>{award(score*3,score*2);next()},()=>coursePage(cur.c.id));
  $("#skip").onclick=next;
}
function rush(poolIn,secs,onEnd,onQuit){
  const pool=shuffle(poolIn);let i=0,score=0,left=secs,ended=false;
  const timer=setInterval(()=>{left--;const t=$("#tleft");if(t){t.textContent=left;$("#tbar").style.width=(left/secs*100)+"%"}if(left<=0)end()},1000);
  function end(){if(ended)return;ended=true;clearInterval(timer);
    $("#screen").innerHTML=`<div class="stack"><div class="card" style="align-items:center;text-align:center"><div class="label">Time!</div><div class="big">${score}/${pool.length}</div><p>+${score*2} bananas · +${score*3} XP</p></div>
      ${buddy(score>=Math.ceil(pool.length*.8)?"Unreal speed. Are you secretly a monkey?":score>=pool.length/2?"Solid run! Practice makes it automatic.":"Good warm-up. These get easy fast.",score>=pool.length/2?"cheer":"happy")}
      <div class="row"><button class="btn" id="fin">Continue</button></div></div>`;
    $("#fin").onclick=()=>onEnd(score);}
  function round(){
    if(i>=pool.length)return end();
    const [code,opts,file="script.js",hint]=pool[i];const ord=shuffle(opts.map((o,k)=>k));
    $("#screen").innerHTML=`<div class="stack"><div class="game-hud"><button class="x" id="quitg" aria-label="Quit game">×</button><span>⏱ <span id="tleft">${left}</span>s</span><div class="timer"><span id="tbar" style="width:${left/secs*100}%"></span></div><span>🍌 ${score*2}</span></div>
      <div class="card"><div class="label">What prints? · ${i+1} of ${pool.length}</div><div class="editor"><div class="head"><span>${file}</span></div><pre>${esc(code)}</pre></div>
      <p style="color:var(--muted);font-size:.85rem">${hint||"Several lines of output are shown with spaces between them."}</p>
      <div class="opts">${ord.map(k=>`<button class="opt mono" data-k="${k}">${esc(opts[k])}</button>`).join("")}</div></div></div>`;
    $("#quitg").onclick=()=>{clearInterval(timer);ended=true;onQuit()};
    $$(".opt").forEach(b=>b.onclick=()=>{
      const ok=+b.dataset.k===0;b.classList.add(ok?"right":"wrong");if(ok)score++;
      $$(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.k===0)x.classList.add("right")});
      setTimeout(()=>{i++;if(!ended)round()},ok?350:900);
    });
  }
  round();
}
function practice(){
  rerender=home;
  let pool=[];
  const add=(c,l)=>pool.push(...l.pool.map(p=>[p[0],p[1],c.lang,c.rushHint]));
  for(const c of COURSES)for(const x of flat(c))if(S.done.includes(x.l.id)&&x.l.pool)add(c,x.l);
  if(!pool.length)add(COURSES[0],COURSES[0].units[0].lessons[0]);
  pool=shuffle(pool).slice(0,12);
  $("#foot").innerHTML="";
  rush(pool,60,(score)=>{S.xp+=score*3;S.bananas+=score*2;if(score)bumpStreak();save();home()},home);
}

/* ---------- Finish ---------- */
function finish(){
  const id=cur.l.id;const first=!S.done.includes(id);
  const bonus=first?20:0;cur.earned.xp+=bonus;
  S.xp+=cur.earned.xp;S.bananas+=cur.earned.ban;bumpStreak();if(first)S.done.push(id);delete S.progress[id];save();
  const L=flat(cur.c);const nx=L[cur.item.idx+1];const nst=nx&&status(cur.c,nx);
  const [d,n,all]=countLessons(cur.c);const courseDone=first&&d===n&&n===all;
  shell(`<div class="card" style="text-align:center;align-items:center"><div class="label">${cur.l.project?"Project complete":"Lesson complete"}</div><h2>${esc(cur.l.title)} ✓</h2>
    <div class="reward"><div><b>+${cur.earned.xp}</b><span>XP</span></div><div><b>+${cur.earned.ban}</b><span>Bananas</span></div><div><b>${S.streak}</b><span>Day streak</span></div></div>
    ${cur.earned.total?`<p>Quiz: ${cur.earned.right} of ${cur.earned.total} right${first?" · first-time bonus +20 XP":""}</p>`:first?"<p>First-time bonus +20 XP</p>":""}</div>
    ${courseDone?`<div class="cert"><div class="label">Course complete</div><h3>You finished ${cur.c.name}!</h3><p>${d} lessons, every project built. TypeMonkey is officially impressed.</p></div>`:""}
    ${buddy(courseDone?"WE DID IT! Time to build something of your own in the Playground.":nx?`Next up: ${Q(nx.l.title)} Come back tomorrow to keep your streak alive!`:"That's everything in this course for now. More is on the way!","cheer")}
    <div class="row">${nx&&(nst==="open"||nst==="done")?`<button class="btn" id="nxt">Next lesson</button>`:""}${nx&&nst==="pro"?`<button class="btn banana" id="nxt">Unlock the next unit</button>`:""}<button class="btn ghost" id="back">Back to course</button></div>`);
  $("#back").onclick=()=>coursePage(cur.c.id);
  if($("#nxt"))$("#nxt").onclick=()=>nst==="pro"?coursePage(cur.c.id):startLesson(nx.l.id);
}

/* ---------- Playground ---------- */
const PLAY={
  js:{name:"JavaScript",file:"script.js",run:true,start:`// Try anything! Press ▶ Run.\nconst name = "TypeMonkey";\nfor (let i = 1; i <= 3; i++) {\n  console.log(\`\${name} says ook #\${i}\`);\n}\n`},
  web:{name:"HTML & CSS",file:"index.html",web:true,start:`<style>\n  h1 { color: #FF7A1A; }\n  .card { background: #FFF4E5; padding: 12px; border-radius: 12px; }\n</style>\n\n<h1>TypeMonkey's page</h1>\n<div class="card">\n  <p>Change anything, then tap <b>Show page</b>!</p>\n</div>\n`},
  py:{name:"Python",file:"main.py",start:`name = "TypeMonkey"\nfor i in range(1, 4):\n    print(f"{name} says ook #{i}")\n`},
  cs:{name:"C#",file:"Program.cs",start:`using System;\n\nclass Program {\n  static void Main() {\n    for (int i = 1; i <= 3; i++) {\n      Console.WriteLine($"TypeMonkey says ook #{i}");\n    }\n  }\n}\n`},
  cpp:{name:"C++",file:"main.cpp",start:`#include <iostream>\n\nint main() {\n  for (int i = 1; i <= 3; i++) {\n    std::cout << "TypeMonkey says ook #" << i << "\\n";\n  }\n  return 0;\n}\n`}
};
function playground(lang="js"){
  rerender=()=>playground(lang);
  const P=PLAY[lang];
  let saved;try{saved=(S.play||{})[lang]}catch(e){}
  $("#screen").innerHTML=`<div class="stack">
    <div class="row"><button class="btn ghost sm" id="back">← Home</button></div>
    <section class="hero"><div class="label">Playground</div><h1>Code anything.</h1><p>No lesson, no rules. Write code, run it, break it, fix it. Your code is saved as you type.</p></section>
    <div class="langs">${Object.entries(PLAY).map(([k,v])=>`<button class="lang" data-k="${k}" aria-pressed="${k===lang}">${v.name}</button>`).join("")}</div>
    ${P.run||P.web?"":`<div class="note">${P.name} needs its compiler, which ships inside the full TypeMonkey app. In this preview only JavaScript runs, so you can write ${P.name} here but not run it yet.</div>`}
    <div class="editor"><div class="head"><span>${P.file}</span><button class="linkbtn" id="clear" style="color:var(--code-dim)">Reset</button><button class="run" id="run-p" ${P.run||P.web?"":"disabled"}>${P.web?"▶ Show page":"▶ Run"}</button></div>
      <textarea id="code-p" spellcheck="false" autocapitalize="off" autocorrect="off" aria-label="Playground editor" rows="14">${esc(saved||P.start)}</textarea>
      ${P.web?`<div class="webview" id="out-p"></div>`:`<div class="console" id="out-p"><span class="dim">${P.run?"Output appears here":"Running "+P.name+" is coming in the full app"}</span></div>`}</div>
    ${buddy(P.web?"Build any web page you like. The preview updates every time you tap Show page.":P.run?"Tip: console.log anything you're curious about. That's how pros explore code too.":"You can still practice typing "+P.name+" syntax here. Your code is saved.","happy")}
  </div>`;
  $("#back").onclick=home;
  $$(".lang").forEach(b=>b.onclick=()=>playground(b.dataset.k));
  const ta=$("#code-p");
  ta.addEventListener("input",()=>{S.play=S.play||{};S.play[lang]=ta.value;save()});
  ta.addEventListener("keydown",e=>{if(e.key==="Tab"){e.preventDefault();const s=ta.selectionStart;ta.value=ta.value.slice(0,s)+"  "+ta.value.slice(ta.selectionEnd);ta.selectionStart=ta.selectionEnd=s+2}});
  $("#clear").onclick=()=>{ta.value=P.start;S.play=S.play||{};delete S.play[lang];save()};
  if(P.run)$("#run-p").onclick=async()=>paintConsole($("#out-p"),await runCode(ta.value));
  if(P.web){renderWeb($("#out-p"),ta.value);$("#run-p").onclick=()=>renderWeb($("#out-p"),ta.value)}
  foot();window.scrollTo(0,0);
}

$("#homeBtn").onclick=home;
renderStats();home();
</script>
